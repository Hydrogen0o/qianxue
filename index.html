<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="潜学">
<meta name="theme-color" content="#071a20">
<meta name="description" content="潜学：认识海里的生物，知道去哪里看。个人学习用，非商业。">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>潜学</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&family=Noto+Sans+SC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:ital,wght@1,400;1,600&display=swap">
<style>
/* Layout: a dive-course catalogue — three core certifications descend in order, specialty routes branch off by group; articles read like field guides with a key line, points, live diagrams and species cards */
:root{
  --bg:#eef4f3; --surface:#fbfdfc; --line:#d3e3e1; --ink:#0f2a31; --muted:#5a7780;
  --deep:#0b5d6b; --deep-soft:#d6ebea; --coral:#d4533a; --coral-soft:#fae3db;
  --good:#1f8a5b; --good-soft:#d9f0e4; --bad:#c2412d; --bad-soft:#f7ddd7; --abyss:#0b3f4c;
  --f-display:"ZCOOL XiaoWei","Songti SC","STSong",serif;
  --f-body:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --f-sci:"Source Serif 4",Georgia,"Times New Roman",serif;
  --r:16px;
  --sea:#cfe4e9; --sea2:#bddbe2; --land:#f5f0e3; --landline:#c7bc9c; --hot:#dd5f3c; --rise:#8458d4; --gem:#0f8a7e; --closed:#8d9ca2;
}
/* 默认始终用深色主题，不跟随系统 */
@media all{:root,:root[data-theme="light"]{
  --bg:#071a20; --surface:#0d2830; --line:#1e424b; --ink:#e2efed; --muted:#8fb0b5;
  --deep:#5cc8cd; --deep-soft:#123b44; --coral:#ff8e70; --coral-soft:#3b2520;
  --good:#5fd199; --good-soft:#123826; --bad:#ff8a75; --bad-soft:#3d1f1a; --abyss:#020b0e; --sea:#0a2631; --sea2:#0e3240; --land:#2a444b; --landline:#40606a; --hot:#ff8e70; --rise:#b89bff; --gem:#4fd1c0; --closed:#6f8389; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#071a20; --surface:#0d2830; --line:#1e424b; --ink:#e2efed; --muted:#8fb0b5;
  --deep:#5cc8cd; --deep-soft:#123b44; --coral:#ff8e70; --coral-soft:#3b2520;
  --good:#5fd199; --good-soft:#123826; --bad:#ff8a75; --bad-soft:#3d1f1a; --abyss:#020b0e; --sea:#0a2631; --sea2:#0e3240; --land:#2a444b; --landline:#40606a; --hot:#ff8e70; --rise:#b89bff; --gem:#4fd1c0; --closed:#6f8389; color-scheme:dark}

html,body{height:100%}
body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.75;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--deep);text-underline-offset:3px}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--coral);outline-offset:2px}
.app{max-width:600px;margin:0 auto;min-height:100%;padding-bottom:90px;overflow-x:clip}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.sci{font-family:var(--f-sci);font-style:italic}
.lat{font-family:var(--f-mono);font-size:.8em;color:var(--muted)}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);line-height:1.4}
.eyebrow.light{color:rgba(255,255,255,.85)}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance;line-height:1.25}
p{margin:0}
.dim{color:var(--muted);font-size:12px}

/* bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar .in{display:flex;align-items:center;gap:10px;padding:11px 18px;min-height:48px}
.bar .t{flex:1;min-width:0;font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gauge{font-size:12.5px;color:var(--muted)}
.back{background:none;border:none;padding:0 8px 2px 0;font-size:26px;line-height:1;color:var(--deep)}
.prog{position:absolute;left:0;bottom:-1px;height:2px;background:var(--coral);width:0}

/* scenes / slots */
.slot{position:relative;width:100%;height:100%;overflow:hidden}
.slot>svg,.slot>img,.pwater>svg{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:cover}
.slot>img{z-index:1}
.credit{position:absolute;z-index:2;right:6px;bottom:6px;max-width:calc(100% - 12px);font-size:10px;line-height:1.3;color:#fff;background:rgba(4,22,29,.55);padding:2px 6px;border-radius:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ath .credit,.cth .credit,.spth .credit{display:none}
.addph{position:absolute;z-index:2;left:10px;bottom:10px;border:none;border-radius:99px;padding:5px 12px;font-size:12.5px;background:rgba(4,22,29,.6);color:#fff;backdrop-filter:blur(4px)}
.pwater{position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#2f8c9d}
.pwater.sm{aspect-ratio:4/3}

/* home */
.hero{position:relative;min-height:280px;display:flex;align-items:flex-end;overflow:hidden}
.herobg{position:absolute;inset:0}
.herobg svg{width:100%;height:100%;display:block}
.herobg .slot{position:absolute;inset:0}
.herotx{position:relative;z-index:3;padding:28px 20px 26px;display:flex;flex-direction:column;gap:8px;color:#fff;background:linear-gradient(transparent,rgba(4,30,38,.55) 45%);width:100%}
.hero h1{font-size:52px;line-height:1}
.hero p{max-width:30em;font-size:15px;color:rgba(255,255,255,.92)}
.continue{margin:18px 18px 0;display:flex;align-items:center;gap:14px;width:calc(100% - 36px);border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:10px 14px 10px 10px;text-align:left}
.cth{width:64px;height:64px;border-radius:12px;overflow:hidden;flex-shrink:0}
.ctx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.ctx b{font-size:16px}
.arrow{font-family:var(--f-mono);color:var(--coral);font-size:22px}
.sec{padding:44px 18px 0;display:flex;flex-direction:column;gap:18px}
.sechead{display:flex;flex-direction:column;gap:6px}
.sechead h2{font-size:30px}
.sechead p{color:var(--muted);font-size:14.5px}
.corepath{display:flex;flex-direction:column}
.ccard{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:0;overflow:hidden;text-align:left;display:flex;flex-direction:column;transition:transform .15s,border-color .15s}
.ccard:hover,.scard:hover,.arow:hover{border-color:var(--deep)}
.ccard:active,.scard:active,.arow:active{transform:scale(.985)}
.ccover{position:relative;aspect-ratio:16/7;overflow:hidden}
.ccover svg{position:absolute;inset:0;width:100%;height:100%}
.tier{position:absolute;left:14px;top:12px;background:var(--surface);color:var(--ink);font-weight:700;font-size:13px;padding:3px 12px;border-radius:99px}
.rng{position:absolute;right:14px;top:12px;color:#fff;font-size:13px;background:rgba(4,22,29,.45);padding:3px 10px;border-radius:99px}
.cbody{padding:16px 18px 18px;display:flex;flex-direction:column;gap:8px}
.cname{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.cname h3{font-size:26px}
.en{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.cbody p{font-size:14.5px;color:var(--muted);line-height:1.7}
.cmeta{display:flex;align-items:center;gap:10px}
.pbar{flex:1;height:5px;border-radius:5px;background:var(--line);overflow:hidden;max-width:220px}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--deep),var(--coral));border-radius:5px}
.pnum{font-size:12px;color:var(--muted)}
.descend{height:34px;display:flex;justify-content:center}
.descend span{width:2px;background:repeating-linear-gradient(var(--deep) 0 5px,transparent 5px 10px);position:relative}
.descend span::after{content:"";position:absolute;bottom:-2px;left:-4px;border:5px solid transparent;border-top-color:var(--deep)}
.sgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.scard{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:0;overflow:hidden;text-align:left;display:flex;flex-direction:column;transition:transform .15s,border-color .15s}
.scover{position:relative;aspect-ratio:4/3}
.scover svg{position:absolute;inset:0;width:100%;height:100%}
.sbody{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px}
.sbody b{font-size:15.5px;line-height:1.35}
.sbody .eyebrow{font-size:10px}
.sgrid .scard:last-child:nth-child(odd){grid-column:span 2}
.sgrid .scard:last-child:nth-child(odd) .scover{aspect-ratio:16/7}
.guide{display:flex;align-items:center;gap:12px;border:1px dashed var(--deep);background:transparent;border-radius:var(--r);padding:16px 18px;text-align:left}
.guide div{flex:1;display:flex;flex-direction:column;gap:2px}
.guide b{font-size:17px}
.guide p{font-size:14px;color:var(--muted)}
.foot{padding:28px 18px 8px;font-size:12.5px;color:var(--muted);line-height:1.6}

/* course page */
.cover{position:relative;aspect-ratio:16/9;max-height:300px;width:100%;overflow:hidden;background:#2f8c9d}
.cover>svg{position:absolute;inset:0;width:100%;height:100%}
.cover.tall{aspect-ratio:16/8}
.chead{padding:24px 18px 8px;display:flex;flex-direction:column;gap:12px}
.chead h1{font-size:36px}
.lede{font-size:16.5px;color:var(--muted);line-height:1.75}
.learn{border-left:3px solid var(--deep);padding:4px 0 4px 14px;display:flex;flex-direction:column;gap:6px}
.learn ul{margin:0;padding-left:18px;font-size:15px;display:flex;flex-direction:column;gap:2px}
.cmeta.big .pbar{max-width:none;height:6px}
.alist{list-style:none;margin:18px 0 0;padding:0 18px;display:flex;flex-direction:column;gap:12px;position:relative}
.alist::before{content:"";position:absolute;left:43px;top:10px;bottom:10px;width:2px;background:linear-gradient(var(--deep-soft),var(--deep))}
.arow{width:100%;display:grid;grid-template-columns:52px 76px minmax(0,1fr);gap:12px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:10px 12px 10px 0;text-align:left;position:relative;transition:transform .15s,border-color .15s}
.adepth{text-align:center;font-size:17px;font-weight:500;color:var(--deep);background:var(--surface);position:relative;z-index:1;line-height:1}
.adepth small{font-size:10px;color:var(--muted);margin-left:1px}
.ath{width:76px;height:76px;border-radius:12px;overflow:hidden}
.atx{display:flex;flex-direction:column;gap:3px;min-width:0}
.atitle{font-weight:700;font-size:16px;line-height:1.35}
.alede{font-size:13.5px;color:var(--muted);line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ameta{font-size:11.5px;color:var(--muted)}
.ameta em{font-style:normal;color:var(--coral)}

/* article */
article{display:flex;flex-direction:column}
.ahead{padding:24px 18px 0;display:flex;flex-direction:column;gap:10px}
.ahead h1{font-size:34px}
.key{margin:24px 18px 0;padding:18px 20px 20px;border-radius:var(--r);background:var(--deep);color:var(--bg);display:flex;flex-direction:column;gap:8px}
.key .eyebrow{color:inherit;opacity:.75}
.key p{font-family:var(--f-display);font-size:22px;line-height:1.5}
.pts{margin:12px 18px 0;padding:6px 18px;list-style:none;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.pts li{padding:11px 0 11px 22px;position:relative;font-size:15px;line-height:1.6}
.pts li+li{border-top:1px solid var(--line)}
.pts li::before{content:"";position:absolute;left:2px;top:19px;width:8px;height:8px;border-radius:50%;background:var(--coral)}
.body{padding:36px 18px 0;display:flex;flex-direction:column;gap:18px;max-width:38em}
.body p{font-size:16.5px;line-height:1.95}
.body b{font-weight:700}
.body>p b,.body>ul>li>b,.body>ol>li>b{background:linear-gradient(transparent 62%,var(--coral-soft) 62%)}
.body h3{font-size:24px;margin-top:22px;padding-top:26px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center}
.body h3::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--coral);flex-shrink:0}
.body ul,.body ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:10px;font-size:16px;line-height:1.8}
.g{background:none;border:none;padding:0;font:inherit;color:inherit;border-bottom:1.5px dotted var(--coral);cursor:help}
.callout{border-radius:var(--r);background:var(--coral-soft);padding:16px 18px;font-size:15px;line-height:1.8}
.callout b{display:block;margin-bottom:4px;background:none;color:var(--coral);font-size:15.5px}
.steps{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.steps span{background:var(--deep-soft);color:var(--deep);border-radius:10px;padding:6px 12px;font-size:14px;font-weight:500}
.steps span+span::before{content:"› ";color:var(--muted)}
.ill{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px}
.ill svg{width:100%;height:auto;display:block;overflow:visible}
.ill svg.narrow{max-width:240px;margin:0 auto}
.ill .cap,.cap{font-size:13.5px;color:var(--muted);line-height:1.65}
.cap b{color:var(--ink);background:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:6px 13px;font-size:13.5px;line-height:1.3}
.chip[aria-pressed="true"]{background:var(--deep);color:var(--bg);border-color:var(--deep)}
.chip.c2[aria-pressed="true"]{background:var(--coral);border-color:var(--coral);color:var(--bg)}
.links{display:flex;flex-wrap:wrap;gap:6px}
.lk{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-size:13px;text-decoration:none;color:var(--deep);background:var(--surface)}
.lk::after{content:"↗";font-family:var(--f-mono);font-size:11px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;line-height:1.6}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:500;color:var(--muted);font-size:12px;white-space:nowrap}
tr.hit td{background:var(--deep-soft)}
tr.split td{background:var(--coral-soft)}
.split2{display:grid;grid-template-columns:1fr;gap:10px}
.split2 .mini{max-width:220px}
@media (min-width:480px){.split2{grid-template-columns:minmax(0,1fr) 150px;align-items:center}.split2 .mini{max-width:none}}
.duo{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.duo>div{display:flex;flex-direction:column;gap:4px;text-align:center;font-size:13.5px;font-weight:700}
.vs{font-family:var(--f-mono);color:var(--muted);font-size:12px}
.plist details{border-bottom:1px solid var(--line)}
.plist summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:10px 0}
.plist summary::-webkit-details-marker{display:none}
.plist summary>span:last-child{display:flex;flex-direction:column}
.pth{width:54px;height:40px;border-radius:8px;overflow:hidden;position:relative;flex-shrink:0}
.pth svg{position:absolute;inset:0;width:100%;height:100%}
.pbody{display:flex;flex-direction:column;gap:8px;padding:0 0 14px 66px;font-size:14.5px}
.go{background:none;border:none;padding:0;font-size:13px;color:var(--coral);text-decoration:underline;text-underline-offset:3px;align-self:flex-start}
.fishgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.fishgrid button{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;font-size:11.5px;line-height:1.3}
.fishgrid button[aria-pressed="true"]{border-color:var(--coral);background:var(--coral-soft)}
.fishgrid svg{width:100%;max-width:64px}
.fdetail{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:480px){.fdetail{grid-template-columns:170px minmax(0,1fr)}}
.fdetail ul{margin:6px 0;padding-left:18px;font-size:14.5px;line-height:1.7}
.row2{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.row2 b{font-size:17px}
.stat2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat2 .big{font-family:var(--f-mono);font-size:30px;font-weight:500;line-height:1.2;color:var(--deep)}
.splist{display:flex;flex-direction:column}
.sprow{display:grid;grid-template-columns:88px minmax(0,1fr);gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.spth{width:88px;height:66px;border-radius:10px;overflow:hidden;position:relative}
.spth>svg,.spth>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.sptx{display:flex;flex-direction:column;gap:4px;font-size:14px;min-width:0}
.lab{position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden}
.lab>svg{position:absolute;inset:0;width:100%;height:100%}
.shapegrid,.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.shapegrid>div,.tcell{display:flex;flex-direction:column;gap:4px;font-size:14px}
.tcell{text-decoration:none;color:inherit}
.tcell .sci{font-size:12.5px;color:var(--muted)}
.tag{align-self:flex-start;font-size:11px;font-family:var(--f-mono);padding:1px 8px;border-radius:99px;background:var(--good-soft);color:var(--good)}
.tag.no{background:var(--line);color:var(--muted)}
.chain{display:flex;align-items:center;gap:6px;overflow-x:auto;padding-bottom:4px}
.chain .link{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12.5px;min-width:72px}
.chain .pwater{width:72px}
.sun{width:72px;aspect-ratio:4/3;border-radius:12px;background:radial-gradient(circle,#ffe27a 30%,#ffb347 60%,#9fdbe0 61%)}
.arr{color:var(--coral);font-family:var(--f-mono);font-size:18px}
.clist{margin:0;padding-left:20px;font-size:14.5px;line-height:1.8}
.night{border-radius:12px;overflow:hidden}
.gl{fill:#7ff5ff;opacity:.2;animation:tw 2.2s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
.nodebtn{fill:var(--coral);stroke:var(--surface);stroke-width:3;cursor:pointer}
.nodebtn:hover{fill:var(--deep)}

/* gallery */
.gal,.more{padding:40px 18px 0;display:flex;flex-direction:column;gap:12px}
.ggrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.gtile{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.gtile .slot{height:0;padding-bottom:75%;flex-shrink:0}
.gmeta{padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px;font-size:14px}
.gmeta .sci{font-size:12.5px;color:var(--muted)}
.golink{font-size:12.5px;text-decoration:none;margin-top:2px}
.ph0{position:absolute;inset:0;background:linear-gradient(160deg,#6cc4cc,#1f6f80);display:flex;align-items:center;justify-content:center}
.ph0 span{color:#fff;font-family:var(--f-display);font-size:22px;opacity:.9;padding:10px;text-align:center}

/* quiz + next */
details.quiz{margin:36px 18px 0;border:1px dashed var(--line);border-radius:var(--r);padding:2px 16px}
details.quiz summary{cursor:pointer;padding:12px 0;font-size:14px;color:var(--muted);list-style:none;display:flex;justify-content:space-between}
details.quiz summary::-webkit-details-marker{display:none}
details.quiz summary::after{content:"展开";font-family:var(--f-mono);font-size:12px}
details.quiz[open] summary::after{content:"收起"}
.q{display:flex;flex-direction:column;gap:8px;padding:6px 0 16px}
.q+.q{border-top:1px solid var(--line);padding-top:16px}
.q p{font-weight:500}
.q .opts{display:flex;flex-wrap:wrap;gap:6px}

/* plain pages: tree & glossary */
.plain{padding:22px 18px 0;display:flex;flex-direction:column;gap:12px}
.plain h1{font-size:34px}
.tree details{margin-left:14px;border-left:1px solid var(--line);padding-left:10px}
.tree>details{margin-left:0;border-left:none;padding-left:0}
.tree summary{list-style:none;cursor:pointer;padding:8px 0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tree summary::-webkit-details-marker{display:none}
.tree summary::before{content:"+";font-family:var(--f-mono);color:var(--deep);width:12px}
.tree details[open]>summary::before{content:"−"}
.tree .leaf{margin-left:14px;border-left:1px solid var(--line);padding:8px 0 8px 10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.rk{font-family:var(--f-mono);font-size:11px;padding:1px 6px;border-radius:6px;background:var(--deep-soft);color:var(--deep)}

.tth{width:36px;height:27px;border-radius:6px;overflow:hidden;position:relative;display:inline-block}
.tth svg{position:absolute;inset:0;width:100%;height:100%}
.tnote{flex-basis:100%;font-size:12.5px;color:var(--muted);padding-left:20px;line-height:1.5}
.leaf .tnote{padding-left:0}
.gloss{display:flex;flex-direction:column}
.gloss div{padding:14px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:3px}
.gloss b{font-size:16.5px}
.gloss span{font-size:14.5px;color:var(--muted);line-height:1.7}

/* sheet, toast, nav */
.scrim{position:fixed;inset:0;background:rgba(3,15,19,.45);z-index:20}
.sheetbox{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--surface);border-radius:20px 20px 0 0;padding:10px 22px calc(24px + env(safe-area-inset-bottom,0px));max-height:90vh;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;max-width:600px;margin:0 auto;display:flex;flex-direction:column;gap:8px;box-shadow:0 -8px 30px rgba(0,0,0,.18);animation:up .25s ease-out}
.sheetbox h3{font-size:24px}
.sheetbox p{line-height:1.85}
.sheetbox .x{align-self:flex-end;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:7px 16px;font-size:14px}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:30;max-width:calc(100% - 32px)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:8}
nav.tabs .in{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{background:none;border:none;padding:10px 4px 12px;font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--deep);font-weight:700}

/* new components */
.mock{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--bg)}
.mrow{display:grid;grid-template-columns:120px minmax(0,1fr);gap:10px;width:100%;text-align:left;border:none;border-bottom:1px solid var(--line);background:transparent;padding:8px 12px;font-size:13px}
.mrow:last-child{border-bottom:none}
.mrow.on{background:var(--coral-soft)}
.mk{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.mv{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rlbar{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:3px}
.rlbar button{border:none;border-radius:8px;padding:8px 2px;background:color-mix(in srgb,var(--c) 22%,var(--surface));color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:1px;font-size:10.5px;line-height:1.2}
.rlbar button b{font-family:var(--f-mono);font-size:13px}
.rlbar button.on{background:var(--c);color:#fff;outline:2px solid var(--ink);outline-offset:1px}
.stat3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.stat3 .big{font-family:var(--f-mono);font-size:22px;font-weight:500;line-height:1.2;color:var(--deep)}
@media (max-width:380px){.stat3{grid-template-columns:repeat(2,minmax(0,1fr))}}
.check{display:flex;flex-direction:column}
.citem{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);font-size:14.5px;line-height:1.5;cursor:pointer}
.citem input{margin-top:3px;width:18px;height:18px;accent-color:var(--coral);flex-shrink:0}
.citem span{display:flex;flex-direction:column;gap:2px;min-width:0}
.citem small{font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px}
.citem.on>span{color:var(--muted)}
.citem.plan{cursor:default}
.fbig .pwater{aspect-ratio:4/3}

/* photos */
a.credit{color:#fff;text-decoration:none}
a.credit:hover{text-decoration:underline}
.slot img.uphoto[data-zoom]{cursor:zoom-in}
.credlist{display:flex;flex-direction:column}
.cred{display:grid;grid-template-columns:72px minmax(0,1fr);gap:12px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}
.cth2{width:72px;height:54px;border-radius:8px;overflow:hidden;background:var(--deep-soft)}
.ctx2{display:flex;flex-direction:column;gap:1px;font-size:14px;line-height:1.5;min-width:0}
.ctx2 span{overflow-wrap:anywhere}
.zoomscrim{background:rgba(2,10,13,.88)}
.zoombox{position:fixed;inset:0;z-index:21;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));pointer-events:none}
.zoombox>*{pointer-events:auto}
.zoombox img{max-width:100%;max-height:72vh;border-radius:10px;object-fit:contain}
.zcap{color:#e2efed;font-size:13px;line-height:1.6;text-align:center;max-width:36em;display:flex;flex-direction:column}
.zcap a{color:#8fdde0}
.zoombox .x{border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.08);color:#fff;border-radius:10px;padding:7px 18px;font-size:14px}

/* ---- v5: navigation clarity ---- */
.back{display:flex;align-items:center;gap:2px;padding:4px 10px 4px 4px;margin-left:-6px;border-radius:10px;font-size:14px;color:var(--deep);max-width:42%;min-width:0}
.back .chev{font-size:24px;line-height:1;margin-top:-2px}
.back .bl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.back:hover{background:var(--deep-soft)}
.bar .t{font-size:14.5px}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:2px 4px;font-size:12.5px;line-height:1.6}

.pagetype{position:absolute;left:14px;bottom:12px;z-index:3;background:var(--surface);color:var(--ink);font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;letter-spacing:.06em}
.cover .credit{right:10px;bottom:12px}
.howto{margin:14px 18px 0;display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.howto div{display:flex;align-items:center;gap:6px}
.howto b{width:20px;height:20px;border-radius:50%;background:var(--deep);color:var(--bg);display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-family:var(--f-mono)}
.howto .arr{color:var(--coral)}
.hint,.navhint{font-size:13px;color:var(--muted);line-height:1.6}
.navhint{padding:0 18px 10px}
.steps2{display:flex;gap:5px;flex-wrap:wrap;margin:2px 0 4px}
.steps2 .dot{width:22px;height:8px;border-radius:4px;border:none;padding:0;background:var(--line)}
.steps2 .dot.rd{background:color-mix(in srgb,var(--deep) 45%,var(--line))}
.steps2 .dot.on{background:var(--coral);width:34px}
.adepth{display:flex;flex-direction:column;align-items:center;gap:3px}
.adepth b{width:26px;height:26px;border-radius:50%;background:var(--deep);color:var(--bg);display:inline-flex;align-items:center;justify-content:center;font-size:13px}
.adepth small{font-size:10px;color:var(--muted)}
.ncount{position:absolute;right:8px;top:8px;z-index:3;background:rgba(4,22,29,.55);color:#fff;font-size:11px;padding:2px 8px;border-radius:99px}
.slot.is-photo{background:var(--deep-soft)}
.gicon{display:block;width:100%;aspect-ratio:1/1;border-radius:8px;overflow:hidden;margin-bottom:3px}
.gicon img{width:100%;height:100%;object-fit:cover;display:block}
.pth img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}

.duo .credit,.mini .credit,.shapegrid .credit,.tgrid .credit,.chain .credit,.spth .credit{display:none}
/* ---- v5: tree drill-down ---- */
.rk.r0{background:var(--line);color:var(--ink)}
.rk.r1{background:var(--deep);color:var(--bg)}
.rk.r2{background:color-mix(in srgb,var(--deep) 80%,var(--bg));color:var(--bg)}
.rk.r3{background:color-mix(in srgb,var(--deep) 62%,var(--bg));color:var(--bg)}
.rk.r4{background:color-mix(in srgb,var(--deep) 30%,var(--surface));color:var(--ink)}
.rk.r5{background:color-mix(in srgb,var(--deep) 18%,var(--surface));color:var(--ink)}
.rk.r6{background:color-mix(in srgb,var(--deep) 10%,var(--surface));color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}

.rk.big{font-size:12.5px;padding:3px 10px;border-radius:8px;align-self:flex-start}
.treehead{padding:18px 18px 6px;display:flex;flex-direction:column;gap:14px}
.thero{display:grid;grid-template-columns:1fr;gap:14px}
.thph{border-radius:16px;overflow:hidden;aspect-ratio:16/9;position:relative}
.thtx{display:flex;flex-direction:column;gap:6px}

.cta2{align-self:flex-start;border:none;background:var(--coral);color:#fff;border-radius:10px;padding:8px 14px;font-size:14px;font-weight:500;margin-top:4px}
.ladder2{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.lv{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--muted)}
.lv::before{content:"";width:100%;height:6px;border-radius:3px;background:var(--line)}
.lv.past::before{background:color-mix(in srgb,var(--deep) 55%,var(--line))}
.lv.past{color:var(--deep)}
.lv.now::before{background:var(--coral)}
.lv.now{color:var(--coral);font-weight:700}
.kids{padding:10px 18px 0;display:flex;flex-direction:column;gap:10px}
.kidshead{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding-top:14px}
.nodecard{width:100%;display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:12px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 12px 10px 10px;text-align:left;color:inherit}
button.nodecard:hover{border-color:var(--deep)}
button.nodecard:active{transform:scale(.99)}
.nodecard.leaf{background:transparent}
.nth{width:64px;height:64px;border-radius:12px;overflow:hidden;position:relative;background:var(--deep-soft);display:flex;align-items:center;justify-content:center}

.ini{font-family:var(--f-display);font-size:26px;width:100%;height:100%;display:flex;align-items:center;justify-content:center;border-radius:12px}

.ini.r4,.ini.r5,.ini.r6,.ini.r0{background:color-mix(in srgb,var(--deep) 20%,var(--surface));color:var(--deep)}
.ntx{display:flex;flex-direction:column;gap:2px;min-width:0}
.nrow{display:flex;align-items:center;gap:8px;min-width:0}

.nmeta{display:flex;flex-direction:column;align-items:flex-end;gap:6px;font-size:11.5px;color:var(--muted)}
.chev2{font-size:24px;color:var(--deep);line-height:1}
.mini{border:1px solid var(--line);background:var(--bg);color:var(--deep);border-radius:8px;padding:4px 9px;font-size:12px;text-decoration:none;white-space:nowrap}

/* svg tokens */
.st{stroke:var(--ink);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

.sc{stroke:var(--coral)}
.fd{fill:var(--deep)} .fds{fill:var(--deep-soft)} .fc{fill:var(--coral)} .fcs{fill:var(--coral-soft)} .fs{fill:var(--surface)} .fb{fill:var(--bg)} .fl{fill:var(--line)}

.flip{transition:transform .8s cubic-bezier(.5,0,.2,1);transform-box:fill-box;transform-origin:center}

.dmm span.r{left:25px}.dmm span.l{right:25px}
.dmm span.t{top:auto;bottom:22px;left:50%;transform:translateX(-50%)}.dmm span.b{top:22px;left:50%;transform:translateX(-50%)}
.p-hot{--c:var(--hot)}.p-rise{--c:var(--rise)}.p-gem{--c:var(--gem)}.p-closed{--c:var(--closed)}
.dmc{position:absolute;min-width:30px;height:30px;margin:-15px 0 0 -15px;padding:0 7px;border-radius:99px;border:2px solid var(--surface);background:var(--deep);color:var(--bg);font:700 13px/1 var(--f-mono);box-shadow:0 1px 6px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center}

.dmleg{display:flex;gap:4px 12px;flex-wrap:wrap;align-items:center;font-size:11.5px;line-height:1.4;color:var(--muted);padding:8px 18px 0}

.dmflt{position:absolute;left:10px;top:10px;z-index:2;display:flex;align-items:center;gap:6px;background:var(--coral);color:#fff;border-radius:99px;padding:4px 4px 4px 12px;font-size:13px;font-weight:600;max-width:calc(100% - 80px);box-shadow:0 2px 8px rgba(0,0,0,.2)}

.dvtop{padding:12px 0 12px;display:flex;flex-direction:column;gap:8px}

.sheetbox.tall{max-height:84vh;padding-bottom:0;gap:0}

#dvbody{padding:14px 18px 0;display:flex;flex-direction:column;gap:14px}
.dvhint{font-size:13.5px;color:var(--muted);line-height:1.6}
.dvflt{display:flex;gap:10px;align-items:center;justify-content:space-between;border:1px solid var(--coral);background:var(--coral-soft);border-radius:14px;padding:10px 12px}
.dvfl{display:flex;flex-direction:column;gap:1px;min-width:0}
.dvfl b{font-size:16px;line-height:1.4}
.dvfl small{font-size:12px;color:var(--muted)}
.dvfb{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
button.mini{cursor:pointer;font:inherit;font-size:12px}
.dvtogs{display:flex;flex-wrap:wrap;gap:6px}
.chip.sm{font-size:12.5px;padding:5px 11px}
.dlh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;margin-top:2px}
.dlist{display:flex;flex-direction:column;gap:10px}
.drow{display:grid;grid-template-columns:84px minmax(0,1fr);gap:12px;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:8px;text-align:left;width:100%}
.drow:hover{border-color:var(--deep)}
.drow:active{transform:scale(.99)}
.dth{width:84px;height:84px;border-radius:10px;overflow:hidden;position:relative;display:block;background:#2f8c9d}
.dth .credit,.dcth .credit,.dvth .credit,.arow2 .credit{display:none}
.dtx{display:flex;flex-direction:column;gap:2px;min-width:0;padding:1px 2px 0 0}
.dtop{display:flex;align-items:flex-start;gap:6px;justify-content:space-between}
.dtop b{font-size:15.5px;line-height:1.35;min-width:0}
.dc{font-size:12px;color:var(--muted);line-height:1.4}
.wtxt{color:var(--bad);font-style:normal}
.dhl{font-size:13px;line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dmeta{display:flex;align-items:center;gap:8px;margin-top:3px;font-size:11.5px;color:var(--muted);min-width:0}
.dmeta .mono{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mstrip{display:inline-grid;grid-template-columns:repeat(12,5px);gap:1.5px;flex-shrink:0}
.mstrip i{height:9px;border-radius:1.5px;background:var(--line)}
.mstrip i.on{background:var(--deep)}
.mstrip i.now{box-shadow:0 0 0 1.3px var(--coral)}
.ptag{flex-shrink:0;font-size:10.5px;font-family:var(--f-mono);padding:1px 7px;border-radius:99px;background:color-mix(in srgb,var(--c) 15%,var(--surface));color:var(--c);white-space:nowrap;line-height:1.6}
.ptag.plv{--c:var(--muted)}.ptag.psn{--c:var(--deep)}
.dmm.home i{width:16px;height:16px;background:var(--coral);box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--coral)}
.dmm.home span{font-weight:800}
.drec{display:flex;flex-direction:column;gap:10px;margin:0 -18px;padding:4px 0 12px;border-bottom:1px solid var(--line)}
.drec .sechead{padding:0 18px}
.drec h2{font-size:26px}
.rech{font-size:14px;font-family:var(--f-body);font-weight:700;padding:0 18px;margin-top:2px}
.dscroll{display:flex;gap:10px;overflow-x:auto;padding:2px 18px 6px;scroll-snap-type:x mandatory;scroll-padding:0 18px;scrollbar-width:none}
.dscroll::-webkit-scrollbar{display:none}
.dcard{flex:0 0 140px;scroll-snap-align:start;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:0 0 10px;text-align:left;display:flex;flex-direction:column;gap:1px;overflow:hidden}
.dcth{position:relative;display:block;width:100%;height:105px;flex:0 0 105px;margin-bottom:6px;background:#2f8c9d;overflow:hidden}
.dcth .slot{position:absolute;inset:0;width:auto;height:auto}
.dcth .ptag{position:absolute;left:6px;top:6px;z-index:3;background:var(--surface)}
.dcard b{font-size:14px;padding:0 10px;line-height:1.35}
.dcard .dc{padding:0 10px}
.dev{font-size:11.5px;color:var(--coral);padding:0 10px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.more2{border:1px dashed var(--deep);background:none;border-radius:12px;padding:10px;color:var(--deep);font-size:14px}
.spgrp{display:flex;flex-direction:column;gap:8px}
.spgrp h3{font-size:19px}
.spchips{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.spchip{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:6px;text-align:left;min-width:0}
.spchip[aria-pressed="true"]{border-color:var(--coral);background:var(--coral-soft)}
.dvth{width:44px;height:44px;border-radius:9px;overflow:hidden;flex-shrink:0;position:relative;display:block;background:#2f8c9d}
.dvth img,.dvth>svg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.dvtx{display:flex;flex-direction:column;min-width:0}
.dvtx b{font-size:13px;line-height:1.35;font-weight:600}
.dvtx small{font-size:11px;color:var(--muted)}
.phgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.phcard{display:flex;flex-direction:column;gap:3px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;text-align:left}
.phcard b{font-size:15px;line-height:1.35}
.phcard span{font-size:12.5px;color:var(--muted);line-height:1.5}
.phcard small{font-size:11px;color:var(--deep)}
.phcard[aria-pressed="true"]{border-color:var(--coral);background:var(--coral-soft)}
.mgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.mbtn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:2px}
.mbtn b{font-size:19px;font-family:var(--f-display);font-weight:400}
.mbtn small{font-size:11px;color:var(--muted)}
.mbtn.now{border-color:var(--coral);border-width:2px}
.mbtn[aria-pressed="true"]{background:var(--deep);color:var(--bg);border-color:var(--deep)}
.mbtn[aria-pressed="true"] small{color:inherit}
.ptags{display:flex;gap:6px;flex-wrap:wrap}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.facts div{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.facts b{font-size:14.5px;line-height:1.4}
.nowev{font-size:14px;line-height:1.6;border-left:3px solid var(--coral);padding:2px 0 2px 10px}
.nowev.off{border-color:var(--line);color:var(--muted)}
.dwarn{margin:14px 18px 0;border:1px solid var(--bad);background:var(--bad-soft);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.dwarn b{color:var(--bad);font-size:14px}
.dwarn p{font-size:14.5px;line-height:1.7}
.dsec{padding:28px 18px 0;display:flex;flex-direction:column;gap:12px}
.dsec h2{font-size:24px}
.dsec>p{font-size:16px;line-height:1.9}
.dsec>p.cap{font-size:12.5px;line-height:1.6}
.cal{display:flex;flex-direction:column;gap:3px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:10px}
.calr{display:grid;grid-template-columns:minmax(86px,1.7fr) repeat(12,minmax(0,1fr));gap:2px;align-items:center}
.calr>span,.calk{font-size:12px;line-height:1.35;padding:2px 6px 2px 0;text-align:left}
.calk{border:none;background:none;color:var(--deep);text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.calr i{height:16px;border-radius:3px;background:var(--bg)}
.calr i.on{background:var(--deep)}
.calr i.now{box-shadow:inset 0 0 0 1.6px var(--coral)}
.calr.hd i{height:auto;background:none;font:10.5px/1.4 var(--f-mono);text-align:center;color:var(--muted);font-style:normal}
.calr.hd i.now{color:var(--coral);font-weight:700;box-shadow:none}
.dspg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.dsp{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;min-width:0}
.dsp .dvth{width:100%;height:0;padding-bottom:100%}
.dsp b{font-size:12.5px;line-height:1.35;font-weight:600}
.dsp small{font-size:10.5px;color:var(--muted)}
.spots{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:15px;line-height:1.6}
.fromb{font-size:14.5px!important;color:var(--muted)}
.dmini{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--sea)}
.dmini svg{display:block;width:100%;height:auto;aspect-ratio:2/1}
.dmini circle{fill:var(--c);stroke:var(--surface);stroke-width:1.5px;vector-effect:non-scaling-stroke}
.dmini circle.hi{fill:var(--coral);stroke-width:2.5px}
.links2{display:flex;flex-wrap:wrap;gap:8px}
.near{display:flex;flex-direction:column;gap:2px}
.nearrow{display:flex;justify-content:space-between;align-items:center;gap:10px;border:none;border-bottom:1px solid var(--line);background:none;padding:9px 2px;text-align:left}
.nearrow b{font-size:14.5px;font-weight:600}
.nearrow span{font-size:12px;color:var(--muted);white-space:nowrap}
.alinks{display:flex;flex-direction:column;gap:8px}
.arow2{display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px;text-align:left}
.arow2 .ath{width:52px;height:52px;border-radius:9px;overflow:hidden;flex-shrink:0;position:relative}
.arow2 b{flex:1;font-size:15px;line-height:1.4}
.ctas{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.fbrow{display:flex;flex-direction:column;gap:4px}
.fbt{font-size:12px;color:var(--deep);padding-left:4px}
.dventry{margin:14px 18px 0;display:flex;align-items:center;gap:12px;width:calc(100% - 36px);border:1px solid var(--deep);background:var(--deep-soft);border-radius:var(--r);padding:12px 14px;text-align:left}
.dvei{width:40px;height:40px;border-radius:50%;background:var(--deep);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.dvei svg{width:22px;height:22px;fill:none;stroke:var(--bg);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.dvart .dscroll{margin:0 -18px}
.golink.dvlink{border:none;background:none;padding:0;color:var(--coral);text-align:left;font-size:12.5px;cursor:pointer}
.sheetbox .dlist{max-height:60vh;overflow:auto}
.dvsearch{margin:0 18px;position:relative}
.dvsearch input{width:100%;font:inherit;font-size:16px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:10px 14px;-webkit-appearance:none;appearance:none}
.dvsearch input:focus{outline:2px solid var(--deep);outline-offset:0;border-color:var(--deep)}
#dvsr{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:7;max-height:60vh;overflow-y:auto;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;gap:2px;box-shadow:0 10px 30px rgba(0,0,0,.2)}
#dvsr[hidden]{display:none}
#dvsr .eyebrow{margin-top:6px}
.sr{display:flex;align-items:baseline;justify-content:space-between;gap:10px;border:none;border-bottom:1px solid var(--line);background:none;padding:8px 2px;text-align:left}
.sr:last-child{border-bottom:none}
.sr b{font-size:14.5px;font-weight:600}
.sr small{font-size:12px;color:var(--muted);text-align:right;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ===== 首页与课程目录 ===== */
.shead{padding:26px 18px 6px;display:flex;flex-direction:column;gap:6px}
.shead h1{font-size:40px;line-height:1.1}
.shead p{font-size:15px;color:var(--muted)}
.hcont{margin:18px 18px 0;display:flex;align-items:center;gap:14px;width:calc(100% - 36px);border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:10px 14px 10px 10px;text-align:left}
.hcont:active,.htile:active,.crow:active{transform:scale(.985)}
.hcth{width:76px;height:76px;border-radius:12px;overflow:hidden;flex-shrink:0;position:relative;display:block}
.hcth .credit,.crth .credit,.htbg .credit{display:none}
.hctx{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.hctx b{font-size:16.5px;line-height:1.4}
.hcbar{display:flex;align-items:center;gap:8px}
.hgrid{margin:14px 18px 0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.htile{position:relative;display:block;width:100%;height:min(48vw,290px);border:none;border-radius:18px;overflow:hidden;padding:0;text-align:left;background:#2f8c9d;color:#fff}
.htbg{position:absolute;inset:0;display:block}
.htbg .slot{position:absolute;inset:0}
.httx{position:absolute;inset:auto 0 0 0;z-index:3;display:flex;flex-direction:column;gap:1px;padding:36px 14px 13px;background:linear-gradient(transparent,rgba(3,22,29,.78) 55%)}
.httx b{font-size:21px;font-family:var(--f-display);font-weight:400;line-height:1.2}
.httx span{font-size:12.5px;line-height:1.45;color:rgba(255,255,255,.88)}
.httx em{font-style:normal;font-size:11.5px;color:rgba(255,255,255,.75);margin-top:3px}
.hsec{padding:30px 0 0;display:flex;flex-direction:column;gap:12px}
.hsec .csh{padding:0 18px}
.csh{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.csh h2{font-size:24px}
.chome{padding:24px 18px 4px;display:flex;flex-direction:column;gap:10px}
.chome h1{font-size:36px}
.chome p{font-size:15px;color:var(--muted);line-height:1.7}
.csec{padding:28px 18px 0;display:flex;flex-direction:column;gap:12px}
.crlist{display:flex;flex-direction:column;gap:8px}
.crow{width:100%;display:grid;grid-template-columns:60px minmax(0,1fr) auto;gap:12px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:8px 12px 8px 8px;text-align:left}
.crow:hover{border-color:var(--deep)}
.crth{width:60px;height:60px;border-radius:10px;overflow:hidden;position:relative;display:block;background:#2f8c9d}
.crth>svg{position:absolute;inset:0;width:100%;height:100%}
.crlv{position:absolute;left:4px;top:4px;z-index:3;width:20px;height:20px;border-radius:50%;background:var(--surface);color:var(--deep);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.crtx{display:flex;flex-direction:column;gap:1px;min-width:0}
.crtx b{font-size:16px;line-height:1.35}
.crsub{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crbar{display:flex;align-items:center;gap:8px;margin-top:4px}
.crbar .pbar{max-width:140px}

/* ===== 地图预览、月份条、我的记录、全局搜索 ===== */
.dmm.sel i{width:18px;height:18px;box-shadow:0 0 0 3px var(--surface),0 0 0 6px var(--coral),0 2px 8px rgba(0,0,0,.4);animation:selp 1.6s ease-out infinite}
@keyframes selp{0%{box-shadow:0 0 0 3px var(--surface),0 0 0 6px var(--coral)}70%{box-shadow:0 0 0 3px var(--surface),0 0 0 14px transparent}100%{box-shadow:0 0 0 3px var(--surface),0 0 0 6px var(--coral)}}
.mfav,.mbeen{position:absolute;top:0;right:1px;font:700 11px/1 var(--f-body);pointer-events:none;text-shadow:0 0 2px var(--surface),0 0 3px var(--surface)}
.mfav{color:#f2a900}.mbeen{color:var(--good)}
.dmmon{position:absolute;left:8px;right:8px;bottom:8px;z-index:2;display:grid;grid-template-columns:32px 40px repeat(12,minmax(0,1fr));gap:2px;padding:3px;border-radius:12px;background:color-mix(in srgb,var(--surface) 90%,transparent);box-shadow:0 1px 6px rgba(0,0,0,.15)}
.dmmon button{border:none;background:none;border-radius:8px;height:30px;padding:0;font:600 12px/1 var(--f-mono);color:var(--muted);position:relative}
.dmmon button.now::after{content:"";position:absolute;left:50%;bottom:3px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--coral)}
.dmmon button[aria-pressed="true"]{background:var(--deep);color:var(--bg)}
.dmmon .dmplay{background:var(--coral);color:#fff;font-size:11px}
.dmmon .dmplay.on{background:var(--ink);color:var(--bg)}
.dmap.prev .dmmon{display:none}
.dmprev{position:absolute;left:8px;right:8px;bottom:8px;z-index:4;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 28px rgba(0,0,0,.28);padding:8px;display:flex;flex-direction:column;gap:6px;animation:pup .18s ease-out}
.dmprev[hidden]{display:none}
@keyframes pup{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
.dpmain{display:grid;grid-template-columns:76px minmax(0,1fr);gap:10px;border:none;background:none;padding:0;text-align:left;width:100%}
.dpth{width:76px;height:76px;border-radius:10px;overflow:hidden;position:relative;display:block;background:#2f8c9d}
.dpth .credit{display:none}
.dptx{display:flex;flex-direction:column;gap:1px;min-width:0;padding-right:22px}
.dptop{display:flex;align-items:center;gap:6px}
.dptop b{font-size:15.5px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dpev{font-size:12.5px;color:var(--coral);font-weight:600;line-height:1.4}
.dpev.off{color:var(--muted);font-weight:400}
.dptx .dhl{font-size:12.5px;-webkit-line-clamp:1}
.dpact{display:flex;align-items:center;gap:6px}
.dpn{width:34px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--bg);font-size:18px;line-height:1;padding:0;color:var(--ink)}
.dpn:disabled{opacity:.35}
.dpi{font-size:11.5px;color:var(--muted);min-width:34px;text-align:center}
.dpsp{flex:1}
.dpx{position:absolute;right:6px;top:6px;width:28px;height:28px;border-radius:50%;border:none;background:var(--bg);color:var(--muted);font-size:18px;line-height:1;padding:0}
.cta2.sm{margin:0;padding:7px 12px;font-size:13px}
.myrow{display:flex;gap:8px;flex-wrap:wrap}
.mybtn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:7px 14px;font-size:14px;line-height:1.2}
.mybtn.sm{padding:6px 11px;font-size:13px}
.mybtn[aria-pressed="true"]{background:var(--deep);border-color:var(--deep);color:var(--bg)}
.mybtn[data-myt^="fav"][aria-pressed="true"]{background:#f2a900;border-color:#f2a900;color:#231a00}
.mybtn.go2{border-color:var(--deep);color:var(--deep);background:transparent}
.dsp{position:relative}
.dsp.seen::after{content:"✓";position:absolute;top:10px;right:10px;width:20px;height:20px;border-radius:50%;background:var(--good);color:#fff;font:700 12px/20px var(--f-body);text-align:center;z-index:3}
.facts.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.gsearch{margin:16px 18px 0;position:relative}
.gsearch input{width:100%;font:inherit;font-size:16px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:11px 14px;-webkit-appearance:none;appearance:none}
.gsearch input:focus{outline:2px solid var(--deep);outline-offset:0;border-color:var(--deep)}
#gsr{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:7;max-height:62vh;overflow-y:auto;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;gap:2px;box-shadow:0 10px 30px rgba(0,0,0,.2)}
#gsr[hidden]{display:none}
#gsr .eyebrow{margin-top:6px}
.hmy{margin:12px 18px 0;width:calc(100% - 36px);display:flex;align-items:center;gap:16px;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 14px;text-align:left;font-size:13px;color:var(--muted)}
.hmy b{font-size:18px;color:var(--ink);font-family:var(--f-mono);margin-right:2px}
.hmy .arrow{margin-left:auto}
.today{margin:0 18px;width:calc(100% - 36px);display:grid;grid-template-columns:118px minmax(0,1fr);border:1px solid var(--line);background:var(--surface);border-radius:16px;overflow:hidden;padding:0;text-align:left}
.tdph{position:relative;display:block;height:100%;min-height:140px;background:#2f8c9d}
.tdph .slot{position:absolute;inset:0;width:auto;height:auto}
.tdph .credit{display:none}
.tdtx{display:flex;flex-direction:column;gap:2px;padding:12px 14px}
.tdtx b{font-size:18px}

<script>
/* ============ helpers ============ */
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const enc=encodeURIComponent;
const LK=(t,u)=>`<a class="lk" href="${u}" target="_blank" rel="noopener">${t}</a>`;
const iNat=q=>`https://www.inaturalist.org/taxa/search?q=${enc(q)}`;
const worms=q=>`https://www.marinespecies.org/aphia.php?p=taxlist&tName=${enc(q)}`;
const wiki=q=>`https://zh.wikipedia.org/w/index.php?search=${enc(q)}`;
const TX=(sci,label)=>`<div class="links">${LK((label||sci)+' 照片',iNat(sci))}${LK('WoRMS 分类',worms(sci))}</div>`;
const g=t=>`<button class="g" data-g="${t}">${t}</button>`;
const I=name=>`<div class="ill" data-ill="${name}"></div>`;
let UID=0;const uid=p=>p+(++UID);

/* ============ glossary ============ */
const GLOSS={
 '学名':'依照相应命名法规使用的科学名称。一个分类处理通常为一个分类单元选择一个有效名称；异名、旧组合和不同分类观点仍可能并存。',
 '双名法':'物种名由属名与种加词组成，如 Chelonia mydas。动物命名以 1758 年为通行起点；植物、藻类和真菌适用另一套法规与起算规则。',
 '演化支':'共同祖先及其全部后代组成的群，也叫单系群（clade）。识别演化支依赖证据，不由外形像不像或名字的等级决定。',
 '并系群':'包含一个共同祖先，却排除了部分后代的类群。例如不含鸟类的传统爬行动物，或不含四足动物的日常“鱼类”。',
 '姊妹群':'在一棵给定系统树上，共享同一个最近分叉点的两个分支；每一支既可以是一个物种，也可以包含很多物种。',
 '外群':'位于研究内群之外、用于比较和辅助确定树根的类群。它是相对研究范围的选择，不是“最原始生物”的同义词。',
 '域':'传统上高于界的组织层级，三域框架列细菌、古菌和真核生物；现代两域树把真核生物置于古菌内部。分类框架与演化假说要区分。',
 '真核生物':'细胞通常具有膜包围的细胞核及其他细胞器的生物大类，包括动物、植物、真菌和许多单细胞类群；某些专门化细胞可次生失去细胞核。',
 '刺丝囊':'刺细胞内可迅速弹射细管的囊状结构，参与捕食、防御或附着。触发涉及机械和化学信号，不是所有囊型都只负责注毒。',
 '虫黄藻':'一个历史上的共生藻通称；珊瑚等宿主中的常见成员多属共生甲藻科 Symbiodiniaceae。宿主仍是动物，白化也不等于立即死亡。',
 '水螅体':'刺胞动物常见体型之一，口周围有触手，许多种类固着生活。口朝上是常见示意姿势，不是所有个体永远固定的朝向。',
 '水母体':'刺胞动物中的伞状或钟状体型，许多以游泳或漂流生活。并非每一种刺胞动物一生都同时有水螅体和水母体。',
 '横裂':'许多钵水母水螅体横向形成一叠碟状结构，再释放碟状幼体的无性繁殖过程；不同水母的发育路线有差异。',
 '骨针':'支持结构中的微小骨片或针状体。海绵的骨针可为硅质或钙质；八放珊瑚的骨片通常为钙质。材质、形状与组合能帮助鉴定。',
 '外套膜':'软体动物覆盖内脏团并形成外套腔的组织；有壳成员通常由它分泌壳。它不只是“贝壳工厂”，还参与呼吸、运动等功能。',
 '齿舌':'许多软体动物具有的带状取食器官，表面排列小齿，可刮食、切割或高度特化。双壳类缺乏齿舌，其他类群中也有丢失的成员。',
 '嗅角':'许多海蛞蝓头部成对的化学感觉结构，常具褶片等形态。它帮助感知水中化学信息，不是眼睛。',
 '露鳃':'常用于指蓑海牛等背部的指状突起（cerata），可参与气体交换并含消化腺分支；一些种类在尖端储存摄取的刺丝囊。',
 '色素细胞':'头足类常指含色素囊并由放射肌控制的变色单位；反射细胞等也参与外观变化。皮肤变色不完全等于色素本身发生化学变色。',
 '水管系统':'棘皮动物特有的液压系统，驱动管足等结构，参与摄食、运动、附着和气体交换；不宜理解为未经调节的海水直接灌满身体。',
 '亚里士多德提灯':'许多海胆具有的复杂颚器，由五组牙及骨片、肌肉等组成。不同海胆类群的发育与取食器官存在差异。',
 '后口动物':'传统上包括棘皮动物、半索动物和脊索动物等的演化类群名称。名字源于典型胚胎发育描述，但并非每个成员都严格“原口变肛门”。',
 '蜕皮':'节肢动物更新外骨骼的过程，包含新表皮形成、旧壳脱离、身体扩展和新壳硬化等阶段；不只是把一套旧衣服脱掉。',
 '脊索':'脊索动物在生活史某阶段具有的轴向支持结构。许多脊椎动物成体由脊柱承担主要支撑，但不能说所有脊椎动物成体都完全失去脊索。',
 '侧线':'由神经丘等组成的机械感觉系统，感知附近水流和振动；感受器可以分布在头部及身体，不是所有鱼都只有一条可见直线。',
 '雌性先熟':'顺序雌雄同体的一种：个体先以雌性繁殖，之后可能转为雄性。一个类群存在此机制，不代表其中每个个体都必然变性。',
 '雄性先熟':'顺序雌雄同体的一种：个体先以雄性繁殖，之后可能转为雌性。小丑鱼的社会层级是熟悉例子，但变性条件依物种而异。',
 '罗伦氏壶腹':'许多软骨鱼用于电感受的特殊感觉器官，可探测微弱电场。猎物定位、环境感知等功能不能只凭照片中的小孔逐个确认。',
 '温度依赖型性别决定':'胚胎发育中的特定温度敏感时期，孵化温度影响性别比例的机制。海龟通常较暖偏雌，但温度过高也会降低孵化成功，不能把越热越好当成结论。',
 '隐存种':'被以往形态识别混在一起、外形相近的不同物种。发现遗传差异是线索，是否分种仍需结合物种概念与多类证据。',
 'DNA 条形码':'用约定的基因片段辅助鉴定的方法，动物常用 COI。结果受参考库、标记分辨率、样本质量和杂交等影响，不是自动给出真名的万能条码。',
 '环境 DNA':'从水、沉积物等环境样本提取的生物遗传物质；可辅助检测生物。DNA 会运输和降解，检出不等于活体就在采样点，未检出也不等于不存在。',
 '正模标本':'原始命名处理中指定、承载物种名称的单件模式标本。它固定名称的适用，不必是体形最大或外形最“标准”的个体；模式制度另有其他类型。',
 '共线性':'基因在染色体上的关联或排列保守性，具体定义随分析尺度而异。共享的重排痕迹可用于研究亲缘，但需结合模型与其他证据。',
 '浮游生物':'在相应时空尺度上，位移总体受水流主导的生物。很多成员能主动游动或垂直迁移；浮游是生活方式，不是一个分类群。',
 '生物发光':'由生物化学反应产生光的现象。需与荧光、反射和栉板的结构性色彩区分；看到亮色不自动说明动物在自行发光。'
};

/* ============ scenes ============ */
const DEPTHC=[[0,'#aee6e4','#4aa9b8'],[5,'#8fd8dc','#2f8c9d'],[10,'#6cc4cc','#237585'],[18,'#4aa2b0','#175866'],[25,'#2f8292','#10424f'],[30,'#1f6272','#0b313b'],[40,'#123f4e','#04161d']];
function waterAt(d){let c=DEPTHC[0];for(const x of DEPTHC)if(d>=x[0])c=x;return c}
function place(name,x,y,s,rot=0,op=1){const f=P[name];if(!f)return'';return `<g transform="translate(${x} ${y}) rotate(${rot} ${50*s} ${50*s}) scale(${s})" opacity="${op}">${f()}</g>`}
function scene(items,depth,opts={}){
 const [,top,bot]=waterAt(depth),gid=uid('w'),rid=uid('r');
 let s=`<svg viewBox="0 0 360 200" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${top}"/><stop offset="1" stop-color="${bot}"/></linearGradient><linearGradient id="${rid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="${Math.max(.04,.28-depth*.006)}"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs><rect width="360" height="200" fill="url(#${gid})"/>`;
 if(depth<30)s+=[[40,70],[120,60],[210,80],[300,50]].map(([x,w])=>`<polygon points="${x},0 ${x+w},0 ${x+w*1.8},200 ${x+w*.4},200" fill="url(#${rid})"/>`).join('');
 if(opts.surface)s+=`<path d="M0 22 Q30 12 60 22 T120 22 T180 22 T240 22 T300 22 T360 22 V0 H0Z" fill="#fff" opacity=".35"/><path d="M0 30 Q30 22 60 30 T120 30 T180 30 T240 30 T300 30 T360 30" stroke="#fff" stroke-opacity=".5" fill="none"/>`;
 if(opts.floor!==false&&depth<35)s+=`<path d="M0 186 Q60 172 120 182 T240 178 T360 184 V200 H0Z" fill="#e9dcb8" opacity="${Math.max(.15,.7-depth*.015)}"/>`;
 s+=items.map(i=>place(...i)).join('');
 s+=[[30,150,3],[46,120,2],[40,96,1.6],[322,130,2.6],[330,100,1.8],[316,76,1.2]].map(([x,y,r])=>`<circle cx="${x}" cy="${y}" r="${r}" fill="none" stroke="#fff" stroke-opacity=".6"/>`).join('');
 return s+'</svg>';
}
/* one small portrait on water, for gallery tiles & thumbnails */
function portrait(name,depth=10){return scene([[name,90,10,1.8,0]],depth,{floor:false})}

<script>
/* ============ interactive illustrations ============ */
const RK=['界','门','纲','目','科','属'];
const SP=[
 {cn:'绿海龟',sci:'Chelonia mydas',pic:'turtle',p:['动物界','脊索动物门','爬行纲','龟鳖目','海龟科','海龟属'],note:'Alona 最常见的海龟，成年后主要吃海草和藻类。'},
 {cn:'玳瑁',sci:'Eretmochelys imbricata',pic:'hawksbill',p:['动物界','脊索动物门','爬行纲','龟鳖目','海龟科','玳瑁属'],note:'嘴尖像鹰喙，以海绵为主食。'},
 {cn:'黄唇青斑海蛇',sci:'Laticauda colubrina',pic:'snake',p:['动物界','脊索动物门','爬行纲','有鳞目','眼镜蛇科','扁尾海蛇属'],note:'会上岸产卵。毒性强，但很少主动攻击潜水员。'},
 {cn:'大蓝章鱼',sci:'Octopus cyanea',pic:'octopus',p:['动物界','软体动物门','头足纲','八腕目','章鱼科','章鱼属'],note:'白天也出来觅食的礁栖章鱼。'},
 {cn:'安娜多彩海蛞蝓',sci:'Chromodoris annae',pic:'nudi',p:['动物界','软体动物门','腹足纲','裸鳃目','多彩海蛞蝓科','多彩海蛞蝓属'],note:'蓝白黑配色，背后一簇鳃。'},
 {cn:'棘冠海星',sci:'Acanthaster cf. solaris',pic:'cots',p:['动物界','棘皮动物门','海星纲','瓣棘海星目','长棘海星科','长棘海星属'],note:'以珊瑚为食，大爆发时会啃光整片礁。'}
];
const ILL={};
const svg=(vb,inner,cls='')=>`<svg viewBox="${vb}" role="img" class="${cls}">${inner}</svg>`;
function chipRow(items,cur,attr,c2){return `<div class="chips">${items.map((t,i)=>`<button class="chip ${c2?'c2':''}" ${attr}="${i}" aria-pressed="${i===cur}">${t}</button>`).join('')}</div>`}
/* generic "pick one of several" illustration */
function picker(el,items,renderFig,opts={}){let cur=opts.start||0;const draw=()=>{const it=items[cur];el.innerHTML=renderFig(it,cur)+chipRow(items.map(x=>x.label),cur,'data-k',opts.c2!==false)+`<p class="cap"><b>${it.title||it.label}</b>　${it.text}</p>`;el.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{cur=+b.dataset.k;draw()})};draw()}
const FAMPH={Chaetodontidae:'Chaetodon',Pomacentridae:'Amphiprion ocellaris',Tetraodontidae:'Arothron',Scorpaenidae:'Pterois volitans',Muraenidae:'Gymnothorax',Labridae:'Labroides dimidiatus',
 Pomacanthidae:'Pomacanthus imperator',Epinephelinae:'Cephalopholis miniata',Lutjanidae:'Lutjanus kasmira',Mullidae:'Parupeneus',Cirrhitidae:'Oxycirrhites typus',Synanceia:'Synanceia verrucosa',Bothidae:'Bothus',
 Chromodorididae:'Chromodoris annae',Phyllidiidae:'Phyllidia varicosa',Polyceridae:'Nembrotha',Aeolidida:'Pteraeolidia semperi',Sacoglossa:'Costasiella kuroshimae',Enteropneusta:null};
const phKey=q=>{if(!q)return null;if(/^(sp|cover)-/.test(q))return hasPh(q)?q:null;const m=q in FAMPH?FAMPH[q]:q;if(!m)return null;const k='sp-'+slotKey(m);return hasPh(k)?k:null};
const gridIcon=(pic,q)=>{const k=phKey(q);return k?`<span class="gicon"><img src="${phURL(k)}" data-k="${k}" alt=""></span>`:`<svg viewBox="0 0 100 100">${P[pic]()}</svg>`};
const pw=(pic,depth,q,cls='sm')=>{const k=phKey(q);return `<div class="pwater ${cls}">${k?slotHTML(k,portrait(pic,depth),'tile'):portrait(pic,depth)}</div>`};
const tile=(name,depth=10,q)=>{const k=phKey(q);return `<div class="pwater">${k?slotHTML(k,portrait(name,depth),'tile'):portrait(name,depth)}</div>`};

/* ---- basics ---- */
ILL.names=el=>{const L=[['绿海龟','中文'],['綠蠵龜','台湾'],['Green sea turtle','英文'],['Pawikan','菲律宾']];
 el.innerHTML=svg('0 0 340 200',L.map((x,i)=>{const y=14+i*46;return `<rect x="4" y="${y}" width="140" height="34" rx="17" class="fs" style="stroke:var(--line)"/><text x="18" y="${y+22}">${x[0]}</text><text x="136" y="${y+22}" text-anchor="end" class="m">${x[1]}</text><path d="M146 ${y+17} C185 ${y+17} 175 100 206 100" class="sm"/>`}).join('')+`<rect x="206" y="78" width="130" height="44" rx="10" class="fd"/><text x="271" y="105" text-anchor="middle" class="i w">Chelonia mydas</text><text x="271" y="146" text-anchor="middle" class="m">唯一的学名</text>`)+`<p class="cap">四个俗名，一个学名。数据库、论文和图鉴都靠学名对接。</p>`};

ILL.anatomy=el=>{const parts=[['Chelonia','属名','首字母大写、斜体。同一属里的物种共享它。Chelonia 源自希腊语“龟”。'],['mydas','种加词','全小写、斜体。单独写没有意义，必须跟在属名后面。'],['(Linnaeus, 1758)','命名人和年份','林奈 1758 年命名。加了括号，是因为他当时把这个种放在 Testudo 属，后来才被移到 Chelonia。']];let cur=0;
 const draw=()=>{el.innerHTML=`<div class="chips" style="gap:8px">${parts.map((p,i)=>`<button class="chip c2" data-p="${i}" aria-pressed="${i===cur}" style="font-size:18px;padding:8px 14px"><span class="${i<2?'sci':'mono'}" style="${i===2?'font-size:14px':''}">${p[0]}</span></button>`).join('')}</div><p class="cap"><b>${parts[cur][1]}</b>　${parts[cur][2]}</p>`;el.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{cur=+b.dataset.p;draw()})};draw()};

ILL.nest=el=>{const R=[['界','动物界','Animalia','还包括海绵、珊瑚、章鱼、海星、鱼……所有动物'],['门','脊索动物门','Chordata','还包括所有鱼类、海鞘、鲸和人'],['纲','爬行纲','Reptilia','还包括海蛇、鳄鱼、陆地上的蜥蜴'],['目','龟鳖目','Testudines','还包括陆龟和淡水龟，约 360 种'],['科','海龟科','Cheloniidae','还包括玳瑁、蠵龟等，共 6 种硬壳海龟'],['属','海龟属','Chelonia','通常只认一个种：绿海龟'],['种','绿海龟','Chelonia mydas','就是你在 Alona 见到的那一只']];let cur=3;
 const draw=()=>{const rects=R.map((r,i)=>{const x=6+i*12,y=6+i*26,w=328-i*24,h=218-i*30,on=i===cur;return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="10" class="hl" style="fill:${on?'var(--coral-soft)':i<cur?'var(--surface)':'var(--deep-soft)'};stroke:${on?'var(--coral)':'var(--line)'};stroke-width:${on?2:1}"/><text x="${x+8}" y="${y+17}" style="font-weight:${on?700:400};fill:${on?'var(--coral)':'var(--ink)'}">${r[0]}　${r[1]}</text>`}).join('');

 nodes.forEach((nd,k)=>{parts+=`<path d="M${nd.x} ${nd.top} V${nd.bot}" class="st"/><path d="M${nd.x} ${nd.top} H${xl}" class="st hl" style="stroke:${hi.includes(k)?'var(--coral)':'var(--ink)'};stroke-width:${hi.includes(k)?2.6:1.6}"/>`;
  if(k===n-2)parts+=`<path d="M${nd.x} ${nd.bot} H${xl}" class="st hl" style="stroke:${hi.includes(n-1)?'var(--coral)':'var(--ink)'};stroke-width:${hi.includes(n-1)?2.6:1.6}"/>`;else parts+=`<path d="M${nd.x} ${nd.bot} H${nodes[k+1].x}" class="st"/>`});
 parts+=`<path d="M14 ${nodes[0].y} H${nodes[0].x}" class="st"/>`;

 return svg(`0 0 340 ${H}`,parts)}

ILL.fish=el=>{const F=[['蝴蝶鱼科','Chaetodontidae','butterfly',['身体侧扁像圆盘','吻部尖长，能伸进珊瑚缝','常成对出现','许多种眼睛处有黑色横带'],'各种蝴蝶鱼、马夫鱼'],['雀鲷科','Pomacentridae','clown',['体型小，椭圆形','守着一块珊瑚或海葵不肯走','会主动冲向靠近的潜水员'],'小丑鱼、豆娘鱼、光鳃鱼'],['刺尾鱼科','Acanthuridae','fishg',['椭圆侧扁','尾柄两侧有刀状骨棘','常成群啃食藻类'],'蓝倒吊、黄高鳍刺尾鱼'],['鲀科','Tetraodontidae','puffer',['受惊时吸水鼓成球','没有腹鳍，游得慢','愈合的大牙像鸟喙'],'狗头鱼、河鲀'],['鳞鲀科','Balistidae','trigger',['菱形身体，眼睛靠后','第一背鳍能竖起锁住','靠摆动背鳍和臀鳍游','繁殖季护巢很凶'],'炮弹鱼、花斑拟鳞鲀'],['鲉科','Scorpaenidae','lionfish',['胸鳍像扇子张开','鳍棘有毒，别碰','伏击型捕食者，行动慢'],'狮子鱼（蓑鲉）'],['海鳝科','Muraenidae','moray',['身体细长无鳞，没有胸鳍','藏在礁缝里只露出头','一直张嘴是在呼吸，不是威胁'],'裸胸鳝'],['隆头鱼科','Labridae','wrasse',['身体多为细长','主要靠胸鳍“划”着游','幼鱼、雌鱼、雄鱼颜色常不同','有专门的清洁鱼'],'裂唇鱼、龙王鲷、鹦嘴鱼（部分系统）']];let cur=0;
 const draw=()=>{const f=F[cur];el.innerHTML=`<div class="fishgrid">${F.map((x,i)=>`<button data-f="${i}" aria-pressed="${i===cur}">${gridIcon(x[2],x[1])}<span>${x[0]}</span></button>`).join('')}</div><div class="fdetail"><div class="fbig">${tile(f[2],18,f[1])}</div><div><div class="row2"><b>${f[0]}</b><span class="lat">${f[1]}</span></div><ul>${f[3].map(t=>`<li>${t}</li>`).join('')}</ul><p class="cap">代表：${f[4]}</p>${TX(f[1],f[0])}</div></div>`;el.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{cur=+b.dataset.f;draw()})};draw()};

ILL.cots=el=>{const R=[['红海','A. benziei'],['北印度洋','A. planci'],['南印度洋','A. mauritiensis'],['太平洋','A. solaris']];
 el.innerHTML=svg('0 0 340 120',R.map((r,i)=>{const x=6+i*84,on=i===3;return `<rect x="${x}" y="30" width="78" height="60" rx="10" style="fill:${on?'var(--coral-soft)':'var(--deep-soft)'};stroke:${on?'var(--coral)':'var(--line)'};stroke-width:${on?2:1}"/><text x="${x+39}" y="54" text-anchor="middle" style="font-weight:700">${r[0]}</text><text x="${x+39}" y="74" text-anchor="middle" class="i" style="font-size:11.5px">${r[1]}</text>`}).join('')+`<text x="297" y="108" text-anchor="middle" style="fill:var(--coral)">▲ 菲律宾在这里</text><text x="170" y="18" text-anchor="middle" class="m">原来的 Acanthaster planci，按海域分成 4 个遗传谱系（常被视为隐存种）</text>`)+`<p class="cap">外形几乎分不出来，DNA 却清楚地分成四群。</p>`};

 const draw=()=>{el.innerHTML=ladder(H[m].l,[0])+chipRow(['栉水母最早','海绵最早'],m,'data-h',true)+`<p class="cap">${H[m].t}</p>`;el.querySelectorAll('[data-h]').forEach(b=>b.onclick=()=>{m=+b.dataset.h;draw()})};draw()};

 [[-1,'L'],[1,'R']].forEach(([sd])=>{s+=`<path d="M${170+sd*40} 62 C${170+sd*70} 40 ${170+sd*90} 30 ${170+sd*100} 34" class="st" style="stroke:var(--coral);stroke-width:${porcelain?9:7}"/><ellipse cx="${170+sd*108}" cy="30" rx="${porcelain?18:12}" ry="${porcelain?9:8}" class="fcs" style="stroke:var(--coral);stroke-width:2"/>`;
  const n=porcelain?3:4;for(let k=0;k<n;k++){const y=80+k*16;s+=`<path d="M${170+sd*48} ${y} L${170+sd*100} ${y+14} L${170+sd*118} ${y+34}" class="st" style="stroke:var(--deep);stroke-width:4"/>`}
  if(porcelain)s+=`<path d="M${170+sd*30} 128 L${170+sd*40} 140" class="st" style="stroke:var(--muted);stroke-width:3;stroke-dasharray:3 3"/>`});
 s+=`<text x="170" y="94" text-anchor="middle" style="font-weight:700">${porcelain?'瓷蟹':'真蟹'}</text><text x="170" y="176" text-anchor="middle" class="m">${porcelain?'可见 3 对步足 + 藏起的第 4 对（虚线）':'4 对步足 + 1 对螯'}</text>`;
 el.innerHTML=`<div class="split2"><div>${svg('0 0 340 185',s)}</div><div class="mini">${tile(porcelain?'porcelain':'crab',14,porcelain?'Neopetrolisthes':'Lybia tessellata')}</div></div>`+chipRow(['真蟹（短尾类）','瓷蟹（异尾类）'],m,'data-m',true)+`<p class="cap">${porcelain?'<b>异尾类</b>　瓷蟹、寄居蟹、铠甲虾的第 4 对步足很小，常藏在壳下，看起来只有 3 对步足。瓷蟹的触角还特别长。':'<b>短尾类</b>　真蟹除了一对螯，还有 4 对明显的步足，腹部完全折在身体下面。'}</p>`;el.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{m=+b.dataset.m;draw()})};draw()};

ILL.growth=el=>picker(el,[
 {label:'枝状',pic:'coral',q:'Acropora',text:'长得快（鹿角珊瑚每年可长 10 厘米以上），但容易被浪打断，多见于浪较小的礁坡。'},

ILL.reeftypes=el=>{const S=[['岸礁','珊瑚沿着海岸直接生长，礁和陆地之间几乎没有潟湖。Alona 就是这种。'],['堡礁','海岛慢慢下沉，珊瑚继续向上长，礁和陆地之间出现一片潟湖。'],['环礁','海岛完全沉入水下，只剩一圈珊瑚礁围着中间的潟湖。']];let cur=0;
 const draw=()=>{const h=[70,40,0][cur],sea=70;let s=`<rect x="0" y="${sea}" width="340" height="110" style="fill:var(--deep-soft)"/><line x1="0" y1="${sea}" x2="340" y2="${sea}" class="st" style="stroke:var(--deep)"/>`;
  if(h>0)s+=`<path d="M${170-110+cur*20} 180 L170 ${sea-h} L${170+110-cur*20} 180Z" style="fill:#9c8a5c"/><path d="M${170-30} ${sea-h+30} L170 ${sea-h} L${170+30} ${sea-h+30}" style="fill:#6f9a4a"/>`;
  const reef=(x,w,top)=>`<rect x="${x}" y="${top}" width="${w}" height="${180-top}" rx="4" style="fill:var(--coral)"/>`;
  if(cur===0)s+=reef(170-120,26,sea-2)+reef(170+94,26,sea-2);
  if(cur===1)s+=reef(170-150,24,sea-4)+reef(170+126,24,sea-4)+`<text x="92" y="${sea+22}" class="m">潟湖</text>`;
  if(cur===2)s+=reef(170-150,24,sea-4)+reef(170+126,24,sea-4)+`<path d="M60 180 L170 120 L280 180Z" style="fill:#9c8a5c;opacity:.5"/><text x="170" y="${sea+26}" text-anchor="middle" class="m">潟湖</text>`;
  el.innerHTML=svg('0 0 340 180',s)+chipRow(S.map(x=>x[0]),cur,'data-r',true)+`<p class="cap"><b>${S[cur][0]}</b>　${S[cur][1]}</p>`;el.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{cur=+b.dataset.r;draw()})};draw()};

ILL.hexocto=el=>{let m=0;const draw=()=>{let s=`<circle cx="120" cy="100" r="16" class="fds" style="stroke:var(--deep);stroke-width:2"/><ellipse cx="120" cy="100" rx="5" ry="3" class="fd"/>`;
 const n=m?8:12;for(let k=0;k<n;k++){const a=k*2*Math.PI/n,x2=120+70*Math.cos(a),y2=100+70*Math.sin(a);s+=`<line x1="${120+16*Math.cos(a)}" y1="${100+16*Math.sin(a)}" x2="${x2}" y2="${y2}" class="st" style="stroke:var(--deep);stroke-width:${m?3:4}"/>`;
  if(m)for(let j=1;j<=5;j++){const r=16+j*10,px=120+r*Math.cos(a),py=100+r*Math.sin(a),ox=-Math.sin(a)*8,oy=Math.cos(a)*8;s+=`<line x1="${px}" y1="${py}" x2="${px+ox}" y2="${py+oy}" class="st" style="stroke:var(--coral);stroke-width:1.6"/><line x1="${px}" y1="${py}" x2="${px-ox}" y2="${py-oy}" class="st" style="stroke:var(--coral);stroke-width:1.6"/>`}}
 s+=`<text x="230" y="80" style="font-weight:700">${m?'8 条':'6 的倍数'}</text><text x="230" y="100" class="m">${m?'每条带羽枝':'光滑不分叉'}</text><text x="230" y="120" class="m">${m?'软珊瑚、海扇':'硬珊瑚、海葵'}</text>`;
 el.innerHTML=`<div class="split2"><div>${svg('0 0 340 200',s)}</div><div class="mini">${tile(m?'softcoral':'anemone',12,m?'Alcyonacea':'Heteractis magnifica')}</div></div>`+chipRow(['六放珊瑚','八放珊瑚'],m,'data-m',true)+`<p class="cap">${m?'<b>八放珊瑚</b>　每只水螅体刚好 8 条触手，每条两侧长着细小的羽枝，像一朵朵小雪花。':'<b>六放珊瑚</b>　触手数是 6 的倍数（6、12、24……），光滑不分叉。'}</p>`;el.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{m=+b.dataset.m;draw()})};draw()};

ILL.lifecycle=el=>{const S=[['浮浪幼虫','受精卵发育成带纤毛的小幼虫，在水里游几天后找地方附着。'],['水螅体','附着后长成一只小小的水螅体，能靠出芽不断复制自己。'],['横裂','水温或季节变化时，水螅体像叠盘子一样横向分裂成一摞。'],['碟状幼体','一片片像小花一样的幼体脱落，开始自由游动。'],['水母体','碟状幼体长大成熟，产卵和精子，回到第一步。']];let cur=0;
 const icon=i=>{if(i===0)return `<ellipse cx="0" cy="0" rx="9" ry="6" class="fcs" style="stroke:var(--coral)"/>`;if(i===1)return `<path d="M-6 14 L-8 -4 L8 -4 L6 14Z" class="fds" style="stroke:var(--deep)"/>${[-6,-2,2,6].map(d=>`<line x1="${d}" y1="-4" x2="${d*1.8}" y2="-16" class="st" style="stroke:var(--deep)"/>`).join('')}`;if(i===2)return `${[0,1,2,3].map(k=>`<ellipse cx="0" cy="${-12+k*7}" rx="10" ry="3.2" class="fds" style="stroke:var(--deep)"/>`).join('')}<path d="M-4 14 L-3 10 L3 10 L4 14Z" class="fd"/>`;if(i===3)return `<polygon points="${star(0,0,8,5,12)}" class="fds" style="stroke:var(--deep)"/>`;return `<path d="M-14 0 C-14 -16 14 -16 14 0Z" class="fds" style="stroke:var(--deep)"/>${[-8,-3,3,8].map(d=>`<path d="M${d} 0 C${d-2} 6 ${d+2} 10 ${d} 16" class="st" style="stroke:var(--deep)"/>`).join('')}`};
 const draw=()=>{let s='';const cx=170,cy=100,r=70;S.forEach((st,i)=>{const a=-Math.PI/2+i*2*Math.PI/5,x=cx+r*Math.cos(a),y=cy+r*Math.sin(a),on=i===cur;s+=`<g transform="translate(${x} ${y})"><circle r="24" style="fill:${on?'var(--coral-soft)':'var(--surface)'};stroke:${on?'var(--coral)':'var(--line)'};stroke-width:${on?2.4:1}"/>${icon(i)}</g><text x="${x}" y="${y+(y>cy?40:-30)}" text-anchor="middle" style="font-size:11.5px;${on?'fill:var(--coral);font-weight:700':''}">${st[0]}</text>`;
  const a2=-Math.PI/2+(i+.5)*2*Math.PI/5;s+=`<text x="${cx+(r-2)*Math.cos(a2)}" y="${cy+(r-2)*Math.sin(a2)+4}" text-anchor="middle" class="m">›</text>`});
  el.innerHTML=svg('0 0 340 205',s)+chipRow(S.map((x,i)=>(i+1)+' '+x[0]),cur,'data-l',true)+`<p class="cap"><b>${S[cur][0]}</b>　${S[cur][1]}</p>`;el.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{cur=+b.dataset.l;draw()})};draw()};

ILL.dorid=el=>picker(el,[

 {label:'蓑海牛型',title:'蓑海牛型',text:'背上长满指状的露鳃，没有背后那圈鳃。很多种吃水螅，把偷来的刺丝囊存在露鳃尖端。'}],

ILL.rotate=el=>{let T=['鲨鱼',['礁鱼',['海豚',['海龟','海蛇']]]];
 const draw=()=>{const leaves=[];const walk=n=>Array.isArray(n)?n.forEach(walk):leaves.push(n);walk(T);const ys={};leaves.forEach((l,i)=>ys[l]=24+i*38);let s='',id=0;const nodes=[];
  const lay=(n,depth)=>{if(!Array.isArray(n))return{y:ys[n],x:250};const a=lay(n[0],depth+1),b=lay(n[1],depth+1);const x=40+depth*48,y=(a.y+b.y)/2,my=id++;
   s+=`<path d="M${x} ${a.y} V${b.y}" class="st"/><path d="M${x} ${a.y} H${a.x}" class="st"/><path d="M${x} ${b.y} H${b.x}" class="st"/>`;nodes.push(`<circle cx="${x}" cy="${y}" r="9" class="nodebtn" data-node="${my}"/>`);n._id=my;return{x,y}};
  const r=lay(T,0);s+=`<path d="M10 ${r.y} H${r.x}" class="st"/>`+nodes.join('');leaves.forEach(l=>{s+=`<circle cx="250" cy="${ys[l]}" r="4" class="fd"/><text x="260" y="${ys[l]+4}">${l}</text>`});
  el.innerHTML=svg('0 0 340 200',s)+`<p class="cap">点任一个圆形分叉点，把它的两支对调。无论怎么转，海豚和海龟的共同祖先都比海豚和礁鱼的更近。</p>`;
  el.querySelectorAll('[data-node]').forEach(c=>c.onclick=()=>{const id2=+c.dataset.node;const sw=n=>{if(!Array.isArray(n))return n;if(n._id===id2){const t=[n[1],n[0]];return t}const t=[sw(n[0]),sw(n[1])];return t};T=sw(T);draw()})};draw()};

ILL.barcode=el=>{const A1='ATGCGTACCTTAGGCATCGATTCGGACTAC',B1='ATGCGTACCTTAGGCATCGATTCAGACTAC',C1='ATGCATACGTTGGGCATTGATTCAGGCTTC';const S3=[['标本 A',A1],['标本 B',B1],['标本 C',C1]];let cmp=false;
 const col={A:'#3fa66b',T:'#d9573a',G:'#e6b93c',C:'#2f7fbf'};
 const draw=()=>{let s='';S3.forEach(([n,q],r)=>{s+=`<text x="0" y="${34+r*44}" style="font-weight:700">${n}</text>`;[...q].forEach((b,i)=>{const diff=cmp&&b!==A1[i];s+=`<rect x="${58+i*9.4}" y="${18+r*44}" width="8" height="24" rx="1.5" fill="${col[b]}" opacity="${cmp&&!diff?.25:1}"/>${diff?`<rect x="${57+i*9.4}" y="${16+r*44}" width="10" height="28" rx="2" fill="none" stroke="var(--ink)" stroke-width="1.6"/>`:''}`})});
  s+=`<g transform="translate(58 150)">${Object.entries(col).map(([b,c],i)=>`<rect x="${i*56}" y="0" width="12" height="12" rx="2" fill="${c}"/><text x="${i*56+18}" y="11" class="m">${b}</text>`).join('')}</g>`;
  el.innerHTML=`<div class="tbl">${svg('0 0 350 170',s)}</div><div class="chips"><button class="chip c2" id="cmp" aria-pressed="${cmp}">${cmp?'显示全部':'和标本 A 比较'}</button></div><p class="cap">${cmp?'<b>A 和 B 只差 1 个位点</b>，属于同种内的正常差异。<b>C 差了 7 个位点</b>，虽然长得一样，很可能是另一个种。真实研究中种间差异通常只有百分之几，这里为了看清放大了。':'三个外形一模一样的海蛞蝓标本。每种颜色代表一种碱基（示意序列）。'}</p>`;el.querySelector('#cmp').onclick=()=>{cmp=!cmp;draw()}};draw()};

ILL.reefzones=el=>{const Z=[['海草床与浅滩',8,70,'岸边浅水的沙地和海草床，是幼鱼、海龟和海星常出现的地方。'],['礁坪',78,70,'浅而平坦的礁台，退潮时水很浅。珊瑚多为耐晒、耐浪的矮小种类，有很多小鱼、海参和海胆。'],['礁脊',148,34,'礁坪外缘最高、浪最大的地方，珊瑚长得矮壮结实。'],['礁坡',182,56,'从礁脊向下倾斜的斜坡，光照好、隐蔽处多，是珊瑚和鱼种类最多的地方。'],['礁壁',238,50,'几乎垂直陡落的墙。水流带来食物，墙上长满海扇、软珊瑚和黑珊瑚，外面常有鱼群经过。'],['深处沙地',288,52,'礁壁下方的沙地和碎石区，适合找花园鳗、躄鱼和各种小型生物。']];let cur=3;

 el.innerHTML=svg('0 0 340 200',`<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" style="fill:var(--deep)"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10z" style="fill:var(--coral)"/></marker></defs>`+s)+`<div class="chips"><button class="chip c2" id="sf" aria-pressed="${on}">${on?'隐藏水流':'显示水流'}</button></div><p class="cap">海水从身体表面成千上万的小孔流入，内壁上的领细胞摆动鞭毛推动水流并捕捉食物颗粒，过滤后的水从顶部的大出水口排出。</p>`;el.querySelector('#sf').onclick=()=>{on=!on;draw()}};draw()};

ILL.timeline=el=>{const T=[['约前 350','亚里士多德','在莱斯博斯岛研究并描述了大量海洋动物，把动物分成“有血”和“无血”两大类，是最早的系统动物学。'],['1735','林奈','《自然系统》第一版出版，提出按等级组织自然界的体系。'],['1758','双名法','《自然系统》第 10 版全面使用双名法，成为动物命名的正式起点。'],['1859','达尔文','《物种起源》出版。分类开始被理解为反映共同祖先的家谱。'],['1866','海克尔','画出了最早的一批“生命之树”，把演化思想变成了图。'],['1966','亨尼希','《系统发育分类学》英文版出版，支序分类法开始在全世界流行。'],['1977–1990','沃斯','用核糖体 RNA 发现古菌，并在 1990 年提出三域系统。'],['2003','DNA 条形码','研究者提出用一段标准基因识别物种。'],['2007','WoRMS','世界海洋物种名录上线，整合全球海洋物种的学名。'],['2023','染色体共线性','用基因在染色体上的排列研究动物树的根部。']];let cur=0;
 const draw=()=>{let s=`<line x1="14" y1="40" x2="326" y2="40" class="st" style="stroke:var(--line);stroke-width:3"/>`;T.forEach((t,i)=>{const x=14+i*(312/(T.length-1)),on=i===cur;s+=`<circle cx="${x}" cy="40" r="${on?9:6}" data-t="${i}" style="fill:${on?'var(--coral)':'var(--deep)'};stroke:var(--surface);stroke-width:3;cursor:pointer"/><text x="${x}" y="${i%2?70:22}" text-anchor="middle" style="font-size:10px;${on?'fill:var(--coral);font-weight:700':'fill:var(--muted)'}">${t[0]}</text>`});
  el.innerHTML=svg('0 0 340 80',s)+`<p class="cap"><b>${T[cur][0]} · ${T[cur][1]}</b>　${T[cur][2]}</p><div class="chips"><button class="chip" id="tp" ${cur===0?'disabled':''}>‹ 上一个</button><button class="chip c2" id="tn" aria-pressed="true" ${cur===T.length-1?'disabled':''}>下一个 ›</button></div><p class="cap">时间轴不按比例。</p>`;
  el.querySelectorAll('[data-t]').forEach(c=>c.onclick=()=>{cur=+c.dataset.t;draw()});el.querySelector('#tp').onclick=()=>{if(cur>0){cur--;draw()}};el.querySelector('#tn').onclick=()=>{if(cur<T.length-1){cur++;draw()}}};draw()};

ILL.synonyms=el=>{const N=[['1758','Asterias planci','Linnaeus','林奈最早描述了这种海星，放在当时的海星属 Asterias。后来被移到新建的长棘海星属，所以写作 Acanthaster planci (Linnaeus, 1758)，作者加括号。'],['1795','Asterias solaris','Schreiber','另一位学者给太平洋的标本起了新名字。很长时间里，它被认为和 planci 是同一个种，成了同物异名。'],['1885','Acanthaster mauritiensis','de Loriol','毛里求斯一带的标本也有过自己的名字，同样被当作 planci 的同物异名。'],['2017','拆分','Haszprunar 等','DNA 显示“棘冠海星”其实是几个种。按优先权，旧名字被“复活”：太平洋的用 solaris，南印度洋的用 mauritiensis，北印度洋保留 planci，红海的是新命名的 benziei。']];let cur=0;
 const draw=()=>{el.innerHTML=`<div class="chips">${N.map((n,i)=>`<button class="chip c2" data-n="${i}" aria-pressed="${i===cur}"><span class="mono">${n[0]}</span> <span class="${i===3?'':'sci'}">${n[1]}</span></button>`).join('')}</div><p class="cap"><b>${N[cur][1]}</b>（${N[cur][2]}, ${N[cur][0]}）<br>${N[cur][3]}</p>`;el.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{cur=+b.dataset.n;draw()})};draw()};

ILL.wormsmock=el=>{const F=[['名称与作者','Chelonia mydas (Linnaeus, 1758)','学名加命名人和年份。作者加括号，说明这个种后来被移到了现在的属。'],['AphiaID','一串数字','WoRMS 给每个名字的唯一编号。引用或在其他数据库对接时用它最准确。'],['Classification','Biota › Animalia › Chordata › …','完整的分类路径，包括所有中间等级。点任何一级都能跳到那一级的页面。'],['Status','accepted','accepted 表示当前有效；unaccepted 表示是同物异名或无效名，旁边会写出应该使用的名字。'],['Rank','Species','这个名字的等级：种、属、科等。'],['Parent','Chelonia','上一级分类单元。'],['Synonymised names','Testudo mydas …','所有被判定为同物异名的旧名字。看到旧图鉴里的名字，可以在这里对上。'],['Original description','文献','最早描述这个种的出处。'],['Environment','marine, brackish…','生活环境：海水、半咸水、淡水或陆地。'],['Distribution / Vernacular','分布与俗名','已知分布和各语言的俗名（英文为主）。'],['Sources','文献列表','页面上每条信息的依据，可以追溯到原始文献。']];let cur=3;
 const draw=()=>{el.innerHTML=`<div class="mock">${F.map((f,i)=>`<button class="mrow ${i===cur?'on':''}" data-w="${i}"><span class="mk">${f[0]}</span><span class="mv ${i===0?'sci':''}">${f[1]}</span></button>`).join('')}</div><p class="cap"><b>${F[cur][0]}</b>　${F[cur][2]}</p><p class="cap">示意图，字段顺序和写法以网站实际页面为准。</p>`;el.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{cur=+b.dataset.w;draw()})};draw()};

ILL.findfrog=el=>{const blobs=[];for(let k=0;k<26;k++)blobs.push([(k*53+17)%340+10,(k*37+29)%150+40,14+(k%4)*6]);const fx=236,fy=118;let tries=0,found=false;
 const draw=()=>{let s=`<rect width="360" height="220" fill="#2f7f8f"/><path d="M0 200 Q90 180 180 196 T360 190 V220 H0Z" fill="#c8b58a"/>`;
  s+=blobs.map(([x,y,r],i)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${['#e6a23a','#d9853a','#c9a24a','#e6b33a'][i%4]}" opacity=".95"/><circle cx="${x-r/3}" cy="${y-r/3}" r="${r/4}" fill="#8a5a2a" opacity=".5"/>`).join('');
  s+=`<g transform="translate(${fx-22} ${fy-22}) scale(.44)">${P.frogfish('#dc9a3c')}</g>`;
  if(found)s+=`<circle cx="${fx}" cy="${fy}" r="30" fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="6 4"/>`;
  el.innerHTML=`<div class="pwater" style="aspect-ratio:36/22">${svg('0 0 360 220',s)}</div><p class="cap">${found?'<b>找到了！</b>它把自己的颜色和质地调得和周围的海绵几乎一样，只有那根小小的“钓竿”露了馅。':tries?`不是这里，已经试了 ${tries} 次。提示：留意有眼睛和“钓竿”的那一团。`:'点你觉得躄鱼藏在哪里。'}</p><div class="chips"><button class="chip c2" id="ff">${found?'再玩一次':'直接看答案'}</button></div>`;
  el.querySelector('svg').onclick=e=>{if(found)return;const r=e.currentTarget.getBoundingClientRect(),vb=e.currentTarget.viewBox.baseVal,sc=Math.max(vb.width/r.width,vb.height/r.height),ox=(r.width*sc-vb.width)/2,oy=(r.height*sc-vb.height)/2;const x=(e.clientX-r.left)*sc-ox,y=(e.clientY-r.top)*sc-oy;if(Math.hypot(x-fx,y-fy)<30)found=true;else tries++;draw()};
  el.querySelector('#ff').onclick=()=>{if(found){found=false;tries=0}else found=true;draw()}};draw()};

ILL.bleachchart=el=>{const D=[['1998','第一次',21],['2010','第二次',37],['2014–17','第三次',68],['2023–25','第四次',84]];const X0=44,W=280,H=150,top=16;
