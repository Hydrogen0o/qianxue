<title>记忆礁</title>
<style>
/* 布局：竖屏一屏。顶=能量与进度，一句提示，中=水道战场（左礁石，右外海），底=记忆卡托盘。单一深海配色。 */
:root{color-scheme:dark;
 --sea:#061d26;--deep:#0b2c38;--panel:#123f4e;--line:#1f5362;--ink:#e9f5f2;--dim:#8db1b5;
 --sun:#ffc93c;--good:#4fd39a;--bad:#ff7a59;
 --ui:"PingFang SC","HarmonyOS Sans SC","MiSans","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
 --num:"DIN Alternate","Bahnschrift","Roboto Condensed",ui-monospace,monospace}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--sea);color:var(--ink);font:15px/1.5 var(--ui);-webkit-tap-highlight-color:transparent;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:2px solid var(--sun);outline-offset:2px}
#app{max-width:440px;margin:0 auto;min-height:100%;box-sizing:border-box;display:flex;flex-direction:column;gap:10px;padding-inline:16px;padding-block:10px 14px}
.hud{display:flex;align-items:center;gap:10px}
.en{display:flex;align-items:center;gap:6px;font:700 24px var(--num);color:var(--sun);min-width:86px;font-variant-numeric:tabular-nums}
.en i{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle,#fff6c8 0 30%,#ffc93c 60%,rgba(255,201,60,0) 72%);flex:none}
.en.bump b{animation:bump .25s}
@keyframes bump{50%{transform:scale(1.35)}}
.en b{display:inline-block}
.prog{flex:1;height:12px;border-radius:99px;background:#14323c;border:1px solid var(--line);position:relative;overflow:hidden}
.prog i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#6f8f2a,#b5c94a);width:0}
.prog s{position:absolute;top:-1px;bottom:-1px;width:3px;background:var(--bad)}
.hud .sm{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);color:var(--dim);font-size:13px;font-weight:700;flex:none}
.lv{font-size:12.5px;color:var(--dim);white-space:nowrap}
.tip{margin:0;font-size:15px;line-height:1.45;min-height:44px;text-wrap:pretty}
.tip b{display:inline-block;background:var(--sun);color:#221a00;border-radius:6px;font-size:12px;padding:0 6px;margin-right:6px;vertical-align:2px}
.field{position:relative;width:100%;margin-block:auto;border-radius:14px;overflow:hidden;background:linear-gradient(90deg,#0e4a5c,#0b3a52 60%,#0a2f4a);touch-action:manipulation}
.field .home{position:absolute;left:0;top:0;bottom:0;width:26px;background:linear-gradient(90deg,#c98a6a,#a86a55);border-right:3px solid #7c4a3c}
.field .mw{position:absolute;left:3px;width:20px;height:20px;border-radius:50%;border:3px solid #dff6ff;border-right-color:transparent;animation:spin 2.4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.cellb{position:absolute;border:1px solid rgba(255,255,255,.07);border-radius:8px}
.field.pick .cellb.free{background:rgba(255,201,60,.1);border-color:rgba(255,201,60,.5)}
.spr{position:absolute;left:0;top:0;pointer-events:none;will-change:transform}
.spr svg{width:100%;height:100%;display:block;overflow:visible}
.spr.flash svg{filter:brightness(2.4)}
.spr.bit{animation:shake .25s infinite}
@keyframes shake{25%{margin-left:-2px}75%{margin-left:2px}}
.spr .hp{position:absolute;left:12%;right:12%;bottom:0;height:4px;border-radius:9px;background:rgba(0,0,0,.5)}
.spr .hp i{display:block;height:100%;border-radius:9px;background:var(--good)}
.shot{position:absolute;left:0;top:0;width:13px;height:13px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,#9fe6d8);pointer-events:none}
.shot.trigger{background:radial-gradient(circle at 35% 35%,#fff,#ffb36b)}
.sunb{position:absolute;left:0;top:0;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:radial-gradient(circle,#fffbe0 0 22%,#ffc93c 46%,rgba(255,201,60,.35) 60%,rgba(255,201,60,0) 72%);z-index:6;animation:twk 1s infinite alternate;pointer-events:auto}
.sunb.old{opacity:.45}
@keyframes twk{to{filter:brightness(1.25)}}
.bub{position:absolute;width:10px;height:10px;border-radius:50%;border:2px solid #cfeffa;pointer-events:none;animation:bub .5s forwards}
@keyframes bub{to{transform:translate(var(--dx),var(--dy)) scale(.3);opacity:0}}
.flow{position:absolute;height:60%;width:90px;border-radius:99px;background:linear-gradient(90deg,rgba(223,246,255,0),rgba(223,246,255,.85));pointer-events:none}
.banner{position:absolute;left:0;right:0;top:38%;text-align:center;font-size:28px;font-weight:900;letter-spacing:.2em;color:var(--bad);text-shadow:0 2px 0 #3a0f04;animation:ban 2.4s forwards;pointer-events:none;z-index:8}
@keyframes ban{0%{transform:scale(2.4);opacity:0}15%{transform:scale(1);opacity:1}80%{opacity:1}100%{opacity:0}}
.finger{position:absolute;font-size:28px;animation:tap 1s infinite;pointer-events:none;z-index:9}
@keyframes tap{50%{transform:translate(-4px,-6px) scale(.9)}}
.tray{display:flex;gap:7px}
.card{position:relative;flex:1;max-width:84px;height:104px;border-radius:11px;background:linear-gradient(#1a5666,#103e4c);border:2px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:5px;overflow:hidden}
.card svg{position:absolute;left:14%;top:6px;width:72%;height:50px}
.card b{font-size:13.5px;line-height:1.15}
.card small{font-size:10.5px;color:var(--dim);line-height:1.2}
.card .co{position:absolute;right:0;top:0;padding:0 6px;border-radius:0 8px 0 9px;background:var(--sun);color:#221a00;font:700 14px/21px var(--num)}
.card .cdm{position:absolute;left:0;right:0;top:0;background:rgba(3,14,19,.72);pointer-events:none}
.card.sel{border-color:var(--sun);transform:translateY(-6px);box-shadow:0 6px 14px rgba(0,0,0,.45)}
.card.poor{filter:saturate(.3) brightness(.7)}
.ov{position:fixed;inset:0;z-index:40;background:rgba(3,14,19,.86);display:flex;align-items:center;justify-content:center;padding:16px}
.sheet{width:100%;max-width:380px;max-height:100%;overflow:auto;background:var(--deep);border:1px solid var(--line);border-radius:18px;padding:20px 18px;text-align:center}
.sheet h1{margin:0 0 6px;font-size:26px;letter-spacing:.05em}
.sheet p{margin:8px 0;color:#cfe3e1;text-align:left}
.sheet .new{margin:12px auto 0;width:150px;border-radius:14px;border:2px solid var(--sun);background:linear-gradient(#1a5666,#103e4c);padding:10px 8px;animation:rise .5s}
.sheet .new svg{width:110px;height:84px}
.sheet .new b{display:block;font-size:19px}
.sheet .new small{color:var(--sun);font-weight:700}
@keyframes rise{from{transform:translateY(30px) scale(.8);opacity:0}}
.sheet .go{display:block;width:100%;margin-top:14px;background:var(--sun);color:#221a00;font-weight:700;font-size:16px;border-radius:12px;padding:12px}

.modes{display:flex;align-items:center;gap:10px}
.seg{display:flex;border:1px solid var(--line);border-radius:99px;overflow:hidden;flex:none}
.seg button{padding:4px 14px;font-size:13px;color:var(--dim);font-weight:700}
.seg button.on{background:var(--ink);color:var(--sea)}
.modes span{font-size:12.5px;color:var(--dim);margin-left:auto}
.mode{display:flex;flex-direction:column;gap:10px;flex:1}
.goal{display:flex;flex-direction:column;gap:5px}
.goal .n{display:flex;align-items:baseline;gap:8px;font:700 16px var(--num);font-variant-numeric:tabular-nums;color:var(--dim)}
.goal .n b{font-size:34px;line-height:1;color:var(--sun)}
.goal .n em{font:700 18px var(--num);margin-left:auto;font-style:normal;color:var(--good)}
.bar{height:10px;border-radius:99px;background:#2a3117;overflow:hidden;border:1px solid #3c4a1c}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#1fa7b8,#4fd39a);border-radius:99px;transition:width .5s}
.slots,.chand{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.slots{padding:10px 8px;border-radius:14px;background:linear-gradient(#0e4a5c,#0b3a52);margin-block:auto}
.slot{position:relative;height:122px;border-radius:10px;border:2px dashed rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:12px}
.slot.algae{border:2px solid #3c4a1c;background:radial-gradient(circle at 30% 30%,#6b7a2c 0 20%,transparent 21%),radial-gradient(circle at 70% 65%,#56642a 0 24%,transparent 25%),#2a3117;color:#aab777}
.slot.tgt{border-color:var(--sun);animation:glow .9s infinite alternate}
@keyframes glow{to{box-shadow:0 0 0 3px rgba(255,201,60,.55)}}
.cc{position:relative;width:100%;height:122px;border-radius:10px;background:linear-gradient(#1a5666,#103e4c);border:2px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:0 2px 5px;overflow:hidden;text-align:center}
.cc svg{position:absolute;left:10%;top:20px;width:80%;height:42px}
.cc b{font-size:12.5px;line-height:1.15}
.cc small{font-size:10.5px;line-height:1.2;color:var(--sun);min-height:25px;display:flex;align-items:center}
.cc .no{position:absolute;left:0;top:0;min-width:22px;height:22px;border-radius:8px 0 9px 0;background:#dfe9ea;color:#10242b;font:700 14px/22px var(--num)}
.cc.fx{background:linear-gradient(#3a2f5e,#251e42);border-color:#51448a}
.cc.sel{border-color:var(--sun);transform:translateY(-8px);box-shadow:0 6px 14px rgba(0,0,0,.45)}
.slot .cc{height:100%;border:0}
.slot .cc .no{display:none}
.slot.full{border:2px solid var(--line)}
.slot .pt{position:absolute;right:-5px;top:-9px;min-width:28px;height:28px;border-radius:99px;background:var(--sun);color:#221a00;font:700 16px/28px var(--num);text-align:center;padding:0 5px;z-index:2;box-shadow:0 2px 5px rgba(0,0,0,.4)}
.slot .pt.z{background:#59626a;color:#dfe5e8}
.slot .gr{position:absolute;left:-4px;top:-8px;border-radius:99px;background:var(--good);color:#06231c;font:700 11px/18px var(--num);padding:0 5px;z-index:2}
.slot .net{position:absolute;inset:0;background:repeating-linear-gradient(45deg,rgba(255,122,89,.35) 0 2px,transparent 2px 9px),repeating-linear-gradient(-45deg,rgba(255,122,89,.35) 0 2px,transparent 2px 9px);z-index:1;border-radius:8px}
.slot.pop{animation:cpop .3s}
@keyframes cpop{40%{transform:scale(1.12);filter:brightness(1.5)}}
.slot.gone{animation:cgone .5s}
@keyframes cgone{40%{filter:brightness(2.4) saturate(0)}}
.ctext{min-height:62px;font-size:13.5px;line-height:1.45;color:var(--dim)}
.ctext b{color:var(--ink);font-size:15px;margin-right:6px}
.ctext i{font-style:normal;color:var(--sun)}
.foot{display:flex;gap:8px}
.foot button{flex:1;border-radius:12px;padding:13px 4px;font-weight:700;font-size:15.5px;background:var(--panel);border:1px solid var(--line)}
.foot button.pri{flex:2;background:var(--sun);color:#221a00;border-color:var(--sun)}
.foot button[disabled]{opacity:.35}
.foot small{font-weight:400;opacity:.75;font-size:12.5px}
.sheet .offer{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.sheet .offer .cc{height:132px}
.sheet .offer p{grid-column:1/-1}
.ctoast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 120px);transform:translateX(-50%);background:rgba(4,18,24,.95);border:1px solid var(--line);border-radius:12px;padding:8px 16px;font-size:15px;font-weight:700;z-index:30;max-width:86vw;text-align:center;pointer-events:none}
@media (prefers-reduced-motion:reduce){.sunb,.field .mw,.finger{animation:none}}
</style>
<div id="app">
 <div class="modes"><div class="seg"><button id="mA" class="on">牌局</button><button id="mB">守礁</button></div><span id="mInfo"></span></div>
 <div id="mCG" class="mode">
  <div class="goal"><div class="n"><b id="cTot">0</b><span id="cTgt"></span><em id="cGain"></em></div><div class="bar"><i id="cBar"></i></div></div>
  <p class="tip" id="cTip"></p>
  <div class="slots" id="cSlots"></div>
  <div class="ctext" id="cText"></div>
  <div class="chand" id="cHand"></div>
  <div class="foot"><button id="cDis">弃掉</button><button class="pri" id="cEnd"></button></div>
 </div>
 <div id="mTD" class="mode" hidden>
 <div class="hud"><div class="en" id="enBox"><i></i><b id="en">0</b></div><div class="prog"><i id="pg"></i><s id="pgf"></s></div><span class="lv" id="lv"></span><button class="sm" id="bPrev" aria-label="上一关">‹</button><button class="sm" id="bNext" aria-label="下一关">›</button><button class="sm" id="bSnd" aria-label="声音">声</button></div>
 <p class="tip" id="tip"></p>
 <div class="field" id="field"></div>
 <div class="tray" id="tray"></div>
 </div>
</div>
<div class="ov" id="ov" hidden></div>
<script>/*ART*/</script>
<script>/*CORE*/</script>
<script>/*CG*/</script>
<script>
const $=id=>document.getElementById(id);
const ALG=big=>`<path d="M50 12 C66 6 78 18 80 28 C94 32 96 52 86 62 C92 78 76 92 62 86 C52 98 32 94 28 82 C12 82 4 62 14 50 C6 36 18 18 32 22 C36 14 44 10 50 12Z" fill="${big?'#4c6620':'#7a9a2e'}"/><path d="M30 30 C40 22 58 20 70 28" stroke="${big?'#6f8f2a':'#a4c04a'}" stroke-width="5" fill="none" stroke-linecap="round" opacity=".7"/><circle cx="36" cy="48" r="9" fill="#fff"/><circle cx="33" cy="49" r="4.2" fill="#111"/><circle cx="60" cy="48" r="9" fill="#fff"/><circle cx="57" cy="49" r="4.2" fill="#111"/><path d="M25 35 L44 41 M71 35 L52 41" stroke="#22310c" stroke-width="4.5" stroke-linecap="round"/><path d="M36 70 Q48 61 60 70" stroke="#22310c" stroke-width="4" fill="none" stroke-linecap="round"/>`;
const svg=inner=>`<svg viewBox="0 0 100 100" aria-hidden="true">${inner}</svg>`;
const uart=k=>svg(P[UNITS[k].art]()),fart=k=>svg(k==='cots'?P.cots():ALG(k==='big'));
let li=0,G,sel=null,snd=true,AC=null,els={},CW=60,CH=64,HOME=26,last=0,paused=false,seenSun=false;
try{const s=JSON.parse(localStorage.getItem('reefTD')||'{}');if(s.li!=null)li=Math.min(TDL.length-1,s.li);if(s.snd===false)snd=false}catch(e){}
const save=()=>{try{localStorage.setItem('reefTD',JSON.stringify({li,snd}))}catch(e){}};
function tone(f,d,type,v,slide){if(!snd||!AC)return;try{const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);g.gain.setValueAtTime(v||.08,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d)}catch(e){}}
let hitT=0;const SFX={sun:()=>{tone(880,.12,'sine',.09);setTimeout(()=>tone(1320,.14,'sine',.08),70)},place:()=>tone(220,.18,'triangle',.12,110),hit:()=>{const n=performance.now();if(n-hitT>90){hitT=n;tone(520,.05,'square',.025)}},die:()=>tone(300,.2,'sine',.1,80),eaten:()=>tone(160,.3,'sawtooth',.07,60),mow:()=>tone(200,.7,'sawtooth',.08,900),dash:()=>tone(120,.6,'sawtooth',.1,700),wave:()=>{tone(196,.5,'sawtooth',.09);setTimeout(()=>tone(147,.8,'sawtooth',.09),350)},win:()=>[523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,.25,'triangle',.1),i*130)),lose:()=>[330,262,196].forEach((f,i)=>setTimeout(()=>tone(f,.35,'sawtooth',.07),i*200))};
document.addEventListener('pointerdown',()=>{if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}else if(AC.state==='suspended')AC.resume()},{passive:true});
const px=x=>HOME+x*CW,py=r=>r*CH;
function start(){G=tdNew(li);sel=null;els={};paused=false;$('ov').hidden=true;save();const L=G.L,F=$('field');
 CW=(F.clientWidth-HOME)/COLS;CH=L.rows===1?CW*1.5:Math.min(66,CW*1.08);F.style.height=L.rows*CH+'px';
 let h='<div class="home"></div>';for(let r=0;r<L.rows;r++){h+=`<i class="mw" data-mw="${r}" style="top:${py(r)+CH/2-13}px"></i>`;for(let c=0;c<COLS;c++)h+=`<button class="cellb free" data-r="${r}" data-c="${c}" aria-label="第${r+1}条水道第${c+1}格" style="left:${px(c)+1}px;top:${py(r)+1}px;width:${CW-2}px;height:${CH-2}px"></button>`}
 F.innerHTML=h;F.className='field';$('tip').innerHTML=`<b>第 ${li+1} 关</b>${L.tip}`;$('lv').textContent=(li+1)+'/'+TDL.length;$('bPrev').disabled=li===0;$('bNext').disabled=li===TDL.length-1;$('bSnd').style.opacity=snd?1:.4;$('pgf').style.left=(G.finT/(G.script[G.script.length-1][0]+1)*100)+'%';tray();hint()}
function tray(){const L=G.L;$('tray').innerHTML=L.cards.map(k=>{const U=UNITS[k];return `<button class="card" data-k="${k}"><span class="co">${U.cost}</span>${uart(k)}<b>${U.n}</b><small>${U.role}</small><i class="cdm" style="height:0"></i></button>`}).join('')}
function hint(){document.querySelectorAll('.finger').forEach(e=>e.remove());if(li!==0||G.units.length)return;const f=document.createElement('span');f.className='finger';f.textContent='👆';
 if(sel==null){const c=document.querySelector('.card');c.appendChild(f);f.style.cssText='right:6px;bottom:22px'}else{$('field').appendChild(f);f.style.left=px(1)+CW*.45+'px';f.style.top=CH*.45+'px'}}
function mk(cls,html){const d=document.createElement('div');d.className=cls;if(html)d.innerHTML=html;$('field').appendChild(d);return d}
function burst(r,x){for(let i=0;i<6;i++){const b=mk('bub');b.style.left=px(x)+'px';b.style.top=py(r)+CH/2+'px';const a=Math.random()*6.28;b.style.setProperty('--dx',Math.cos(a)*34+'px');b.style.setProperty('--dy',Math.sin(a)*34-10+'px');setTimeout(()=>b.remove(),520)}}
function draw(){const seen={},F=$('field');
 for(const u of G.units){seen[u.id]=1;let e=els[u.id];if(!e){e=els[u.id]=mk('spr',uart(u.k)+'<span class="hp" hidden><i></i></span>');const w=CW*.92;e.style.width=w+'px';e.style.height=CH*.92+'px';e.style.transform=`translate(${px(u.c)+CW*.04}px,${py(u.r)+CH*.04}px)`;const cb=F.querySelector(`.cellb[data-r="${u.r}"][data-c="${u.c}"]`);if(cb)cb.classList.remove('free');e._r=u.r;e._c=u.c}
  const U=UNITS[u.k],bit=G.t-(u.bit||-9)<.2;e.classList.toggle('bit',bit);if(u.hp<U.hp){e.lastChild.hidden=false;e.lastChild.firstChild.style.width=Math.max(0,u.hp/U.hp*100)+'%'}}
 for(const f of G.foes){seen[f.id]=1;let e=els[f.id];const s=f.k==='big'?1.05:f.k==='cots'?.86:.8;if(!e){e=els[f.id]=mk('spr',fart(f.k));e.style.width=CW*s+'px';e.style.height=CW*s+'px';e.style.zIndex=4}
  const bob=Math.sin(G.t*3+f.ph)*3,rot=f.k==='cots'?G.t*40+f.ph*50:(f.eat?Math.sin(G.t*14)*8:0);e.style.transform=`translate(${px(f.x)-CW*s/2}px,${py(f.r)+(CH-CW*s)/2+bob}px) rotate(${rot}deg)`;e.classList.toggle('flash',G.t-(f.hit||-9)<.08)}
 for(const s of G.shots){seen[s.id]=1;let e=els[s.id];if(!e){if(s.dash&&!s.mow){e=mk('spr',uart('shark'));e.style.width=CW*1.5+'px';e.style.height=CH+'px';e.style.zIndex=5}else if(s.mow){e=mk('flow');e.style.zIndex=5}else e=mk('shot '+s.k);els[s.id]=e}
  e.style.transform=s.dash?`translate(${px(s.x)-CW*(s.mow?.9:.75)}px,${py(s.r)+(s.mow?CH*.2:0)}px)`:`translate(${px(s.x)-6}px,${py(s.r)+CH*.42}px)`}
 for(const s of G.suns){seen[s.id]=1;let e=els[s.id];if(!e){e=els[s.id]=mk('sunb');e.dataset.sun=s.id}e.style.transform=`translate(${px(s.x)}px,${py(s.y)+CH/2}px)`;e.classList.toggle('old',s.life<2.5)}
 for(const id in els)if(!seen[id]){const e=els[id];if(e._r!=null){const cb=F.querySelector(`.cellb[data-r="${e._r}"][data-c="${e._c}"]`);if(cb)cb.classList.add('free')}e.remove();delete els[id]}
 G.mow.forEach((m,r)=>{const e=F.querySelector(`[data-mw="${r}"]`);if(e&&!m)e.remove()});
 $('en').textContent=G.energy;$('pg').style.width=Math.min(100,G.t/(G.script[G.script.length-1][0]+1)*100)+'%';
 document.querySelectorAll('.card').forEach(c=>{const k=c.dataset.k,U=UNITS[k];c.classList.toggle('poor',G.energy<U.cost);c.classList.toggle('sel',sel===k);c.lastElementChild.style.height=(G.cd[k]/U.cd*100)+'%'});
 F.classList.toggle('pick',sel!=null&&!UNITS[sel].dash);
 if(li===0&&!seenSun&&G.suns.some(s=>s.y>=s.ty)&&!document.querySelector('.finger.s')){const s=G.suns.find(s=>s.y>=s.ty),f=document.createElement('span');f.className='finger s';f.textContent='👆';f.style.left=px(s.x)+4+'px';f.style.top=py(s.y)+CH/2+6+'px';F.appendChild(f)}}
function events(){for(const e of G.ev){const k=e[0];if(SFX[k])SFX[k]();
  if(k==='die')burst(e[1],e[2]);if(k==='sun'){$('enBox').classList.remove('bump');void $('enBox').offsetWidth;$('enBox').classList.add('bump')}
  if(k==='wave'){const b=mk('banner');b.textContent='大潮来了';setTimeout(()=>b.remove(),2400)}
  if(k==='win')setTimeout(()=>finish(true),900);if(k==='lose')setTimeout(()=>finish(false),600)}G.ev.length=0}
function loop(ts){requestAnimationFrame(loop);const dt=Math.min(.05,(ts-last)/1000||0);last=ts;if(mode!=='td'||!G||paused||!$('ov').hidden||document.hidden)return;if(!G.over){const n=window.__speed||1;for(let i=0;i<n;i++)tdStep(G,dt)}events();draw()}
function ov(html){$('ov').innerHTML=`<div class="sheet">${html}</div>`;$('ov').hidden=false}
function finish(win){const L=G.L,last=li===TDL.length-1;if(!win){ov(`<h1>礁石被盖住了</h1><p>有一条水道没守住。每条水道的海流只能帮你冲一次。</p><p>${li?'先种珊瑚攒能量，再把鱼补到有敌人的水道。':'看到藻团出现，就在那条水道放鹦嘴鱼。'}</p><button class="go" data-act="retry">再来一次</button>`);return}
 const u=L.unlock&&UNITS[L.unlock];ov(`<h1>${last?'这片礁守住了':'守住了'}</h1>${u?`<p style="text-align:center">博士刻好了一张新的记忆卡</p><div class="new">${uart(L.unlock)}<b>${u.n}</b><small>${u.role}</small></div><p>${u.fact}</p>`:`<p>大潮退了，藻类没能盖住礁石。${UNITS.shark.fact}</p>`}<button class="go" data-act="${last?'retry':'next'}">${last?'再守一次':'下一关'}</button>`)}
document.addEventListener('pointerdown',e=>{const s=e.target.closest('.sunb');if(s&&G&&!G.over){e.preventDefault();if(tdSun(G,+s.dataset.sun)){seenSun=true;document.querySelectorAll('.finger.s').forEach(f=>f.remove())}}});
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t||mode!=='td')return;const d=t.dataset;
 if(t.id==='bSnd'){snd=!snd;save();t.style.opacity=snd?1:.4;return}
 if(t.id==='bPrev'){if(li>0){li--;start()}return}
 if(t.id==='bNext'){if(li<TDL.length-1){li++;start()}return}
 if(d.act==='retry'){start();return}
 if(d.act==='next'){li=Math.min(TDL.length-1,li+1);start();return}
 if(!G||G.over)return;
 if(d.k){const U=UNITS[d.k];if(G.energy<U.cost||G.cd[d.k]>0){tone(140,.12,'square',.04);return}sel=sel===d.k?null:d.k;hint();return}
 if(d.r!=null&&sel){if(tdPlace(G,sel,+d.r,+d.c)){sel=null;hint()}else tone(140,.12,'square',.04)}});
requestAnimationFrame(loop);
</script>
<script>
/* ---------- 牌局界面 ---------- */
let mode='cg',S,csel=null,cinfo=null,cbusy=false,ctT=0,tdStarted=false;
const cart=id=>CD[id].art?svg(P[CD[id].art]()):'';
const ccard=(k,attr,extra)=>{const d=CD[k.id||k];return `<button class="cc ${d.fx?'fx':''} ${extra||''}" ${attr||''}>${d.fx?'':`<span class="no">${d.p}</span>`}${cart(k.id||k)}<b>${d.n}</b><small>${d.tx}</small></button>`};
function csay(t){document.querySelectorAll('.ctoast').forEach(e=>e.remove());const d=document.createElement('div');d.className='ctoast';d.textContent=t;document.body.appendChild(d);clearTimeout(ctT);ctT=setTimeout(()=>d.remove(),1800)}
const CTIPS=['打出的生物留在礁上，每回合结束都得分，还会长大 +1。每回合只能打 2 张。','没打的牌会留在手里。不想要的，选中后点“弃掉”，下回合补新的。','礁位满了？把新牌放到旧牌上，就能替换它。','单张都不强，搭起来才强：海葵让小丑鱼翻倍，裂唇鱼让左右翻倍。'];
function crender(){const st=CST[S.stage],sc=cgScore(S),lim=cgLimit(S),left=lim-S.played,k=csel!=null?S.hand[csel]:null;
 $('mInfo').textContent=`${st.n} · 第 ${S.turn} / ${st.turns} 回合`;$('cTot').textContent=S.total;$('cTgt').textContent='/ '+S.target;$('cBar').style.width=Math.min(100,S.total/S.target*100)+'%';
 $('cGain').textContent=sc.total?`这回合 +${sc.total}${S.x2?'（×2）':''}`:'';
 $('cTip').innerHTML=S.stage===0?`<b>${S.turn<=4?'第 '+S.turn+' 步':'提示'}</b>${CTIPS[Math.min(3,S.turn-1)]}`:`<b>${st.n}</b>${st.rule}`;
 const canPut=k&&!CD[k.id].fx&&left>0;
 $('cSlots').innerHTML=S.slots.map((c,i)=>{if(st.block===i)return `<div class="slot algae">藻类</div>`;const p=sc.F[i];
  return `<button class="slot ${c?'full':''} ${canPut?'tgt':''}" data-s="${i}">${c?ccard(c,'tabindex="-1"',cinfo===i?'sel':'').replace('<button','<span').replace('</button>','</span>')+`<span class="pt ${p?'':'z'}">${p}</span>`+(c.b?`<span class="gr">+${c.b}</span>`:'')+(c.net?'<span class="net"></span>':''):(st.wash&&i===SLOTS-1?'急流':'礁位')}</button>`}).join('');
 let tx='';const show=k?k.id:(cinfo!=null&&S.slots[cinfo]?S.slots[cinfo].id:null);
 if(show){const d=CD[show];tx=`<b>${d.n}</b><i>${d.lg||d.tx+(d.fx?'':'。')}</i>${k&&d.fx?' <button class="pri" id="cUse" style="background:var(--sun);color:#221a00;border-radius:99px;padding:2px 14px;font-weight:700">使用</button>':''}<br>${d.fact}`}
 else tx=left>0?'点一张手牌，再点一个礁位。':'这回合打满了。点“结束回合”结算。';
 $('cText').innerHTML=tx;
 $('cHand').innerHTML=S.hand.map((c,i)=>ccard(c,`data-h="${i}"`,csel===i?'sel':'')).join('');
 $('cDis').disabled=csel==null;$('cEnd').innerHTML=`结束回合 <small>${left>0?'还能打 '+left+' 张':'打满了'}</small>`}
function cfloat(i,txt){const el=document.querySelectorAll('#cSlots>*')[i];if(!el)return;el.classList.add('pop')}
async function cend(){if(cbusy||S.over)return;cbusy=true;csel=null;cinfo=null;crender();const sc=cgScore(S),sl=()=>[...document.querySelectorAll('#cSlots>*')];let run=0;const t0=S.total;
 for(let i=0;i<SLOTS;i++){if(sc.F[i]==null)continue;run+=sc.F[i];sl()[i].classList.add('pop');$('cGain').textContent='+'+run;tone(440+i*70,.09,'triangle',.07);await new Promise(r=>setTimeout(r,window.__fast?0:170))}
 if(S.x2){$('cGain').textContent='+'+run+' ×2 = +'+run*2;tone(990,.25,'triangle',.09);await new Promise(r=>setTimeout(r,window.__fast?0:500))}
 const ev=cgEnd(S);$('cTot').textContent=S.total;$('cBar').style.width=Math.min(100,S.total/S.target*100)+'%';await new Promise(r=>setTimeout(r,window.__fast?0:450));
 const msg=[];if(ev.ate.length){ev.ate.forEach(i=>sl()[i].classList.add('gone'));msg.push('躄鱼吃掉了左边的鱼')}if(ev.wash!=null){sl()[ev.wash].classList.add('gone');msg.push('急流冲走了最右边的生物')}if(ev.net!=null)msg.push('渔网缠住了得分最高的生物');
 if(msg.length){csay(msg.join('；'));await new Promise(r=>setTimeout(r,window.__fast?0:500))}
 cbusy=false;if(S.over){cfinish();return}crender()}
function cfinish(){const st=CST[S.stage];if(S.over==='lose'){SFX.lose();ov(`<h1>污染没有退去</h1><p style="text-align:center;font:700 26px var(--num);color:var(--sun)">${S.total} / ${S.target}</p><p>单张牌的分数不够。把能互相加强的生物放到一起，越早放下，长得越大。</p><button class="go" data-cact="new">再来一局</button>`);return}
 SFX.win();if(S.offer)ov(`<h1>${st.n}净化完成</h1><p style="text-align:center">博士刻好了新的记忆卡，选 1 张加入牌组。</p><div class="offer">${S.offer.map((k,i)=>ccard(k,`data-pick="${i}"`)).join('')}<p id="cPickInfo" style="font-size:13px;color:var(--dim)">点一张看说明，再点一次确认。</p></div>`);
 else ov(`<h1>这片礁净化完成</h1><p style="text-align:center;font:700 26px var(--num);color:var(--sun)">${S.total} / ${S.target}</p><p>三片水域都恢复了。你的牌组里现在有 ${S.cards.length} 张记忆卡。</p><button class="go" data-cact="new">再来一局</button>`)}
let cpick=null;
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;const d=t.dataset;
 if(t.id==='mA'||t.id==='mB'){mode=t.id==='mA'?'cg':'td';$('mA').className=mode==='cg'?'on':'';$('mB').className=mode==='td'?'on':'';$('mCG').hidden=mode!=='cg';$('mTD').hidden=mode!=='td';$('ov').hidden=true;try{localStorage.setItem('reefMode',mode)}catch(e){}
  if(mode==='td'){$('mInfo').textContent='';if(!tdStarted){tdStarted=true;start()}}else crender();return}
 if(mode!=='cg')return;
 if(d.cact==='new'){S=cgInit();csel=cinfo=null;$('ov').hidden=true;crender();return}
 if(d.pick!=null){const i=+d.pick;if(cpick===i){cpick=null;cgPick(S,i);csel=cinfo=null;$('ov').hidden=true;crender()}else{cpick=i;const dd=CD[S.offer[i]];document.querySelectorAll('.offer .cc').forEach((c,j)=>c.classList.toggle('sel',j===i));$('cPickInfo').innerHTML=`<b style="color:var(--ink)">${dd.n}</b>　<span style="color:var(--sun)">${dd.lg||dd.tx}</span><br>${dd.fact}<br>再点一次确认。`}return}
 if(cbusy||S.over)return;
 if(t.id==='cUse'){if(cgPlay(S,csel,-1)){csel=null;tone(660,.2,'triangle',.09);crender()}else csay('这回合打满了');return}
 if(d.h!=null){csel=csel===+d.h?null:+d.h;cinfo=null;crender();return}
 if(d.s!=null){const i=+d.s;if(csel!=null){const k=S.hand[csel];if(CD[k.id].fx){csay('点“使用”来用这张牌');return}if(cgPlay(S,csel,i)){csel=null;cinfo=null;SFX.place();crender();document.querySelectorAll('#cSlots>*')[i].classList.add('pop')}else csay(S.played>=cgLimit(S)?'这回合打满了，点“结束回合”':'这一格不能放')}else{cinfo=cinfo===i?null:i;crender()}return}
 if(t.id==='cDis'){if(csel!=null&&cgDiscard(S,csel)){csel=null;crender()}return}
 if(t.id==='cEnd'){cend();return}});
S=cgInit();crender();
try{if(localStorage.getItem('reefMode')==='td')$('mB').click()}catch(e){}
</script>
