<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#061d26"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black"></head><body style="margin:0"><title>记忆礁</title>
<style>
/* 布局：一屏竖版。顶=版本切换与关卡，一句提示，大号进度，玩法区，手牌，一个主按钮。单一深海配色。 */
:root{color-scheme:dark;
 --sea:#061d26;--deep:#0b2c38;--panel:#123f4e;--line:#1f5362;--ink:#e9f5f2;--dim:#8db1b5;
 --sun:#ffc93c;--good:#4fd39a;--bad:#ff7a59;
 --ui:"PingFang SC","HarmonyOS Sans SC","MiSans","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
 --num:"DIN Alternate","Bahnschrift","Roboto Condensed",ui-monospace,monospace}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--sea);color:var(--ink);font:15px/1.5 var(--ui);-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:2px solid var(--sun);outline-offset:2px}
#app{max-width:440px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:12px;padding-inline:16px;padding-block:10px 14px}
.top{display:flex;align-items:center;gap:8px}
.seg{display:flex;border:1px solid var(--line);border-radius:99px;overflow:hidden;flex:none}
.seg button{padding:4px 11px;font-size:12.5px;color:var(--dim);font-weight:700}
.seg button.on{background:var(--ink);color:var(--sea)}
.lvl{flex:1;min-width:0;display:flex;align-items:center;justify-content:flex-end;gap:4px;font-size:13px;color:var(--dim)}
.lvl b{color:var(--ink);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lvl button{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);font-size:16px;line-height:1;color:var(--dim);flex:none}
.lvl button[disabled]{opacity:.3}
.tip{margin:0;font-size:15.5px;line-height:1.45;text-wrap:pretty;min-height:46px}
.tip b{display:inline-block;background:var(--sun);color:#221a00;border-radius:6px;font-size:12px;padding:0 6px;margin-right:6px;vertical-align:2px}
.goal{display:flex;flex-direction:column;gap:5px}
.goal .n{display:flex;align-items:baseline;gap:8px;font:700 16px var(--num);font-variant-numeric:tabular-nums;color:var(--dim)}
.goal .n b{font-size:34px;line-height:1;color:var(--sun)}
.goal .n b.done{color:var(--good)}
.goal .n em{font:13px var(--ui);margin-left:auto;font-style:normal;text-align:right}
.bar{height:10px;border-radius:99px;background:#2a3117;overflow:hidden;border:1px solid #3c4a1c}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#1fa7b8,#4fd39a);border-radius:99px;transition:width .5s}
.sub{min-height:24px;font-size:13.5px;color:var(--dim);text-align:center}
.sub b{font:700 17px var(--num);color:var(--ink)}
.sub b.t{color:var(--sun);font-size:20px}
.sub.pulse{animation:pulse .5s}
@keyframes pulse{40%{transform:scale(1.18)}}
/* 家的颜色：牌底和格子用同一种颜色 */
.h-A{--h:#ff6fae}.h-C,.h-reef{--h:#ff8a6b}.h-S,.h-sand{--h:#e3cf9a}.h-B,.h-blue{--h:#4aa8ff}.h-grass{--h:#58c27a}.h-X{--h:#6b7a2c}
.board{display:grid;gap:6px;margin:0 auto;width:100%}
.cell{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;border:2.5px solid var(--h);background:color-mix(in srgb,var(--h) 22%,#0b2c38)}
.cell.h-S{background:linear-gradient(#dcc890,#c3ab71)}
.cell.h-B{background:linear-gradient(#1f78b5,#0d4577)}
.cell.h-X{background:radial-gradient(circle at 28% 30%,#6b7a2c 0 17%,transparent 18%),radial-gradient(circle at 72% 62%,#56642a 0 21%,transparent 22%),radial-gradient(circle at 40% 82%,#4a5722 0 13%,transparent 14%),#2a3117;border-color:#3c4a1c}
.cell svg{position:absolute;pointer-events:none}
.cell .cb{inset:8% 8% 0 8%;width:84%;height:92%}
.cell.fishy .cb{opacity:.5}
.cell .cf{left:10%;top:8%;width:80%;height:78%;filter:drop-shadow(0 2px 3px rgba(0,0,0,.45))}
.cell .bl{position:absolute;left:5px;bottom:4px;font-size:11px;font-weight:700;padding:0 7px;border-radius:99px;background:var(--h);color:#10242b}
.cell.h-X .bl{background:none;color:#aab777}
.cell .pt{position:absolute;right:4px;top:4px;min-width:24px;height:24px;border-radius:99px;background:var(--sun);color:#221a00;font:700 14px/24px var(--num);text-align:center;padding:0 5px}
.cell .pt.x2{background:var(--good)}
.cell.hl{animation:glow .9s infinite alternate}
.cell.pop{animation:pop .3s}
.cell.hit{animation:hit .8s}
.cell.no{animation:no .3s}
@keyframes glow{from{box-shadow:0 0 0 0 var(--sun)}to{box-shadow:0 0 0 4px var(--sun)}}
@keyframes pop{40%{transform:scale(1.1);filter:brightness(1.5)}}
@keyframes hit{30%{filter:brightness(2.2) saturate(0)}}
@keyframes no{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.hand{display:flex;flex-wrap:wrap;justify-content:center;gap:7px}
.hand.g4{display:grid;grid-template-columns:repeat(4,1fr)}
.card{position:relative;width:74px;height:100px;border-radius:10px;background:linear-gradient(#1a5666,#103e4c);border:2px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;transition:transform .15s}
.hand.g4 .card{width:auto}
.card svg{position:absolute;left:12%;top:14px;width:76%;height:46px}
.card b{font-size:13px;line-height:1.1;margin-bottom:4px}
.card .hm{width:100%;background:var(--h);color:#10242b;font-size:11.5px;font-weight:700;text-align:center;line-height:18px;border-radius:0 0 7px 7px}
.card .no{position:absolute;left:0;top:0;min-width:24px;height:24px;border-radius:8px 0 10px 0;background:var(--sun);color:#221a00;font:700 15px/24px var(--num);text-align:center}
.card .st{position:absolute;right:5px;top:2px;color:var(--sun);font-size:13px}
.card.sel{transform:translateY(-8px);border-color:var(--sun);box-shadow:0 6px 14px rgba(0,0,0,.4)}
.card.mate{border-color:var(--good);border-style:dashed;animation:glow2 .8s infinite alternate}
@keyframes glow2{to{box-shadow:0 0 0 3px var(--good)}}
.card.fly{animation:fly .45s forwards}
@keyframes fly{to{transform:translateY(-70px) scale(.7);opacity:0}}
.cell .finger{right:6px;bottom:2px}
.finger{position:absolute;right:-4px;bottom:-12px;font-size:26px;animation:tap 1s infinite;pointer-events:none;z-index:3}
@keyframes tap{50%{transform:translate(-4px,-6px) scale(.9)}}
.sk{min-height:22px;text-align:center;font-size:13.5px;color:var(--sun)}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.chips button{border:1px solid var(--line);border-radius:99px;padding:2px 10px;font-size:12px;color:var(--dim)}
.chips button.new{border-color:var(--sun);color:var(--sun)}
.foot{display:flex;gap:8px;margin-top:auto}
.foot button{flex:1;border-radius:12px;padding:13px 4px;font-weight:700;font-size:16px;background:var(--panel);border:1px solid var(--line)}
.foot button.pri{flex:1.6;background:var(--sun);color:#221a00;border-color:var(--sun)}
.foot button[disabled]{opacity:.35}
.fact{background:var(--deep);border:1px solid var(--good);border-radius:12px;padding:9px 12px;font-size:13.5px;color:#cfe9df}
.fact b{color:var(--good)}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 150px);transform:translateX(-50%);background:rgba(4,18,24,.95);border:1px solid var(--line);border-radius:12px;padding:9px 16px;font-size:15px;font-weight:700;z-index:30;max-width:86vw;text-align:center;pointer-events:none}
.toast.bad{border-color:var(--bad);color:#ffc2b0}.toast.good{border-color:var(--good);color:#b8f3d9}
.ov{position:fixed;inset:0;z-index:40;background:rgba(3,14,19,.88);display:flex;align-items:center;justify-content:center;padding:16px}
.sheet{width:100%;max-width:400px;max-height:100%;overflow:auto;background:var(--deep);border:1px solid var(--line);border-radius:18px;padding:20px 18px}
.sheet h1{margin:0 0 6px;font-size:26px;letter-spacing:.05em}
.sheet p{margin:8px 0;color:#cfe3e1}
.sheet .big{font:700 30px var(--num);color:var(--sun)}
.sheet .go{display:block;width:100%;margin-top:14px;background:var(--sun);color:#221a00;font-weight:700;font-size:16px;border-radius:12px;padding:12px}
.sheet table{width:100%;border-collapse:collapse;font-size:13.5px}
.sheet td{padding:7px 4px;border-top:1px solid var(--line);vertical-align:top}
.sheet td:last-child{font:700 13px var(--num);color:var(--sun);white-space:nowrap;text-align:right}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<div id="app">
 <div class="top"><div class="seg"><button id="bV1">v1 摆鱼</button><button id="bV2">v2 组牌</button></div><div class="lvl"><button id="bPrev" aria-label="上一关">‹</button><b id="lvt"></b><button id="bNext" aria-label="下一关">›</button></div></div>
 <p class="tip" id="tip"></p>
 <div class="goal"><div class="n"><b id="tot">0</b><span id="tgt"></span><em id="side"></em></div><div class="bar"><i id="barI"></i></div></div>
 <div id="stage" style="display:flex;flex-direction:column;gap:12px"></div>
 <div class="foot" id="foot"></div>
</div>
<div class="ov" id="ov" hidden></div>
<script>let UID=0;const uid=p=>p+(++UID);
function star(cx,cy,n,rIn,rOut,rot=0){let p=[];for(let k=0;k<n*2;k++){const a=rot-Math.PI/2+k*Math.PI/n,r=k%2?rIn:rOut;p.push((cx+r*Math.cos(a)).toFixed(1)+','+(cy+r*Math.sin(a)).toFixed(1))}return p.join(' ')}
const EYE=(x,y,r=1.8)=>`<circle cx="${x}" cy="${y}" r="${r+1}" fill="#fff"/><circle cx="${x}" cy="${y}" r="${r}" fill="#111"/>`;
function fishBody(col,opt={}){const id=uid('fb');const d=opt.d||'M16 50 C26 34 54 31 74 39 C84 43 90 47 90 50 C90 53 84 57 74 61 C54 69 26 66 16 50Z';
 return `<defs><clipPath id="${id}"><path d="${d}"/></clipPath></defs><path d="${opt.tail||'M18 50 L4 38 C7 46 7 54 4 62Z'}" fill="${opt.tc||col}"/>${opt.fins||''}<path d="${d}" fill="${col}"/><g clip-path="url(#${id})">${opt.pattern||''}</g>${EYE(opt.ex||78,opt.ey||46)}`}
const P={
 turtle:(s='#6f5a2c',k='#8fa35a',sc='#c9b27a')=>`
  <path d="M34 40 C16 34 4 22 6 16 C17 18 29 29 38 36Z" fill="${k}"/><path d="M66 40 C84 34 96 22 94 16 C83 18 71 29 62 36Z" fill="${k}"/>
  <path d="M40 73 C32 81 29 89 32 91 C38 87 43 81 45 76Z" fill="${k}"/><path d="M60 73 C68 81 71 89 68 91 C62 87 57 81 55 76Z" fill="${k}"/>
  <ellipse cx="50" cy="20" rx="8" ry="10" fill="${k}"/><circle cx="46.5" cy="16.5" r="1.5" fill="#111"/><circle cx="53.5" cy="16.5" r="1.5" fill="#111"/>
  <ellipse cx="50" cy="53" rx="21" ry="26" fill="${s}"/>
  <path d="M50 31 L58 39 L58 51 L50 57 L42 51 L42 39Z M50 57 L58 65 L50 75 L42 65Z M42 39 L31 43 M58 39 L69 43 M42 51 L30 56 M58 51 L70 56 M42 65 L35 70 M58 65 L65 70" fill="none" stroke="${sc}" stroke-width="1.4" stroke-linejoin="round"/>`,
 hawksbill:()=>P.turtle('#8a5a2a','#b08a52','#e0b776')+`<path d="M47 12 L50 8 L53 12" fill="#b08a52"/>`,
 loggerhead:()=>P.turtle('#9a5b2e','#c08a4e','#e2b37c').replace('rx="8" ry="10"','rx="10" ry="11"'),
 ridley:()=>P.turtle('#6b6b52','#8e9170','#bdbb96'),
 leatherback:()=>`<path d="M34 40 C14 34 2 20 4 12 C16 15 29 28 38 36Z" fill="#2d3238"/><path d="M66 40 C86 34 98 20 96 12 C84 15 71 28 62 36Z" fill="#2d3238"/><ellipse cx="50" cy="19" rx="8" ry="10" fill="#2d3238"/><path d="M50 28 C66 30 70 52 64 74 L50 94 L36 74 C30 52 34 30 50 28Z" fill="#23272c"/><path d="M50 30 V90 M42 34 L40 78 M58 34 L60 78" stroke="#8b9199" stroke-width="1.2" fill="none"/>${[40,50,60,70].map(y=>`<circle cx="46" cy="${y}" r="1" fill="#c7ccd2"/><circle cx="55" cy="${y+4}" r="1" fill="#c7ccd2"/>`).join('')}`,
 snake:(a='#a9c6de',b='#1c2530')=>{const d='M6 62 C18 40 32 40 42 56 S66 76 80 54 S92 40 92 40';return `<path d="${d}" fill="none" stroke="${a}" stroke-width="9" stroke-linecap="round"/><path d="${d}" fill="none" stroke="${b}" stroke-width="9" stroke-dasharray="4 7"/><path d="M4 58 L10 72 L12 60Z" fill="${b}"/><ellipse cx="93" cy="39" rx="6.5" ry="4.5" fill="${b}" transform="rotate(-30 93 39)"/><ellipse cx="96" cy="41" rx="3" ry="1.8" fill="#f2c94c" transform="rotate(-30 96 41)"/><circle cx="92" cy="37" r="1" fill="#fff"/>`},
 snake2:()=>P.snake('#d9d4b2','#3a4a3e'),
 octopus:(c='#b8573c',l='#e58b6c')=>{const arms=[[42,58,'C34 70 22 70 16 80 C13 86 20 88 22 83'],[46,60,'C42 74 34 82 34 92'],[50,60,'C50 74 46 84 50 94'],[54,60,'C58 74 66 82 66 92'],[58,58,'C66 70 78 70 84 80 C87 86 80 88 78 83'],[40,54,'C28 58 16 54 8 60'],[60,54,'C72 58 84 54 92 60'],[48,60,'C44 70 40 76 42 84']];
  return arms.map(a=>`<path d="M${a[0]} ${a[1]} ${a[2]}" fill="none" stroke="${c}" stroke-width="5" stroke-linecap="round"/>`).join('')+`<ellipse cx="50" cy="32" rx="19" ry="24" fill="${c}"/>${[[44,22],[56,26],[50,16],[46,34],[57,38]].map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="2.2" fill="${l}"/>`).join('')}${EYE(42,48,2)}${EYE(58,48,2)}`},
 octopus2:()=>{let s='';for(let k=0;k<8;k++){s+=`<path d="M${40+k*2.5} 50 L${6+k*12} 94" stroke="#d9c7a8" stroke-width="4.5" stroke-linecap="round"/><path d="M${40+k*2.5} 50 L${6+k*12} 94" stroke="#4a3526" stroke-width="4.5" stroke-dasharray="5 5"/>`}return s+`<ellipse cx="50" cy="32" rx="14" ry="20" fill="#d9c7a8"/><path d="M38 26 H62 M37 36 H63" stroke="#4a3526" stroke-width="3"/>${EYE(44,46,1.6)}${EYE(56,46,1.6)}`},
 blueringed:()=>P.octopus('#d8b24a','#e8cf7a')+[[44,20],[56,24],[50,34],[40,30],[60,34]].map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="none" stroke="#1d5fd0" stroke-width="2"/>`).join(''),
 cuttle:()=>`<path d="M12 50 C12 32 30 26 58 28 C74 29 80 38 80 50 C80 62 74 71 58 72 C30 74 12 68 12 50Z" fill="#a8866a"/><path d="M14 50 C14 36 30 31 58 32 C72 33 77 40 77 50 C77 60 72 67 58 68 C30 69 14 64 14 50Z" fill="#c9a98a"/>${[[30,42],[44,40],[58,44],[36,56],[52,58],[66,52]].map(p=>`<ellipse cx="${p[0]}" cy="${p[1]}" rx="4" ry="2.5" fill="#f1e2cf"/>`).join('')}<path d="M80 44 C88 42 94 40 97 38 M80 48 C88 47 94 47 98 46 M80 52 C88 53 94 54 98 55 M80 56 C88 58 94 61 97 63" stroke="#a8866a" stroke-width="3.5" stroke-linecap="round"/>${EYE(76,44,1.8)}`,
 squid:()=>`<path d="M6 50 L22 38 L22 62Z" fill="#c9d6de"/><path d="M18 50 C18 42 40 40 62 43 C74 45 78 47 78 50 C78 53 74 55 62 57 C40 60 18 58 18 50Z" fill="#dbe6ec" stroke="#9fb6c3"/>${[42,46,50,54,58].map(y=>`<path d="M76 ${50+(y-50)*.4} C86 ${y} 92 ${y+ (y-50)*.3} 97 ${y+(y-50)*.5}" stroke="#c9d6de" stroke-width="2.4" stroke-linecap="round" fill="none"/>`).join('')}${EYE(72,48,2.2)}`,
 nudi:()=>`<path d="M8 56 C8 40 30 36 52 36 C74 36 94 42 94 56 C94 66 74 70 52 70 C30 70 8 66 8 56Z" fill="#3e6fd6" stroke="#fff" stroke-width="3"/><path d="M18 54 C40 50 64 50 86 54" stroke="#141414" stroke-width="3" fill="none"/>${[[30,46],[44,44],[58,45],[36,62],[60,63]].map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="1.4" fill="#fff"/>`).join('')}<path d="M18 41 L13 26 M26 39 L24 24" stroke="#f08a24" stroke-width="4" stroke-linecap="round"/><path d="M76 39 L70 26 M80 38 L79 23 M84 39 L88 25 M88 41 L95 30" stroke="#f08a24" stroke-width="3" stroke-linecap="round"/>`,
 phyllidia:()=>`<path d="M8 56 C8 38 30 34 52 34 C74 34 94 40 94 56 C94 68 74 72 52 72 C30 72 8 68 8 56Z" fill="#111"/>${[[24,46],[40,42],[56,42],[72,46],[32,60],[50,62],[68,60]].map(p=>`<ellipse cx="${p[0]}" cy="${p[1]}" rx="6" ry="4" fill="#9ec3e8"/><circle cx="${p[0]}" cy="${p[1]-1}" r="2" fill="#f2c230"/>`).join('')}<path d="M16 40 L12 28 M24 38 L22 26" stroke="#f2c230" stroke-width="4" stroke-linecap="round"/>`,
 aeolid:()=>{let s='<path d="M6 62 C20 56 60 54 94 60 C70 66 30 68 6 62Z" fill="#e8dcc0"/>';for(let k=0;k<14;k++){const x=16+k*5.4;s+=`<path d="M${x} 60 C${x-6} 46 ${x+4} 38 ${x-2} ${30+(k%3)*4}" stroke="${k%2?'#6fa86a':'#d9a441'}" stroke-width="3.2" stroke-linecap="round" fill="none"/>`}return s+`<path d="M90 58 L96 44 M86 58 L90 44" stroke="#e8dcc0" stroke-width="3" stroke-linecap="round"/>`},
 elysia:()=>`<path d="M8 60 C14 44 34 30 54 32 C74 34 92 44 94 58 C80 52 70 66 52 66 C34 66 22 54 8 60Z" fill="#4c9a48"/><path d="M20 58 C30 46 44 40 56 42 C70 44 82 50 88 56" stroke="#8fd08a" stroke-width="2" fill="none"/><path d="M90 50 L97 40 M86 48 L90 38" stroke="#4c9a48" stroke-width="3.5" stroke-linecap="round"/>${[[36,50],[52,46],[66,50]].map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="1.5" fill="#dff5a8"/>`).join('')}`,
 cone:()=>`<path d="M20 30 L86 44 C92 46 92 54 86 56 L20 70 C12 66 10 56 10 50 C10 44 12 34 20 30Z" fill="#e9dcc2"/>${[[30,40],[40,46],[52,40],[60,52],[36,58],[70,48],[48,56]].map(p=>`<path d="M${p[0]} ${p[1]} l5 -2 l2 4 l-5 2z" fill="#8a4b2c"/>`).join('')}<path d="M20 30 C14 38 14 62 20 70" stroke="#c4b391" stroke-width="2" fill="none"/><path d="M88 50 L98 48" stroke="#c96b4a" stroke-width="2.5" stroke-linecap="round"/>`,
 cowrie:()=>`<ellipse cx="50" cy="52" rx="40" ry="26" fill="#7a4a2e"/><ellipse cx="50" cy="48" rx="34" ry="19" fill="#b98556"/>${[[34,42],[48,38],[62,42],[40,52],[56,52],[70,48],[28,52]].map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="#f0dcc0"/>`).join('')}<path d="M16 60 C40 70 60 70 84 60" stroke="#3f2616" stroke-width="2" fill="none"/>`,
 clam:()=>`<path d="M6 62 C10 40 30 30 50 30 C70 30 90 40 94 62 C80 70 20 70 6 62Z" fill="#d7cfbd"/><path d="M14 58 C18 44 34 38 50 38 C66 38 82 44 86 58" fill="none" stroke="#b7ad96" stroke-width="2"/><path d="M12 62 L20 54 L28 62 L36 54 L44 62 L52 54 L60 62 L68 54 L76 62 L84 54 L90 62 C70 72 30 72 12 62Z" fill="#2f6fb3"/>${[[24,62],[40,62],[56,62],[72,62]].map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="2" fill="#7fd0f0"/>`).join('')}<ellipse cx="50" cy="65" rx="5" ry="2.5" fill="#1b3f6a"/>`,
 cots:()=>`<polygon points="${star(50,52,14,24,44)}" fill="#6d5a86"/><circle cx="50" cy="52" r="24" fill="#7d6a96"/>${Array.from({length:40},(_,k)=>{const a=k*0.9,r=8+(k%5)*7;return `<circle cx="${(50+r*Math.cos(a)).toFixed(1)}" cy="${(52+r*Math.sin(a)).toFixed(1)}" r="1.6" fill="#e39b93"/>`}).join('')}`,

const shuf=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

 if(L.turns){st.deck=shuf(L.deck.slice());v1draw(st)}else st.hand=L.hand.slice();return st}

 for(let ch=1;ch;){ch=0;for(const q in st.put){const[a,b]=q.split(',').map(Number);if(v1type(st,a,b)!==SP1[st.put[q]].home){st.hand.push(st.put[q]);delete st.put[q];ch=1}}}return true}

  if(P.length){const p=P[Math.floor(Math.random()*P.length)];st.grid[p[0]][p[1]]='X';ev.algae=p}}

function combo(ids,on){const n=ids.length;if(!n)return null;let best={key:null,n:'',mult:1};const tryc=(key,ok,extra)=>{if(on.includes(key)&&ok&&COMBO[key].m[n]&&COMBO[key].m[n]>best.mult)best={key,n:COMBO[key].n+(extra||''),mult:COMBO[key].m[n]}};
 const sp=ids.map(i=>SP2[i]);tryc('home',n>=2&&sp.every(s=>s.home===sp[0].home),' · '+HOME2[sp[0].home].n);tryc('school',n>=2&&ids.every(i=>i===ids[0]));
 const lv=sp.map(s=>s.lv).sort((a,b)=>a-b);tryc('chain',n>=3&&lv.every((v,i)=>!i||v===lv[i-1]+1));tryc('pair',n===2&&partner(ids[0])===ids[1]);return best}
const chips=(ids,L)=>ids.reduce((a,i)=>a+(L.boss&&SP2[i].home===L.boss?1:SP2[i].lv),0);
function v2new(li){const L=L2[li],st={li,deck:shuf(L.deck.slice()),hand:[],sel:[],plays:L.plays,swaps:L.swaps,total:0,over:null};v2draw(st);return st}
const v2draw=st=>{while(st.hand.length<8&&st.deck.length)st.hand.push(st.deck.pop())};
const v2eval=(st,idx)=>{const L=L2[st.li],ids=idx.map(i=>st.hand[i]),c=combo(ids,L.on),ch=chips(ids,L);return {ids,combo:c,chips:ch,gain:c?ch*c.mult:0}};
function v2play(st){const L=L2[st.li];if(st.over||!st.sel.length||st.plays<=0)return null;const e=v2eval(st,st.sel);st.total+=e.gain;st.hand=st.hand.filter((_,i)=>!st.sel.includes(i));st.sel=[];st.plays--;v2draw(st);
 if(st.total>=L.target)st.over='win';else if(st.plays<=0||!st.hand.length)st.over='lose';return e}
function v2swap(st){if(st.over||!st.sel.length||st.swaps<=0)return false;st.hand=st.hand.filter((_,i)=>!st.sel.includes(i));st.sel=[];st.swaps--;v2draw(st);return true}
const RC={adj4,SP1,HOME1,L1,v1new,v1type,v1can,v1score,v1place,v1take,v1end,v1total,v1dim,SP2,HOME2,L2,PAIRS,COMBO,partner,combo,chips,v2new,v2eval,v2play,v2swap};
[[6,6],[8,8],[14,14],[60,75],[140,182],[100,138],[240,0],[280,0]].forEach((v,i)=>{L1[i].target=v[0];L1[i].best=v[1]});[20,70,80,95,130,150,200,160].forEach((v,i)=>{L2[i].target=v});

</script>
<script>
const $=id=>document.getElementById(id);
let ver=1,LI={1:0,2:0},st,sel=null,busy=false,toastT=0;
try{const s=JSON.parse(localStorage.getItem('reef')||'{}');if(s.ver)ver=s.ver;if(s.LI)LI=s.LI}catch(e){}
const save=()=>{try{localStorage.setItem('reef',JSON.stringify({ver,LI}))}catch(e){}};
const art=(a,cls)=>a&&P[a]?`<svg ${cls?'class="'+cls+'"':''} viewBox="0 0 100 100" aria-hidden="true">${P[a]()}</svg>`:'';
const sleep=ms=>new Promise(r=>setTimeout(r,window.__fast?0:ms));
function say(t,cls){document.querySelectorAll('.toast').forEach(e=>e.remove());const d=document.createElement('div');d.className='toast '+(cls||'');d.textContent=t;document.body.appendChild(d);clearTimeout(toastT);toastT=setTimeout(()=>d.remove(),1700)}
const LV=()=>ver===1?L1:L2,L=()=>LV()[LI[ver]];
function load(){document.querySelectorAll('.toast').forEach(e=>e.remove());st=ver===1?v1new(LI[1]):v2new(LI[2]);sel=null;busy=false;$('ov').hidden=true;save();render()}
function head(total,side){const l=L();$('bV1').className=ver===1?'on':'';$('bV2').className=ver===2?'on':'';
 $('lvt').textContent=(LI[ver]+1)+' / '+LV().length+'  '+l.t;$('bPrev').disabled=LI[ver]===0;$('bNext').disabled=LI[ver]===LV().length-1;
 $('tip').innerHTML=`<b>${LI[ver]?'新':'开始'}</b>${l.tip}`;$('tot').textContent=total;$('tot').className=total>=l.target?'done':'';$('tgt').textContent='/ '+l.target;$('side').innerHTML=side||'';$('barI').style.width=Math.min(100,total/l.target*100)+'%'}
const factHTML=()=>`<div class="fact"><b>过关。</b>${L().fact[1]}</div>`;
/* ---------- v1 摆鱼 ---------- */
function r1(){const l=L(),sc=v1score(st),total=v1total(st),[R,C]=v1dim(st),sp=sel!=null?st.hand[sel]:null;
 head(total,l.turns?`第 ${Math.min(st.turn,l.turns)} / ${l.turns} 回合`:(l.best>l.target?`最高 ${l.best}`:''));
 let fing=0;let b=`<div class="board" style="grid-template-columns:repeat(${C},1fr);max-width:${C*108}px">`;
 for(let r=0;r<R;r++)for(let c=0;c<C;c++){const t=v1type(st,r,c),f=st.put[r+','+c],s=f&&sc.F.find(o=>o.r===r&&o.c===c),ok=sp&&st.plays>0&&v1can(st,sp,r,c);
  b+=`<button class="cell h-${t} ${f?'fishy':''} ${ok?'hl':''}" data-r="${r}" data-c="${c}">${HOME1[t].art?art(HOME1[t].art,'cb'):''}${f?art(SP1[f].art,'cf'):`<span class="bl">${HOME1[t].n}</span>`}${s?`<span class="pt ${s.x2?'x2':''}">${s.pts}</span>`:''}${ok&&LI[1]===0&&!fing++?'<span class="finger">👆</span>':''}</button>`}
 b+='</div>';
 const subline=l.mult&&sc.F.length?`<b>${sc.sum}</b> 分 × <b>${sc.kinds}</b> 种 = <b class="t">${sc.total}</b>${l.turns?' <span>（这回合能得）</span>':''}`:(l.turns&&sc.F.length?`这回合能得 <b class="t">+${sc.total}</b>`:'');
 const first=LI[1]===0&&!Object.keys(st.put).length&&sel==null;
 const hand=st.hand.map((s,i)=>{const d=SP1[s];return `<button class="card h-${d.home} ${sel===i?'sel':''}" data-i="${i}"><span class="no">${d.pts}</span>${d.sk?'<span class="st">★</span>':''}${art(d.art)}<b>${d.n}</b><span class="hm">${HOME1[d.home].n}</span>${first&&i===0?'<span class="finger">👆</span>':''}</button>`}).join('');
 const skl=sp&&SP1[sp].sk?`${SP1[sp].n}：${SP1[sp].sk}`:(sp?`${SP1[sp].n}住${HOME1[SP1[sp].home].n}`:(l.turns&&!st.over?`这回合还能放 ${st.plays} 张`:''));
 const pass=!l.turns&&total>=l.target,last=LI[1]===L1.length-1;
 $('stage').innerHTML=`<div class="sub" id="sub">${subline}</div>${b}<div class="sk">${skl}</div>${pass?factHTML():''}<div class="hand">${hand}</div>`;
 $('foot').innerHTML=l.turns?(st.over?'':`<button class="pri" data-act="end">结束回合</button>`):`<button data-act="retry">重摆</button><button class="pri" data-act="next" ${pass?'':'disabled'}>${pass?(last?'完成':'下一关'):'还差 '+(l.target-total)+' 分'}</button>`}
const cellEl=(r,c)=>document.querySelector(`.cell[data-r="${r}"][data-c="${c}"]`);
function tapCell1(r,c){if(busy||st.over)return;const k=r+','+c;
 if(sel!=null){const s=st.hand[sel];if(v1place(st,sel,r,c)){sel=null;r1();cellEl(r,c).classList.add('pop');return}
  const t=v1type(st,r,c);say(st.plays<=0?'这回合放满了，点“结束回合”':st.put[k]?'这里已经有鱼了':t==='X'?'藻类盖住了，鱼住不了':SP1[s].n+'不住'+HOME1[t].n+'，它住'+HOME1[SP1[s].home].n,'bad');cellEl(r,c).classList.add('no');return}
 if(st.put[k]){if(v1take(st,r,c))r1();else say('已经放下的鱼不能收回')}else say('先点下面的一张牌')}
async function end1(){if(busy||st.over)return;busy=true;sel=null;const sc=v1score(st);r1();
 for(const f of sc.F){cellEl(f.r,f.c).classList.add('pop');await sleep(110)}$('sub').classList.add('pulse');await sleep(450);
 const ev=v1end(st);r1();say('+'+ev.gain,'good');await sleep(700);
 if(ev.algae){cellEl(...ev.algae).classList.add('hit');say('藻类盖住了一个空着的家','bad');await sleep(600)}
 busy=false;if(st.over)done(st.over==='win')}
/* ---------- v2 组牌 ---------- */
function r2(){const l=L(),e=st.sel.length?v2eval(st,st.sel):null;head(st.total,`放流剩 ${st.plays} 次`);
 let sub='选牌，然后放流';if(e){const nums=e.ids.map(i=>l.boss&&SP2[i].home===l.boss?1:SP2[i].lv).join(' + ');sub=e.combo.mult>1?`${e.combo.n}　<b>${e.chips}</b> × <b>${e.combo.mult}</b> = <b class="t">${e.gain}</b>`:`${e.ids.length>1?nums+' = ':''}<b class="t">${e.gain}</b>${l.on.length&&e.ids.length>1?' <span>（没凑成牌型）</span>':''}`}
 const mate=l.on.includes('pair')&&st.sel.length===1?partner(st.hand[st.sel[0]]):null,first=LI[2]===0&&!st.sel.length&&st.plays===l.plays;
 const hand=st.hand.map((s,i)=>{const d=SP2[s],on=st.sel.includes(i);return `<button class="card h-${d.home} ${on?'sel':''} ${!on&&mate===s?'mate':''}" data-i="${i}"><span class="no">${l.boss===d.home?1:d.lv}</span>${l.on.includes('pair')&&partner(s)?'<span class="st">∞</span>':''}${art(d.art)}<b>${d.n}</b><span class="hm">${HOME2[d.home].n}</span>${first&&i===0?'<span class="finger">👆</span>':''}</button>`}).join('');
 const chips=l.on.length?`<div class="chips">${l.on.map((k,i)=>`<button data-act="table" class="${i===l.on.length-1&&LI[2]<6?'new':''}">${COMBO[k].n}</button>`).join('')}<button data-act="table">牌型表</button></div>`:'';
 $('stage').innerHTML=`<div class="sub" id="sub">${sub}</div><div class="hand g4">${hand}</div>${chips}`;
 $('foot').innerHTML=st.over?'':`${l.swaps?`<button data-act="swap" ${st.sel.length&&st.swaps>0?'':'disabled'}>换牌 ${st.swaps}</button>`:''}<button class="pri" data-act="play" ${st.sel.length?'':'disabled'}>放流</button>`}
function tapCard2(i){if(busy||st.over)return;const l=L(),k=st.sel.indexOf(i);if(k>=0)st.sel.splice(k,1);else if(st.sel.length>=l.max){say('最多选 '+l.max+' 张');return}else st.sel.push(i);r2()}
async function play2(){if(busy||!st.sel.length)return;busy=true;document.querySelectorAll('.card.sel').forEach(c=>c.classList.add('fly'));$('sub').classList.add('pulse');await sleep(480);
 const e=v2play(st);r2();say('+'+e.gain+(e.combo.mult>1?'　'+COMBO[e.combo.key].n:''),'good');await sleep(500);busy=false;if(st.over)done(st.over==='win')}
function table(){const l=L();ov(`<h1 style="font-size:20px">牌型</h1><p>净化值 = 牌上数字之和 × 牌型倍数。选的牌要全部符合才算。</p><table>${l.on.map(k=>`<tr><td><b>${COMBO[k].n}</b><br>${COMBO[k].d}</td><td>${Object.entries(COMBO[k].m).map(([n,m])=>n+' 张 ×'+m).join('<br>')}</td></tr>`).join('')}</table>${l.on.includes('pair')?`<p>搭档：${PAIRS.map(p=>SP2[p[0]].n+' + '+SP2[p[1]].n).join('，')}。</p>`:''}<button class="go" data-act="close">知道了</button>`)}
/* ---------- 通用 ---------- */
const render=()=>ver===1?r1():r2();
function ov(html){$('ov').innerHTML=`<div class="sheet">${html}</div>`;$('ov').hidden=false}
function done(win){const l=L(),last=LI[ver]===LV().length-1;
 ov(win?`<h1>${last?'这片礁净化完成':'过关'}</h1><p class="big">${st.total} / ${l.target}</p><p>${l.fact[1]}</p><button class="go" data-act="${last?'retry':'next'}">${last?'再玩一次这关':'下一关'}</button>`
 :`<h1>差一点</h1><p class="big">${st.total} / ${l.target}</p><p>${ver===1?'早点放下的鱼每回合都得分；种类越多倍数越高。':'凑牌型比单放高得多。手牌不好就换。'}</p><button class="go" data-act="retry">再试一次</button>`)}
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;const d=t.dataset;
 if(t.id==='bV1'||t.id==='bV2'){ver=t.id==='bV1'?1:2;load();return}
 if(t.id==='bPrev'){if(LI[ver]>0){LI[ver]--;load()}return}
 if(t.id==='bNext'){if(LI[ver]<LV().length-1){LI[ver]++;load()}return}
 if(d.act==='close'){$('ov').hidden=true;return}
 if(d.act==='retry'){load();return}
 if(d.act==='next'){if(LI[ver]<LV().length-1){LI[ver]++;load()}else{$('ov').hidden=true;say('这一版的关卡都打完了','good')}return}
 if(d.act==='table'){table();return}
 if(busy)return;
 if(d.act==='end'){end1();return}
 if(d.act==='play'){play2();return}
 if(d.act==='swap'){if(v2swap(st))r2();return}
 if(d.r!=null&&ver===1){tapCell1(+d.r,+d.c);return}
 if(d.i!=null){if(ver===1){if(st.over)return;sel=sel===+d.i?null:+d.i;r1()}else tapCard2(+d.i)}});
load();
</script>
