<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#061d26"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black"></head><body style="margin:0"><title>记忆礁</title>
<style>
/* 布局：竖屏一屏。顶=能量与进度，一句提示，中=水道战场（左礁石，右外海），底=记忆卡托盘。单一深海配色。 */
:root{color-scheme:dark;
 --sea:#061d26;--deep:#0b2c38;--panel:#123f4e;--line:#1f5362;--ink:#e9f5f2;--dim:#8db1b5;
 --sun:#ffc93c;--good:#4fd39a;--bad:#ff7a59;
 --ui:"PingFang SC","HarmonyOS Sans SC","MiSans","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
 --num:"DIN Alternate","Bahnschrift","Roboto Condensed",ui-monospace,monospace}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--sea);color:var(--ink);font:15px/1.5 var(--ui);-webkit-tap-highlight-color:transparent;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:2px solid var(--sun);outline-offset:2px}
#app{max-width:440px;margin:0 auto;min-height:100%;box-sizing:border-box;display:flex;flex-direction:column;gap:8px;padding-inline:16px;padding-block:10px 14px}
.hud{display:flex;align-items:center;gap:10px}
.en{display:flex;align-items:center;gap:6px;font:700 24px var(--num);color:var(--sun);min-width:86px;font-variant-numeric:tabular-nums}
.en i{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle,#fff6c8 0 30%,#ffc93c 60%,rgba(255,201,60,0) 72%);flex:none}
.en.bump b{animation:bump .25s}
@keyframes bump{50%{transform:scale(1.35)}}
.en b{display:inline-block}
.prog{flex:1;height:12px;border-radius:99px;background:#14323c;border:1px solid var(--line);position:relative;overflow:hidden}
.prog i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#6f8f2a,#b5c94a);width:0}
.prog s{position:absolute;top:-1px;bottom:-1px;width:3px;background:var(--bad)}
.hud .sm{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);color:var(--dim);font-size:13px;font-weight:700;flex:none}
.lv{font-size:12.5px;color:var(--dim);white-space:nowrap}
.tip{margin:0;font-size:15px;line-height:1.45;min-height:44px;text-wrap:pretty}
.tip b{display:inline-block;background:var(--sun);color:#221a00;border-radius:6px;font-size:12px;padding:0 6px;margin-right:6px;vertical-align:2px}
.field{position:relative;width:100%;margin-block:auto;border-radius:14px;overflow:hidden;background:linear-gradient(90deg,#0e4a5c,#0b3a52 60%,#0a2f4a);touch-action:manipulation}
.field .home{position:absolute;left:0;top:0;bottom:0;width:26px;background:linear-gradient(90deg,#c98a6a,#a86a55);border-right:3px solid #7c4a3c}
.field .mw{position:absolute;left:3px;width:20px;height:20px;border-radius:50%;border:3px solid #dff6ff;border-right-color:transparent;animation:spin 2.4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.cellb{position:absolute;border:1px solid rgba(255,255,255,.07);border-radius:8px}
.field.pick .cellb.free{background:rgba(255,201,60,.1);border-color:rgba(255,201,60,.5)}
.spr{position:absolute;left:0;top:0;pointer-events:none;will-change:transform}
.spr svg{width:100%;height:100%;display:block;overflow:visible}
.spr.flash svg{filter:brightness(2.4)}
.spr.bit{animation:shake .25s infinite}
@keyframes shake{25%{margin-left:-2px}75%{margin-left:2px}}
.spr .hp{position:absolute;left:12%;right:12%;bottom:0;height:4px;border-radius:9px;background:rgba(0,0,0,.5)}
.spr .hp i{display:block;height:100%;border-radius:9px;background:var(--good)}
.shot{position:absolute;left:0;top:0;width:13px;height:13px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,#9fe6d8);pointer-events:none}
.shot.trigger{background:radial-gradient(circle at 35% 35%,#fff,#ffb36b)}
.sunb{position:absolute;left:0;top:0;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:radial-gradient(circle,#fffbe0 0 22%,#ffc93c 46%,rgba(255,201,60,.35) 60%,rgba(255,201,60,0) 72%);z-index:6;animation:twk 1s infinite alternate;pointer-events:auto}
.sunb.old{opacity:.45}
@keyframes twk{to{filter:brightness(1.25)}}
.bub{position:absolute;width:10px;height:10px;border-radius:50%;border:2px solid #cfeffa;pointer-events:none;animation:bub .5s forwards}
@keyframes bub{to{transform:translate(var(--dx),var(--dy)) scale(.3);opacity:0}}
.flow{position:absolute;height:60%;width:90px;border-radius:99px;background:linear-gradient(90deg,rgba(223,246,255,0),rgba(223,246,255,.85));pointer-events:none}
.banner{position:absolute;left:0;right:0;top:38%;text-align:center;font-size:28px;font-weight:900;letter-spacing:.2em;color:var(--bad);text-shadow:0 2px 0 #3a0f04;animation:ban 2.4s forwards;pointer-events:none;z-index:8}
@keyframes ban{0%{transform:scale(2.4);opacity:0}15%{transform:scale(1);opacity:1}80%{opacity:1}100%{opacity:0}}
.finger{position:absolute;font-size:28px;animation:tap 1s infinite;pointer-events:none;z-index:9}
@keyframes tap{50%{transform:translate(-4px,-6px) scale(.9)}}
.tray{display:flex;gap:7px}
.card{position:relative;flex:1;max-width:84px;height:104px;border-radius:11px;background:linear-gradient(#1a5666,#103e4c);border:2px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:5px;overflow:hidden}
.card svg{position:absolute;left:14%;top:6px;width:72%;height:50px}
.card b{font-size:13.5px;line-height:1.15}
.card small{font-size:10.5px;color:var(--dim);line-height:1.2}
.card .co{position:absolute;right:0;top:0;padding:0 6px;border-radius:0 8px 0 9px;background:var(--sun);color:#221a00;font:700 14px/21px var(--num)}
.card .cdm{position:absolute;left:0;right:0;top:0;background:rgba(3,14,19,.72);pointer-events:none}
.card.sel{border-color:var(--sun);transform:translateY(-6px);box-shadow:0 6px 14px rgba(0,0,0,.45)}
.card.poor{filter:saturate(.3) brightness(.7)}
.ov{position:fixed;inset:0;z-index:40;background:rgba(3,14,19,.86);display:flex;align-items:center;justify-content:center;padding:16px}
.sheet{width:100%;max-width:380px;max-height:100%;overflow:auto;background:var(--deep);border:1px solid var(--line);border-radius:18px;padding:20px 18px;text-align:center}
.sheet h1{margin:0 0 6px;font-size:26px;letter-spacing:.05em}
.sheet p{margin:8px 0;color:#cfe3e1;text-align:left}
.sheet .new{margin:12px auto 0;width:150px;border-radius:14px;border:2px solid var(--sun);background:linear-gradient(#1a5666,#103e4c);padding:10px 8px;animation:rise .5s}
.sheet .new svg{width:110px;height:84px}
.sheet .new b{display:block;font-size:19px}
.sheet .new small{color:var(--sun);font-weight:700}
@keyframes rise{from{transform:translateY(30px) scale(.8);opacity:0}}
.sheet .go{display:block;width:100%;margin-top:14px;background:var(--sun);color:#221a00;font-weight:700;font-size:16px;border-radius:12px;padding:12px}

.modes{display:flex;align-items:center;gap:10px}
.seg{display:flex;border:1px solid var(--line);border-radius:99px;overflow:hidden;flex:none}
.seg button{padding:4px 14px;font-size:13px;color:var(--dim);font-weight:700}
.seg button.on{background:var(--ink);color:var(--sea)}
.modes span{font-size:12.5px;color:var(--dim);margin-left:auto}
.mode{display:flex;flex-direction:column;gap:8px;flex:1}
.goal{display:flex;flex-direction:column;gap:5px}
.goal .n{display:flex;align-items:baseline;gap:8px;font:700 16px var(--num);font-variant-numeric:tabular-nums;color:var(--dim)}
.goal .n b{font-size:34px;line-height:1;color:var(--sun)}
.goal .n em{font:700 18px var(--num);margin-left:auto;font-style:normal;color:var(--good)}
.bar{height:10px;border-radius:99px;background:#2a3117;overflow:hidden;border:1px solid #3c4a1c}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#1fa7b8,#4fd39a);border-radius:99px;transition:width .5s}
.slots,.chand{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.slots{padding:10px 8px;border-radius:14px;background:linear-gradient(#0e4a5c,#0b3a52);margin-block:auto}
.slot{position:relative;height:122px;border-radius:10px;border:2px dashed rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:12px}
.slot.algae{border:2px solid #3c4a1c;background:radial-gradient(circle at 30% 30%,#6b7a2c 0 20%,transparent 21%),radial-gradient(circle at 70% 65%,#56642a 0 24%,transparent 25%),#2a3117;color:#aab777}
.slot.tgt{border-color:var(--sun);animation:glow .9s infinite alternate}
@keyframes glow{to{box-shadow:0 0 0 3px rgba(255,201,60,.55)}}
.cc{position:relative;width:100%;height:122px;border-radius:10px;background:linear-gradient(#1a5666,#103e4c);border:2px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:0 2px 5px;overflow:hidden;text-align:center}
.cc svg{position:absolute;left:10%;top:20px;width:80%;height:42px}
.cc b{font-size:12.5px;line-height:1.15}
.cc small{font-size:10.5px;line-height:1.2;color:var(--sun);min-height:25px;display:flex;align-items:center}
.cc .no{position:absolute;left:0;top:0;min-width:22px;height:22px;border-radius:8px 0 9px 0;background:#dfe9ea;color:#10242b;font:700 14px/22px var(--num)}
.cc.fx{background:linear-gradient(#3a2f5e,#251e42);border-color:#51448a}
.cc.sel{border-color:var(--sun);transform:translateY(-8px);box-shadow:0 6px 14px rgba(0,0,0,.45)}
.slot .cc{height:100%;border:0}
.slot .cc .no{display:none}
.slot.full{border:2px solid var(--line)}
.slot .pt{position:absolute;right:-5px;top:-9px;min-width:28px;height:28px;border-radius:99px;background:var(--sun);color:#221a00;font:700 16px/28px var(--num);text-align:center;padding:0 5px;z-index:2;box-shadow:0 2px 5px rgba(0,0,0,.4)}
.slot .pt.z{background:#59626a;color:#dfe5e8}
.slot .gr{position:absolute;left:-4px;top:-8px;border-radius:99px;background:var(--good);color:#06231c;font:700 11px/18px var(--num);padding:0 5px;z-index:2}
.slot .net{position:absolute;inset:0;background:repeating-linear-gradient(45deg,rgba(255,122,89,.35) 0 2px,transparent 2px 9px),repeating-linear-gradient(-45deg,rgba(255,122,89,.35) 0 2px,transparent 2px 9px);z-index:1;border-radius:8px}
.slot.pop{animation:cpop .3s}
@keyframes cpop{40%{transform:scale(1.12);filter:brightness(1.5)}}
.slot.gone{animation:cgone .5s}
@keyframes cgone{40%{filter:brightness(2.4) saturate(0)}}
.ctext{min-height:62px;font-size:13.5px;line-height:1.45;color:var(--dim)}
.ctext b{color:var(--ink);font-size:15px;margin-right:6px}
.ctext i{font-style:normal;color:var(--sun)}
.foot{display:flex;gap:8px}
.foot button{flex:1;border-radius:12px;padding:13px 4px;font-weight:700;font-size:15.5px;background:var(--panel);border:1px solid var(--line)}
.foot button.pri{flex:2;background:var(--sun);color:#221a00;border-color:var(--sun)}
.foot button[disabled]{opacity:.35}
.foot small{font-weight:400;opacity:.75;font-size:12.5px}
.sheet .offer{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.sheet .offer .cc{height:132px}
.sheet .offer p{grid-column:1/-1}
.ctoast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 120px);transform:translateX(-50%);background:rgba(4,18,24,.95);border:1px solid var(--line);border-radius:12px;padding:8px 16px;font-size:15px;font-weight:700;z-index:30;max-width:86vw;text-align:center;pointer-events:none}

.scene{position:relative;width:100%;aspect-ratio:100/88;border-radius:14px;overflow:hidden;transition:filter 1s;touch-action:manipulation;flex:none}
.scene .bg{position:absolute;inset:0;width:100%;height:100%}
.scene .haze{position:absolute;inset:0;background:#4a4a14;pointer-events:none;transition:opacity 1s;mix-blend-mode:multiply}
#cSpots,#cMurk,#cFx{position:absolute;inset:0}
#cMurk,#cFx{pointer-events:none}
.murk{position:absolute;width:30%;aspect-ratio:1;margin:-15% 0 0 -15%;border-radius:50%;background:radial-gradient(circle,rgba(10,14,8,.95) 0 34%,rgba(10,14,8,.7) 52%,rgba(10,14,8,0) 72%);transition:opacity 1.2s,transform 1.2s}
.murk.gone{opacity:0;transform:scale(1.5)}
.rub{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;opacity:.9;pointer-events:none}
.rub svg{width:100%;height:100%}
.cr{position:absolute;display:block}
.cr .cs{display:block;width:100%;height:100%;transform-origin:50% 70%;transition:transform .5s;filter:drop-shadow(0 2px 3px rgba(0,0,0,.4))}
.cr svg{width:100%;height:100%;display:block;overflow:visible}
.cr.res{z-index:3}.cr.hab{z-index:2}.cr.solo{z-index:3}
.cr.swim{animation:swim 3.4s ease-in-out infinite alternate}
@keyframes swim{to{transform:translate(-7px,5px)}}
.cr .v{position:absolute;left:50%;bottom:-7px;transform:translateX(-50%);min-width:18px;height:17px;border-radius:99px;background:rgba(4,18,24,.82);color:var(--sun);font:700 12px/17px var(--num);text-align:center;padding:0 4px}
.cr .v.x2{background:var(--good);color:#06231c}
.cr.on .cs{filter:drop-shadow(0 0 5px #fff)}
.cr.pulse .cs{animation:crp .35s}
@keyframes crp{40%{filter:brightness(1.9) drop-shadow(0 0 8px #fff3b0)}}
.ring{position:absolute;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;border:3px dashed var(--sun);background:rgba(255,201,60,.16);z-index:5;animation:ringp .8s infinite alternate}
@keyframes ringp{to{box-shadow:0 0 0 6px rgba(255,201,60,.28)}}
.fl{position:absolute;transform:translate(-50%,-50%);font:800 17px var(--num);color:var(--sun);text-shadow:0 1px 2px #000,0 0 6px rgba(0,0,0,.6);animation:flo .9s forwards;z-index:8}
.fl.x2{color:var(--good);font-size:20px}
@keyframes flo{to{transform:translate(-50%,-190%);opacity:0}}
.wave{position:absolute;width:20px;height:20px;margin-left:-10px;margin-top:-10px;border-radius:50%;border:2px solid rgba(160,245,220,.9);animation:wav .7s forwards;transform:translate(0,0)}
@keyframes wav{to{transform:scale(5);opacity:0}}
.chand .cc{touch-action:none;height:116px}
.cc.hb{background:linear-gradient(#5a4a3c,#3b3029);border-color:#7d6650}
.cc.dead{opacity:.5}
.cc.lift{opacity:.25}
.cc.ghost{position:fixed;left:0;top:0;width:72px;height:116px;z-index:60;pointer-events:none;box-shadow:0 10px 22px rgba(0,0,0,.5);border-color:var(--sun)}
.mini{background:var(--sun);color:#221a00;border-radius:99px;padding:1px 13px;font-weight:700;font-size:13px}
.mini.alt{background:none;border:1px solid var(--line);color:var(--dim)}
.ctext{min-height:44px;font-size:13px}

.erow{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--dim);margin-bottom:-4px}
.ebig{font:800 24px var(--num);color:var(--sun);display:flex;align-items:baseline;gap:2px}
.cc .no{background:var(--sun);color:#221a00}
.cc .pv{position:absolute;right:5px;top:3px;font:700 11.5px var(--num);color:var(--dim)}
.cost{font:700 13px var(--num);color:var(--sun);margin-right:6px}
.alg{position:absolute;width:76px;height:76px;margin:-40px 0 0 -38px;z-index:4;pointer-events:none}
.alg svg{width:100%;height:100%}
.cr.off .cs{filter:grayscale(1) brightness(.6)}
.warn{position:absolute;width:74px;height:74px;margin:-40px 0 0 -37px;border-radius:50%;border:3px solid var(--bad);z-index:4;pointer-events:none;animation:warnp .7s infinite alternate}
.warn i{position:absolute;right:-6px;top:-6px;font-style:normal;background:var(--bad);color:#2a0d05;font-size:11px;font-weight:800;border-radius:99px;padding:0 6px;line-height:18px}
@keyframes warnp{to{box-shadow:0 0 0 5px rgba(255,122,89,.3);transform:scale(1.04)}}
.fl.bad{color:var(--bad)}

/* ===== 牌桌版：颜色各管一件事。黄=能量和费用，青=净化，橄榄绿=藻类，橙红=警告 ===== */
#mCG{--pur:#5fe3d0;--alg:#7a9a2e}
.pm{display:flex;align-items:center;gap:10px}
.pnum{font:700 14px var(--num);color:var(--dim);white-space:nowrap;display:flex;align-items:baseline;gap:5px}
.pnum b{font-size:30px;line-height:1;color:var(--pur);display:inline-block}
.pnum.bump b{animation:bump .22s}
.pbar{flex:1;height:14px;border-radius:99px;background:#2a3117;border:1px solid #46541f;position:relative;overflow:hidden}
.pbar i{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#1fa7b8,var(--pur));transition:width .3s}
.pbar s{position:absolute;top:0;bottom:0;width:2px;background:#0b2c38;opacity:.9}
.pbar s.on{background:#fff;opacity:.5}
.pm em{font:700 13px var(--ui);font-style:normal;color:var(--dim);white-space:nowrap}
.pm em b{color:var(--pur);font:800 17px var(--num)}
#mCG .tip{min-height:0;font-size:14px}
#mCG .tip:empty{display:none}
.table{display:flex;flex-direction:column;border-radius:14px;overflow:hidden;border:1px solid var(--line);margin-block:auto}
.table.shake{animation:tshake .35s}
@keyframes tshake{20%{transform:translate(-5px,2px)}40%{transform:translate(5px,-2px)}60%{transform:translate(-3px,1px)}80%{transform:translate(2px,0)}}
.row{position:relative;display:flex;gap:6px;justify-content:center;padding:14px 6px 7px}
.r-blue{background:linear-gradient(#2a8fc0,#145f95)}
.r-bare{background:linear-gradient(#145f95 0,#3d5568 22%,#34495a)}
.r-sand{background:linear-gradient(#34495a 0,#cdb680 26%,#d9c48f)}
.rl{position:absolute;left:8px;top:1px;font-size:10.5px;font-weight:700;letter-spacing:.2em;color:rgba(255,255,255,.75)}
.r-sand .rl{color:rgba(255,255,255,.85)}
.bs,.home{position:relative;flex:1;max-width:86px;border-radius:10px;display:flex;flex-direction:column;align-items:center}
.bs{height:56px;border:2px dashed rgba(255,255,255,.3);justify-content:center}
.bs small{font-size:10.5px;color:rgba(255,255,255,.7)}
.bs.full{border:2px solid rgba(255,255,255,.45);background:rgba(8,40,70,.45);justify-content:flex-end;padding-bottom:1px}
.bs.full .mc{width:62px;height:36px;background:none;border:0}
.home{height:94px;border:2px solid rgba(255,255,255,.28);background:rgba(8,24,32,.5);padding:2px}
.home.bare{border-style:dashed;justify-content:center;background:rgba(8,24,32,.25)}
.home.bare svg{width:44px;height:44px}
.home.bare small{font-size:10.5px;color:rgba(255,255,255,.7)}
.home.k-coral{border-color:#ff8a6b}.home.k-anem{border-color:#ff6fae}.home.k-sand{border-color:#fff3cf;background:rgba(90,70,30,.35)}
.hh{position:relative;width:100%;height:30px;display:flex;align-items:center;justify-content:center;gap:3px;border-radius:7px;background:rgba(255,255,255,.08)}
.hh svg{width:26px;height:26px}
.hh b{font-size:11.5px}
.rr{display:flex;gap:3px;width:100%;flex:1;margin-top:3px}
.rs{flex:1;border-radius:7px;border:1.5px dashed rgba(255,255,255,.25)}
.mc{position:relative;flex:1;border-radius:7px;background:linear-gradient(#f4efe2,#ddd3bb);border:1.5px solid #fff;display:flex;align-items:center;justify-content:center;min-width:0}
.mc svg{width:92%;height:78%}
.mc.on,.hh.on{outline:2px solid var(--sun)}
.val{position:absolute;right:-4px;bottom:-5px;min-width:19px;height:19px;border-radius:99px;background:var(--pur);color:#04302a;font:800 12.5px/19px var(--num);font-style:normal;text-align:center;padding:0 4px;z-index:2;box-shadow:0 1px 3px rgba(0,0,0,.5)}
.hh .val{right:-3px;top:-6px;bottom:auto}
.x2>.val{background:#fff;box-shadow:0 0 0 2px var(--pur)}
.gr{position:absolute;left:-3px;top:-6px;font:700 10px/15px var(--num);font-style:normal;background:#0b2c38;color:var(--pur);border-radius:99px;padding:0 4px;z-index:2}
.tgt{border:2.5px solid var(--sun)!important;box-shadow:0 0 0 3px rgba(255,201,60,.3);animation:tg .8s infinite alternate}
.tgt.over{background:rgba(255,201,60,.35)!important;transform:scale(1.05)}

#cScene .z-sand{background:linear-gradient(#36506a 0,#5f93a3 38%,#e3cf99 62%,#cdb780)}
.slot .cap{top:auto;bottom:-2px}
.slot .cap i{width:5px;height:5px;border-width:1px}
.cr.xs .sa,.cr.xs .sh{min-width:12px;height:12px;font-size:9px;line-height:12px;padding:0 1px;bottom:-7px}
.cr.k-eel::after{content:"";position:absolute;left:18%;right:18%;bottom:-3px;height:7px;border-radius:50%;background:rgba(60,40,10,.55);z-index:-1}
.cr.k-eel .sw{animation:eelbob 3.2s ease-in-out infinite alternate}@keyframes eelbob{to{transform:translateY(3px) scaleY(.94)}}
#cScene .z-top::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(90deg,transparent 0 60px,rgba(255,255,255,.13) 60px 96px,transparent 96px 190px);-webkit-mask-image:repeating-linear-gradient(0deg,transparent 0 13px,#000 13px 15px,transparent 15px 31px);mask-image:repeating-linear-gradient(0deg,transparent 0 13px,#000 13px 15px,transparent 15px 31px);background-size:190px 100%;animation:flowx 7s linear infinite}
@keyframes flowx{to{background-position:-190px 0}}
.lt s{text-decoration:none;font-size:7px;letter-spacing:1px;opacity:.7;margin-left:2px}
.lt em{font:800 11px/17px var(--num);font-style:normal;margin-left:3px;color:#7a4a00;background:#ffd166;border-radius:99px;padding:0 4px}
.cc.ghost.spr{background:none;border:0;box-shadow:none;width:62px;height:62px;overflow:visible}
.cc.ghost.spr>*:not(.art){display:none}
.cc.ghost.spr .art{background:none;height:62px;margin:0;filter:drop-shadow(0 10px 10px rgba(0,0,0,.5))}
.cc.ghost.spr .art svg{width:100%;height:100%}
@media (prefers-reduced-motion:reduce){#cScene .z-top::after,.cr.k-eel .sw{animation:none}}

 const add=(k,c,re)=>{const d=CD[k.id],x=S.cells[c],had=seen[k.id]||0,v=d.a+(d.home&&inHome(S,c,d.home)?d.hb:0)+(x.lush?1:0)+(d.school?had:0);seen[k.id]=had+1;if(v){tot+=v;steps.push({u:k.u,cell:c,op:'+',v,tot,re})}if(d.gen==='e')steps.push({u:k.u,cell:c,op:'e',v:1,tot,re});if(d.gen==='c'&&(had+1)%2===0)steps.push({u:k.u,cell:c,op:'c',v:1,tot,re});

function cplay(i,t){const k=S.hand[i];if(!k)return false;const u=k.u,rects={};S.foes.forEach(f=>{const el=foeEl(f.u);if(el)rects[f.u]=rectOf(el)});const n0=S.drops.length,tf=t&&t.foe!=null&&S.foes[t.foe]?S.foes[t.foe].u:null,nh=S.hand.length;
 const hn=chint();if(hn&&hn.lock&&(i!==hn.card||!t||t.cell!==hn.cell)){const c=document.querySelector(`#cHand .cc[data-h="${hn.card}"]`),sl=document.querySelector(`#cScene .slot[data-cell="${hn.cell}"]`);tone(180,.1,'sine',.04);csel=null;crender();[document.querySelector(`#cHand .cc[data-h="${hn.card}"]`),document.querySelector(`#cScene .slot[data-cell="${hn.cell}"]`)].forEach(e=>{if(e){e.classList.remove('nudge');void e.offsetWidth;e.classList.add('nudge')}});return 'lock'}
 const kid=k.id,oldRect=t&&t.cell!=null?rectOf(document.querySelector(`#cScene .slot[data-cell="${t.cell}"]`)):null;if(!cgPlay(S,i,t))return false;const swapped=S.swapped;S.swapped=null;if(!cSeen[kid]){cSeen[kid]=1;csave()}csel=null;cinfo=null;SFX.place();const px=S.pfx,dr=S.drops.slice(n0);S.drops.length=0;crender();

  else if(px.t==='push'){const fe=foeEl(px.u);if(fe){pop(rectOf(fe),'撞退','add');fe.classList.add('hit')}tone(160,.15,'sine',.07)}
  else if(px.t==='heart'){pop(rectOf($('cHeart')),'+1','heal');$('cHeart').classList.add('bump');tone(880,.15,'sine',.08)}
  else if(px.t==='draw'){$('cDeck').classList.add('bump');const c=document.querySelectorAll('#cHand .cc');for(let q=1;q<=(px.n||1)&&q<=c.length;q++)c[c.length-q].classList.add('drop');tone(660,.12,'sine',.08)}}
 dr.forEach(d=>{if(rects[d.u])flyTo(rects[d.u],d.drop==='energy'?$('cOrbs'):$('cDeck'),d.drop==='energy'?'en':'cd')});
 if(t&&t.cell!=null){const d=CD[kid],cor=document.querySelector(`#cScene .slot[data-cell="${t.cell}"] .cor`),me=crEl(u);if(d.home&&me&&inHome(S,t.cell,d.home)){pop(rectOf(me),'+'+d.hb,'add');if(cor)cor.classList.add('hug');burst(rectOf(me),6,'w');tone(784,.14,'triangle',.07)}else if(d.terr&&cor){S.cells[t.cell].cs.forEach(o=>{if(CD[o.id].home===d.terr){const e=crEl(o.u);if(e)e.classList.add('drop')}});document.querySelectorAll('#cHand .cc').forEach((c,j)=>{if(S.hand[j]&&CD[S.hand[j].id].home===d.terr)c.classList.add('drop')})}}
 const el=t&&t.cell!=null?(crEl(u)||document.querySelector(`#cScene .slot[data-cell="${t.cell}"] .cor`)):$('cOrbs');if(el)el.classList.add(el.id==='cOrbs'?'bump':'drop');if(S.over)cfinish();return true}
function cwhy(k,t){const d=CD[k.id];if(S.energy<d.e)return '能量不够：它要 '+d.e+' 点';if(d.fx==='cleanup')return '净滩要拖到一个污染源身上';if(!t||t.cell==null)return '拖到一个格子上';const x=S.cells[t.cell],l=laneOf(t.cell);if(polluted(S,t.cell))return '这格被污染盖住了';if(d.fx==='zoox')return x.lush?'这格已经很茂盛了':'虫黄藻要用在一格珊瑚上';if(d.terr)return !d.z.includes(l)?d.n+'只能长在'+d.z.map(z=>ZN[z]).join('、'):x.coral&&x.kind!==d.terr?'这格已经长了别的':d.n+'最多 3 级';if(!d.z.includes(l))return d.n+'只生活在'+d.z.map(z=>ZN[z]).join('、');return '放不了'}

function csnap(x,y,T){const t=targetAt(x,y);document.querySelectorAll('#cScene .slot.hov').forEach(e=>e.classList.remove('hov','hswp'));if(!t||t.cell==null)return null;const m=T.find(q=>q.cell===t.cell);if(!m)return null;const el=document.querySelector(`#cScene .slot[data-cell="${t.cell}"]`);if(!el)return null;el.classList.add('hov');if(m.swap)el.classList.add('hswp');return rectOf(el)}
const targetAt=(x,y)=>{let ru=null;for(const n of document.elementsFromPoint(x,y)){if(!n.closest||!n.closest('#cScene'))continue;const f=n.closest('.foe');if(f)return {foe:+f.dataset.foe};const cr=n.closest('.cr');if(cr&&ru==null)ru=+cr.dataset.u;const s=n.closest('.slot');if(s)return {cell:+s.dataset.cell,ru};}const r=$('cScene').getBoundingClientRect();return x>r.left&&x<r.right&&y>r.top&&y<r.bottom?{any:1}:null};
document.addEventListener('pointerdown',e=>{if(mode!=='cg'||cbusy||!S||S.over)return;const c=e.target.closest('#cHand .cc');if(!c)return;cdrag={i:+c.dataset.h,x0:e.clientX,y0:e.clientY,moved:false,ghost:null,pid:e.pointerId};try{c.setPointerCapture(e.pointerId)}catch(_){}
 clearTimeout(lpT);const i=cdrag.i;lpT=setTimeout(()=>{if(cdrag&&!cdrag.moved&&cdrag.i===i){const id=S.hand[i].id;cdrag=null;showCard(id)}},480)});
document.addEventListener('pointermove',e=>{if(!cdrag||e.pointerId!==cdrag.pid)return;if(!cdrag.moved){if(Math.hypot(e.clientX-cdrag.x0,e.clientY-cdrag.y0)<9)return;cdrag.moved=true;clearTimeout(lpT);csel=null;cact=null;cinfo=null;const src=document.querySelector(`#cHand .cc[data-h="${cdrag.i}"]`),g=src.cloneNode(true);g.classList.add('ghost');g.classList.add(CD[S.hand[cdrag.i].id].fx?'fxg':'spr');g.classList.remove('sel','dead');g.removeAttribute('data-h');g.style.cssText='';document.body.appendChild(g);cdrag.ghost=g;crender();const s2=document.querySelector(`#cHand .cc[data-h="${cdrag.i}"]`);if(s2)s2.classList.add('lift')}
 let gx=e.clientX,gy=e.clientY,off=46;const hv=csnap(...upPt(e.clientX,e.clientY,56),cgTargets(S,S.hand[cdrag.i].id));if(hv){gx+=(hv[0]-upPt(gx,gy,56)[0])*.55;gy+=(hv[1]-upPt(gx,gy,56)[1])*.55}
 cdrag.ghost.style.transform=`translate(${gx}px,${gy}px) translate(-50%,-50%)${RS()} translateY(-${off}px) rotate(${hv?0:Math.max(-8,Math.min(8,((ROT?e.clientY-cdrag.y0:e.clientX-cdrag.x0))*.05))}deg) scale(${hv?1:.85})`;cdrag.ghost.classList.toggle('bad',!hv&&!!targetAt(...upPt(e.clientX,e.clientY,56))&&!CD[S.hand[cdrag.i].id].any);e.preventDefault()},{passive:false});
function cdrop(e){clearTimeout(lpT);if(!cdrag||e.pointerId!==cdrag.pid)return;const d=cdrag;cdrag=null;if(d.ghost)d.ghost.remove();
 if(!d.moved){csel=csel===d.i?null:d.i;cact=null;cinfo=null;crender();return}
 const k=S.hand[d.i],t=targetAt(...upPt(e.clientX,e.clientY,56));if(!t){crender();return}
 if(CD[k.id].any){if(!cplay(d.i,{any:1})){csay('能量不够',1);crender()}return}
 const r=cplay(d.i,t);if(r)return;csay(cwhy(k,t),1);tone(140,.12,'square',.04);csel=d.i;crender()}
document.addEventListener('pointerdown',e=>{if(mode!=='cg'||cbusy||!S||S.over||cdrag)return;const c=e.target.closest&&e.target.closest('#cScene .cr');if(!c)return;const u=+c.dataset.u;if(!cgMoveTargets(S,u).length)return;cmv={u,x0:e.clientX,y0:e.clientY,moved:false,ghost:null,pid:e.pointerId,html:c.querySelector('.sw').innerHTML}});
document.addEventListener('pointermove',e=>{if(!cmv||e.pointerId!==cmv.pid)return;if(!cmv.moved){if(Math.hypot(e.clientX-cmv.x0,e.clientY-cmv.y0)<9)return;cmv.moved=true;csel=null;cinfo=null;const g=document.createElement('div');g.className='mghost';g.innerHTML=cmv.html;document.body.appendChild(g);cmv.ghost=g;crender()}
 {let gx=e.clientX,gy=e.clientY;const hv=csnap(...upPt(gx,gy,30),cgMoveTargets(S,cmv.u));if(hv){const q=upPt(gx,gy,30);gx+=(hv[0]-q[0])*.55;gy+=(hv[1]-q[1])*.55}cmv.ghost.style.transform=`translate(${gx}px,${gy}px) translate(-50%,-50%)${RS()} translateY(-30px)`}e.preventDefault()},{passive:false});
function cmvEnd(e,cancel){if(!cmv||e.pointerId!==cmv.pid)return;const m=cmv;cmv=null;if(m.ghost)m.ghost.remove();if(!m.moved)return;const t=cancel?null:targetAt(...upPt(e.clientX,e.clientY,30));
 if(t&&t.cell!=null&&cgMove(S,m.u,t.cell,t.ru===m.u?null:t.ru)){SFX.place();crender();const el=crEl(m.u);if(el)el.classList.add('drop');return}
 if(t&&t.cell!=null)tone(140,.12,'square',.04);crender()}

 if(t.id==='mA'||t.id==='mB'){mode=t.id==='mA'?'cg':'td';$('mA').className=mode==='cg'?'on':'';$('mB').className=mode==='td'?'on':'';$('mCG').hidden=mode!=='cg';$('mTD').hidden=mode!=='td';$('ov').hidden=true;applyLand();try{localStorage.setItem('reefMode',mode)}catch(e){}

 if(t.id==='cLvB'){ov(`<h1 style="font-size:20px">选关</h1><div class="lvs">${LV.map((l,i)=>`<button class="go ${i===S.lv?'':'alt'}" data-golv="${i}">${i+1}　${l.n}</button>`).join('')}</div><button class="go alt" data-cact="close">返回</button>`);return}
 if(cbusy||S.over)return;
 if(t.id==='cDis'){let n0=S.hand.length;const r=cgDrawAct(S);if(r){n0-=r.out;if(r.out)csay('手牌满了：最旧的 '+r.out+' 张回了弃牌堆');csel=null;SFX.sun();crender();document.querySelectorAll('#cHand .cc').forEach((c,i)=>{if(i>=n0)c.classList.add('drop')})}return}

  const key='f'+S.foes[fi].u;cinfo=cinfo===key?null:key;crender();return}
 if(d.cell!=null){const c=+d.cell,x=S.cells[c];if(csel!=null){const crr=e.target.closest('.cr');if(cplay(csel,{cell:c,ru:crr?+crr.dataset.u:null}))return;csay(cwhy(S.hand[csel],{cell:c}),1);tone(140,.12,'square',.04);return}
  const cr=e.target.closest('.cr');if(cr){const key='u'+cr.dataset.u;cinfo=cinfo===key?null:key;crender()}else if(x.cs.length){const key='u'+x.cs[0].u;cinfo=cinfo===key?null:key;crender()}return}});
