<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#061d26"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black"></head><body style="margin:0"><title>记忆礁</title>
<style>
/* 布局：竖屏一屏。顶=能量与进度，一句提示，中=水道战场（左礁石，右外海），底=记忆卡托盘。单一深海配色。 */
:root{color-scheme:dark;
 --sea:#061d26;--deep:#0b2c38;--panel:#123f4e;--line:#1f5362;--ink:#e9f5f2;--dim:#8db1b5;
 --sun:#ffc93c;--good:#4fd39a;--bad:#ff7a59;
 --ui:"PingFang SC","HarmonyOS Sans SC","MiSans","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
 --num:"DIN Alternate","Bahnschrift","Roboto Condensed",ui-monospace,monospace}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--sea);color:var(--ink);font:15px/1.5 var(--ui);-webkit-tap-highlight-color:transparent;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:2px solid var(--sun);outline-offset:2px}
#app{max-width:440px;margin:0 auto;min-height:100%;box-sizing:border-box;display:flex;flex-direction:column;gap:10px;padding-inline:16px;padding-block:10px 14px}
.hud{display:flex;align-items:center;gap:10px}
.en{display:flex;align-items:center;gap:6px;font:700 24px var(--num);color:var(--sun);min-width:86px;font-variant-numeric:tabular-nums}
.en i{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle,#fff6c8 0 30%,#ffc93c 60%,rgba(255,201,60,0) 72%);flex:none}
.en.bump b{animation:bump .25s}
@keyframes bump{50%{transform:scale(1.35)}}
.en b{display:inline-block}
.prog{flex:1;height:12px;border-radius:99px;background:#14323c;border:1px solid var(--line);position:relative;overflow:hidden}
.prog i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#6f8f2a,#b5c94a);width:0}
.prog s{position:absolute;top:-1px;bottom:-1px;width:3px;background:var(--bad)}
.hud .sm{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);color:var(--dim);font-size:13px;font-weight:700;flex:none}
.lv{font-size:12.5px;color:var(--dim);white-space:nowrap}
.tip{margin:0;font-size:15px;line-height:1.45;min-height:44px;text-wrap:pretty}
.tip b{display:inline-block;background:var(--sun);color:#221a00;border-radius:6px;font-size:12px;padding:0 6px;margin-right:6px;vertical-align:2px}
.field{position:relative;width:100%;margin-block:auto;border-radius:14px;overflow:hidden;background:linear-gradient(90deg,#0e4a5c,#0b3a52 60%,#0a2f4a);touch-action:manipulation}
.field .home{position:absolute;left:0;top:0;bottom:0;width:26px;background:linear-gradient(90deg,#c98a6a,#a86a55);border-right:3px solid #7c4a3c}
.field .mw{position:absolute;left:3px;width:20px;height:20px;border-radius:50%;border:3px solid #dff6ff;border-right-color:transparent;animation:spin 2.4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.cellb{position:absolute;border:1px solid rgba(255,255,255,.07);border-radius:8px}
.field.pick .cellb.free{background:rgba(255,201,60,.1);border-color:rgba(255,201,60,.5)}
.spr{position:absolute;left:0;top:0;pointer-events:none;will-change:transform}
.spr svg{width:100%;height:100%;display:block;overflow:visible}
.spr.flash svg{filter:brightness(2.4)}
.spr.bit{animation:shake .25s infinite}
@keyframes shake{25%{margin-left:-2px}75%{margin-left:2px}}
.spr .hp{position:absolute;left:12%;right:12%;bottom:0;height:4px;border-radius:9px;background:rgba(0,0,0,.5)}
.spr .hp i{display:block;height:100%;border-radius:9px;background:var(--good)}
.shot{position:absolute;left:0;top:0;width:13px;height:13px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,#9fe6d8);pointer-events:none}
.shot.trigger{background:radial-gradient(circle at 35% 35%,#fff,#ffb36b)}
.sunb{position:absolute;left:0;top:0;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:radial-gradient(circle,#fffbe0 0 22%,#ffc93c 46%,rgba(255,201,60,.35) 60%,rgba(255,201,60,0) 72%);z-index:6;animation:twk 1s infinite alternate;pointer-events:auto}
.sunb.old{opacity:.45}
@keyframes twk{to{filter:brightness(1.25)}}
.bub{position:absolute;width:10px;height:10px;border-radius:50%;border:2px solid #cfeffa;pointer-events:none;animation:bub .5s forwards}
@keyframes bub{to{transform:translate(var(--dx),var(--dy)) scale(.3);opacity:0}}
.flow{position:absolute;height:60%;width:90px;border-radius:99px;background:linear-gradient(90deg,rgba(223,246,255,0),rgba(223,246,255,.85));pointer-events:none}
.banner{position:absolute;left:0;right:0;top:38%;text-align:center;font-size:28px;font-weight:900;letter-spacing:.2em;color:var(--bad);text-shadow:0 2px 0 #3a0f04;animation:ban 2.4s forwards;pointer-events:none;z-index:8}
@keyframes ban{0%{transform:scale(2.4);opacity:0}15%{transform:scale(1);opacity:1}80%{opacity:1}100%{opacity:0}}
.finger{position:absolute;font-size:28px;animation:tap 1s infinite;pointer-events:none;z-index:9}
@keyframes tap{50%{transform:translate(-4px,-6px) scale(.9)}}
.tray{display:flex;gap:7px}
.card{position:relative;flex:1;max-width:84px;height:104px;border-radius:11px;background:linear-gradient(#1a5666,#103e4c);border:2px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:5px;overflow:hidden}
.card svg{position:absolute;left:14%;top:6px;width:72%;height:50px}
.card b{font-size:13.5px;line-height:1.15}
.card small{font-size:10.5px;color:var(--dim);line-height:1.2}
.card .co{position:absolute;right:0;top:0;padding:0 6px;border-radius:0 8px 0 9px;background:var(--sun);color:#221a00;font:700 14px/21px var(--num)}
.card .cdm{position:absolute;left:0;right:0;top:0;background:rgba(3,14,19,.72);pointer-events:none}
.card.sel{border-color:var(--sun);transform:translateY(-6px);box-shadow:0 6px 14px rgba(0,0,0,.45)}
.card.poor{filter:saturate(.3) brightness(.7)}
.ov{position:fixed;inset:0;z-index:40;background:rgba(3,14,19,.86);display:flex;align-items:center;justify-content:center;padding:16px}
.sheet{width:100%;max-width:380px;max-height:100%;overflow:auto;background:var(--deep);border:1px solid var(--line);border-radius:18px;padding:20px 18px;text-align:center}
.sheet h1{margin:0 0 6px;font-size:26px;letter-spacing:.05em}
.sheet p{margin:8px 0;color:#cfe3e1;text-align:left}
.sheet .new{margin:12px auto 0;width:150px;border-radius:14px;border:2px solid var(--sun);background:linear-gradient(#1a5666,#103e4c);padding:10px 8px;animation:rise .5s}
.sheet .new svg{width:110px;height:84px}
.sheet .new b{display:block;font-size:19px}
.sheet .new small{color:var(--sun);font-weight:700}
@keyframes rise{from{transform:translateY(30px) scale(.8);opacity:0}}
.sheet .go{display:block;width:100%;margin-top:14px;background:var(--sun);color:#221a00;font-weight:700;font-size:16px;border-radius:12px;padding:12px}
@media (prefers-reduced-motion:reduce){.sunb,.field .mw,.finger{animation:none}}
</style>
<div id="app">
 <div class="hud"><div class="en" id="enBox"><i></i><b id="en">0</b></div><div class="prog"><i id="pg"></i><s id="pgf"></s></div><span class="lv" id="lv"></span><button class="sm" id="bPrev" aria-label="上一关">‹</button><button class="sm" id="bNext" aria-label="下一关">›</button><button class="sm" id="bSnd" aria-label="声音">声</button></div>
 <p class="tip" id="tip"></p>
 <div class="field" id="field"></div>
 <div class="tray" id="tray"></div>
</div>
<div class="ov" id="ov" hidden></div>
<script>let UID=0;const uid=p=>p+(++UID);
function star(cx,cy,n,rIn,rOut,rot=0){let p=[];for(let k=0;k<n*2;k++){const a=rot-Math.PI/2+k*Math.PI/n,r=k%2?rIn:rOut;p.push((cx+r*Math.cos(a)).toFixed(1)+','+(cy+r*Math.sin(a)).toFixed(1))}return p.join(' ')}
const EYE=(x,y,r=1.8)=>`<circle cx="${x}" cy="${y}" r="${r+1}" fill="#fff"/><circle cx="${x}" cy="${y}" r="${r}" fill="#111"/>`;
function fishBody(col,opt={}){const id=uid('fb');const d=opt.d||'M16 50 C26 34 54 31 74 39 C84 43 90 47 90 50 C90 53 84 57 74 61 C54 69 26 66 16 50Z';
 return `<defs><clipPath id="${id}"><path d="${d}"/></clipPath></defs><path d="${opt.tail||'M18 50 L4 38 C7 46 7 54 4 62Z'}" fill="${opt.tc||col}"/>${opt.fins||''}<path d="${d}" fill="${col}"/><g clip-path="url(#${id})">${opt.pattern||''}</g>${EYE(opt.ex||78,opt.ey||46)}`}
const P={
 turtle:(s='#6f5a2c',k='#8fa35a',sc='#c9b27a')=>`
  <path d="M34 40 C16 34 4 22 6 16 C17 18 29 29 38 36Z" fill="${k}"/><path d="M66 40 C84 34 96 22 94 16 C83 18 71 29 62 36Z" fill="${k}"/>
  <path d="M40 73 C32 81 29 89 32 91 C38 87 43 81 45 76Z" fill="${k}"/><path d="M60 73 C68 81 71 89 68 91 C62 87 57 81 55 76Z" fill="${k}"/>
  <ellipse cx="50" cy="20" rx="8" ry="10" fill="${k}"/><circle cx="46.5" cy="16.5" r="1.5" fill="#111"/><circle cx="53.5" cy="16.5" r="1.5" fill="#111"/>
  <ellipse cx="50" cy="53" rx="21" ry="26" fill="${s}"/>
  <path d="M50 31 L58 39 L58 51 L50 57 L42 51 L42 39Z M50 57 L58 65 L50 75 L42 65Z M42 39 L31 43 M58 39 L69 43 M42 51 L30 56 M58 51 L70 56 M42 65 L35 70 M58 65 L65 70" fill="none" stroke="${sc}" stroke-width="1.4" stroke-linejoin="round"/>`,
 hawksbill:()=>P.turtle('#8a5a2a','#b08a52','#e0b776')+`<path d="M47 12 L50 8 L53 12" fill="#b08a52"/>`,
 loggerhead:()=>P.turtle('#9a5b2e','#c08a4e','#e2b37c').replace('rx="8" ry="10"','rx="10" ry="11"'),
 ridley:()=>P.turtle('#6b6b52','#8e9170','#bdbb96'),
 leatherback:()=>`<path d="M34 40 C14 34 2 20 4 12 C16 15 29 28 38 36Z" fill="#2d3238"/><path d="M66 40 C86 34 98 20 96 12 C84 15 71 28 62 36Z" fill="#2d3238"/><ellipse cx="50" cy="19" rx="8" ry="10" fill="#2d3238"/><path d="M50 28 C66 30 70 52 64 74 L50 94 L36 74 C30 52 34 30 50 28Z" fill="#23272c"/><path d="M50 30 V90 M42 34 L40 78 M58 34 L60 78" stroke="#8b9199" stroke-width="1.2" fill="none"/>${[40,50,60,70].map(y=>`<circle cx="46" cy="${y}" r="1" fill="#c7ccd2"/><circle cx="55" cy="${y+4}" r="1" fill="#c7ccd2"/>`).join('')}`,
 snake:(a='#a9c6de',b='#1c2530')=>{const d='M6 62 C18 40 32 40 42 56 S66 76 80 54 S92 40 92 40';return `<path d="${d}" fill="none" stroke="${a}" stroke-width="9" stroke-linecap="round"/><path d="${d}" fill="none" stroke="${b}" stroke-width="9" stroke-dasharray="4 7"/><path d="M4 58 L10 72 L12 60Z" fill="${b}"/><ellipse cx="93" cy="39" rx="6.5" ry="4.5" fill="${b}" transform="rotate(-30 93 39)"/><ellipse cx="96" cy="41" rx="3" ry="1.8" fill="#f2c94c" transform="rotate(-30 96 41)"/><circle cx="92" cy="37" r="1" fill="#fff"/>`},
 snake2:()=>P.snake('#d9d4b2','#3a4a3e'),
 octopus:(c='#b8573c',l='#e58b6c')=>{const arms=[[42,58,'C34 70 22 70 16 80 C13 86 20 88 22 83'],[46,60,'C42 74 34 82 34 92'],[50,60,'C50 74 46 84 50 94'],[54,60,'C58 74 66 82 66 92'],[58,58,'C66 70 78 70 84 80 C87 86 80 88 78 83'],[40,54,'C28 58 16 54 8 60'],[60,54,'C72 58 84 54 92 60'],[48,60,'C44 70 40 76 42 84']];
  return arms.map(a=>`<path d="M${a[0]} ${a[1]} ${a[2]}" fill="none" stroke="${c}" stroke-width="5" stroke-linecap="round"/>`).join('')+`<ellipse cx="50" cy="32" rx="19" ry="24" fill="${c}"/>${[[44,22],[56,26],[50,16],[46,34],[57,38]].map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="2.2" fill="${l}"/>`).join('')}${EYE(42,48,2)}${EYE(58,48,2)}`},
 octopus2:()=>{let s='';for(let k=0;k<8;k++){s+=`<path d="M${40+k*2.5} 50 L${6+k*12} 94" stroke="#d9c7a8" stroke-width="4.5" stroke-linecap="round"/><path d="M${40+k*2.5} 50 L${6+k*12} 94" stroke="#4a3526" stroke-width="4.5" stroke-dasharray="5 5"/>`}return s+`<ellipse cx="50" cy="32" rx="14" ry="20" fill="#d9c7a8"/><path d="M38 26 H62 M37 36 H63" stroke="#4a3526" stroke-width="3"/>${EYE(44,46,1.6)}${EYE(56,46,1.6)}`},
 blueringed:()=>P.octopus('#d8b24a','#e8cf7a')+[[44,20],[56,24],[50,34],[40,30],[60,34]].map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="none" stroke="#1d5fd0" stroke-width="2"/>`).join(''),
 cuttle:()=>`<path d="M12 50 C12 32 30 26 58 28 C74 29 80 38 80 50 C80 62 74 71 58 72 C30 74 12 68 12 50Z" fill="#a8866a"/><path d="M14 50 C14 36 30 31 58 32 C72 33 77 40 77 50 C77 60 72 67 58 68 C30 69 14 64 14 50Z" fill="#c9a98a"/>${[[30,42],[44,40],[58,44],[36,56],[52,58],[66,52]].map(p=>`<ellipse cx="${p[0]}" cy="${p[1]}" rx="4" ry="2.5" fill="#f1e2cf"/>`).join('')}<path d="M80 44 C88 42 94 40 97 38 M80 48 C88 47 94 47 98 46 M80 52 C88 53 94 54 98 55 M80 56 C88 58 94 61 97 63" stroke="#a8866a" stroke-width="3.5" stroke-linecap="round"/>${EYE(76,44,1.8)}`,
 squid:()=>`<path d="M6 50 L22 38 L22 62Z" fill="#c9d6de"/><path d="M18 50 C18 42 40 40 62 43 C74 45 78 47 78 50 C78 53 74 55 62 57 C40 60 18 58 18 50Z" fill="#dbe6ec" stroke="#9fb6c3"/>${[42,46,50,54,58].map(y=>`<path d="M76 ${50+(y-50)*.4} C86 ${y} 92 ${y+ (y-50)*.3} 97 ${y+(y-50)*.5}" stroke="#c9d6de" stroke-width="2.4" stroke-linecap="round" fill="none"/>`).join('')}${EYE(72,48,2.2)}`,
 nudi:()=>`<path d="M8 56 C8 40 30 36 52 36 C74 36 94 42 94 56 C94 66 74 70 52 70 C30 70 8 66 8 56Z" fill="#3e6fd6" stroke="#fff" stroke-width="3"/><path d="M18 54 C40 50 64 50 86 54" stroke="#141414" stroke-width="3" fill="none"/>${[[30,46],[44,44],[58,45],[36,62],[60,63]].map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="1.4" fill="#fff"/>`).join('')}<path d="M18 41 L13 26 M26 39 L24 24" stroke="#f08a24" stroke-width="4" stroke-linecap="round"/><path d="M76 39 L70 26 M80 38 L79 23 M84 39 L88 25 M88 41 L95 30" stroke="#f08a24" stroke-width="3" stroke-linecap="round"/>`,
 phyllidia:()=>`<path d="M8 56 C8 38 30 34 52 34 C74 34 94 40 94 56 C94 68 74 72 52 72 C30 72 8 68 8 56Z" fill="#111"/>${[[24,46],[40,42],[56,42],[72,46],[32,60],[50,62],[68,60]].map(p=>`<ellipse cx="${p[0]}" cy="${p[1]}" rx="6" ry="4" fill="#9ec3e8"/><circle cx="${p[0]}" cy="${p[1]-1}" r="2" fill="#f2c230"/>`).join('')}<path d="M16 40 L12 28 M24 38 L22 26" stroke="#f2c230" stroke-width="4" stroke-linecap="round"/>`,
 aeolid:()=>{let s='<path d="M6 62 C20 56 60 54 94 60 C70 66 30 68 6 62Z" fill="#e8dcc0"/>';for(let k=0;k<14;k++){const x=16+k*5.4;s+=`<path d="M${x} 60 C${x-6} 46 ${x+4} 38 ${x-2} ${30+(k%3)*4}" stroke="${k%2?'#6fa86a':'#d9a441'}" stroke-width="3.2" stroke-linecap="round" fill="none"/>`}return s+`<path d="M90 58 L96 44 M86 58 L90 44" stroke="#e8dcc0" stroke-width="3" stroke-linecap="round"/>`},
 elysia:()=>`<path d="M8 60 C14 44 34 30 54 32 C74 34 92 44 94 58 C80 52 70 66 52 66 C34 66 22 54 8 60Z" fill="#4c9a48"/><path d="M20 58 C30 46 44 40 56 42 C70 44 82 50 88 56" stroke="#8fd08a" stroke-width="2" fill="none"/><path d="M90 50 L97 40 M86 48 L90 38" stroke="#4c9a48" stroke-width="3.5" stroke-linecap="round"/>${[[36,50],[52,46],[66,50]].map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="1.5" fill="#dff5a8"/>`).join('')}`,
 cone:()=>`<path d="M20 30 L86 44 C92 46 92 54 86 56 L20 70 C12 66 10 56 10 50 C10 44 12 34 20 30Z" fill="#e9dcc2"/>${[[30,40],[40,46],[52,40],[60,52],[36,58],[70,48],[48,56]].map(p=>`<path d="M${p[0]} ${p[1]} l5 -2 l2 4 l-5 2z" fill="#8a4b2c"/>`).join('')}<path d="M20 30 C14 38 14 62 20 70" stroke="#c4b391" stroke-width="2" fill="none"/><path d="M88 50 L98 48" stroke="#c96b4a" stroke-width="2.5" stroke-linecap="round"/>`,
 cowrie:()=>`<ellipse cx="50" cy="52" rx="40" ry="26" fill="#7a4a2e"/><ellipse cx="50" cy="48" rx="34" ry="19" fill="#b98556"/>${[[34,42],[48,38],[62,42],[40,52],[56,52],[70,48],[28,52]].map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="#f0dcc0"/>`).join('')}<path d="M16 60 C40 70 60 70 84 60" stroke="#3f2616" stroke-width="2" fill="none"/>`,
 clam:()=>`<path d="M6 62 C10 40 30 30 50 30 C70 30 90 40 94 62 C80 70 20 70 6 62Z" fill="#d7cfbd"/><path d="M14 58 C18 44 34 38 50 38 C66 38 82 44 86 58" fill="none" stroke="#b7ad96" stroke-width="2"/><path d="M12 62 L20 54 L28 62 L36 54 L44 62 L52 54 L60 62 L68 54 L76 62 L84 54 L90 62 C70 72 30 72 12 62Z" fill="#2f6fb3"/>${[[24,62],[40,62],[56,62],[72,62]].map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="2" fill="#7fd0f0"/>`).join('')}<ellipse cx="50" cy="65" rx="5" ry="2.5" fill="#1b3f6a"/>`,
 cots:()=>`<polygon points="${star(50,52,14,24,44)}" fill="#6d5a86"/><circle cx="50" cy="52" r="24" fill="#7d6a96"/>${Array.from({length:40},(_,k)=>{const a=k*0.9,r=8+(k%5)*7;return `<circle cx="${(50+r*Math.cos(a)).toFixed(1)}" cy="${(52+r*Math.sin(a)).toFixed(1)}" r="1.6" fill="#e39b93"/>`}).join('')}`,
 linckia:()=>`<polygon points="${star(50,52,5,9,46)}" fill="#2f6fd6" stroke="#1f4fa6" stroke-width="2" stroke-linejoin="round"/>${[0,1,2,3,4].map(k=>{const a=-Math.PI/2+k*2*Math.PI/5;return `<circle cx="${50+28*Math.cos(a)}" cy="${52+28*Math.sin(a)}" r="1.4" fill="#9cc2ff"/>`}).join('')}`,
 urchin:()=>{let s='';for(let k=0;k<36;k++){const a=k*Math.PI/18,r=k%2?44:36;s+=`<line x1="50" y1="56" x2="${(50+r*Math.cos(a)).toFixed(1)}" y2="${(56+r*Math.sin(a)*.8).toFixed(1)}" stroke="#16181c" stroke-width="1.6"/>`}return s+`<circle cx="50" cy="56" r="15" fill="#1d2126"/><circle cx="50" cy="52" r="4" fill="#e0782f"/>${[0,1,2,3,4].map(k=>{const a=-Math.PI/2+k*2*Math.PI/5;return `<circle cx="${50+10*Math.cos(a)}" cy="${56+10*Math.sin(a)}" r="1.4" fill="#5fb3ff"/>`}).join('')}`},
 cucumber:()=>`<path d="M8 58 C8 42 30 38 52 38 C76 38 92 44 92 56 C92 66 74 70 52 70 C30 70 8 70 8 58Z" fill="#3b2b24"/>${Array.from({length:14},(_,k)=>`<circle cx="${14+k*5.6}" cy="${44+(k%3)*3}" r="2.2" fill="#c78b4a"/>`).join('')}<path d="M6 58 C2 52 2 64 6 62" fill="#e8d5b0"/>`,

<script>/* 守礁：水道防守（规则层，无界面；浏览器与 node 共用）。x 以“格”为单位，0=礁石一侧，COLS=外海一侧 */

 parrot:{n:'鹦嘴鱼',cost:100,hp:70,cd:5,art:'parrot',shoot:1.4,dmg:{algae:20,big:20,cots:5},role:'啃藻',fact:'鹦嘴鱼用鸟喙一样的牙刮食礁石上的藻类，磨碎的石灰质排出来就是白沙。'},

 urchin:{n:'海胆',cost:50,hp:420,cd:14,art:'urchin',graze:9,role:'挡在前面',fact:'海胆夜里出来啃藻。海胆大量死亡的礁区，藻类很快就会盖过珊瑚。'},
 trigger:{n:'炮弹鱼',cost:150,hp:80,cd:7,art:'trigger',shoot:1.5,dmg:{algae:10,big:10,cots:60},role:'专吃海星',fact:'长棘海星浑身毒刺，天敌很少。炮弹鱼、苏眉鱼和大法螺是少数敢吃它的动物。'},
 shark:{n:'礁鲨',cost:150,hp:1,cd:30,art:'shark',dash:1,role:'冲过整条水道',fact:'有鲨鱼巡游的礁，说明下面整条食物链是健康的。'}};

 algae:{n:'藻团',hp:100,sp:.16,eat:20},
 big:{n:'大藻团',hp:300,sp:.12,eat:26},

const TDL=[
 {t:'第一条水道',rows:1,cards:['parrot'],e0:150,sky:5,tip:'藻团正朝礁石漂来。点“鹦嘴鱼”，再点水道里的一格。落下来的光点一下就能收集。',script:[[9,'algae'],[21,'algae'],[30,'algae'],[37,'algae'],[43,'algae'],[48,'algae']],fin:[55,['algae','algae','algae','algae']],unlock:'coral'},
 {t:'晒太阳',rows:3,cards:['coral','parrot'],e0:100,sky:7,tip:'珊瑚晒太阳会产出能量。先种几丛珊瑚，再放鹦嘴鱼。',gen:{start:18,gap:[8,4.2],dur:75},fin:['algae','algae','algae','algae','algae','algae'],unlock:'urchin'},
 {t:'大藻团',rows:5,cards:['coral','parrot','urchin'],e0:100,sky:7,tip:'大藻团很难啃完。把海胆放在前面挡住它，让后面的鹦嘴鱼慢慢啃。',gen:{start:16,gap:[7,3.6],dur:95,big:[35,.3]},fin:['algae','algae','big','algae','big','algae','algae','big','algae'],unlock:'trigger'},
 {t:'长棘海星',rows:5,cards:['coral','parrot','urchin','trigger'],e0:100,sky:7,tip:'长棘海星专吃珊瑚，鹦嘴鱼几乎咬不动它。炮弹鱼才是它的天敌。',gen:{start:18,gap:[8,4.4],dur:100,big:[45,.2],cots:[26,.33]},fin:['algae','cots','big','algae','cots','algae','cots','big','algae','cots'],unlock:'shark'},
 {t:'大潮',rows:5,cards:['coral','parrot','urchin','trigger','shark'],e0:125,sky:7,tip:'礁鲨会冲过整条水道，清掉一路。留到最危险的时候再用。',gen:{start:16,gap:[7,3.4],dur:115,big:[35,.25],cots:[24,.3]},fin:['algae','cots','big','algae','cots','algae','cots','big','algae','cots','big','algae','algae','cots']}];
function tdScript(L){if(L.script){const s=L.script.map(e=>[e[0],e[1],0]);L.fin[1].forEach((k,i)=>s.push([L.fin[0]+i*1.6,k,0,1]));return {s,finT:L.fin[0]}}
 const g=L.gen,s=[];let t=g.start;while(t<g.dur){const p=(t-g.start)/(g.dur-g.start);let k='algae';if(g.cots&&t>g.cots[0]&&Math.random()<g.cots[1])k='cots';else if(g.big&&t>g.big[0]&&Math.random()<g.big[1])k='big';
  s.push([t,k,Math.floor(Math.random()*L.rows)]);t+=(g.gap[0]+(g.gap[1]-g.gap[0])*p)*(.8+Math.random()*.4)}
 const finT=g.dur+6;L.fin.forEach((k,i)=>s.push([finT+i*1.1,k,i%L.rows===0?Math.floor(Math.random()*L.rows):(i*2)%L.rows,1]));return {s,finT}}
function tdNew(li){const L=TDL[li],sc=tdScript(L);let id=0;
 const G={li,L,t:0,energy:L.e0,units:[],foes:[],shots:[],suns:[],mow:Array(L.rows).fill(true),cd:{},script:sc.s.sort((a,b)=>a[0]-b[0]),finT:sc.finT,si:0,sky:3,over:null,ev:[],total:sc.s.length,killed:0,nid:()=>++id};
 L.cards.forEach(k=>G.cd[k]=0);return G}
const unitAt=(G,r,c)=>G.units.find(u=>u.r===r&&u.c===c);
function tdCan(G,k,r,c){const U=UNITS[k];if(G.over||G.energy<U.cost||G.cd[k]>0||r<0||r>=G.L.rows||c<0||c>=COLS)return false;return U.dash?true:!unitAt(G,r,c)}
function tdPlace(G,k,r,c){if(!tdCan(G,k,r,c))return false;const U=UNITS[k];G.energy-=U.cost;G.cd[k]=U.cd;
 if(U.dash){G.shots.push({id:G.nid(),r,x:-.6,dash:1,v:5});G.ev.push(['dash',r]);return true}
 G.units.push({id:G.nid(),k,r,c,hp:U.hp,t:U.shoot?U.shoot*.6:0,st:U.sun?U.sun*.45:0});G.ev.push(['place',r,c]);return true}
function tdSun(G,id){const i=G.suns.findIndex(s=>s.id===id);if(i<0)return false;G.energy+=G.suns[i].v;G.suns.splice(i,1);G.ev.push(['sun']);return true}
function tdStep(G,dt){if(G.over)return;G.t+=dt;const L=G.L;for(const k in G.cd)G.cd[k]=Math.max(0,G.cd[k]-dt);
 while(G.si<G.script.length&&G.script[G.si][0]<=G.t){const e=G.script[G.si++],F=FOES[e[1]];if(e[3]&&!G.finOn){G.finOn=1;G.ev.push(['wave'])}G.foes.push({id:G.nid(),k:e[1],r:e[2],x:COLS+.4+Math.random()*.3,hp:F.hp,ph:Math.random()*6})}
 G.sky-=dt;if(G.sky<=0){G.sky=L.sky;G.suns.push({id:G.nid(),x:.5+Math.random()*(COLS-1),y:-.6,ty:-.15+Math.random()*(L.rows-.7),life:10,v:25})}
 for(const s of G.suns){if(s.y<s.ty)s.y=Math.min(s.ty,s.y+dt*1.1);else s.life-=dt}G.suns=G.suns.filter(s=>s.life>0);
 for(const u of G.units){const U=UNITS[u.k];
  if(U.sun){u.st+=dt;if(u.st>=U.sun){u.st=0;G.suns.push({id:G.nid(),x:u.c+.5,y:u.r+.2,ty:u.r+.2,life:10,v:25,born:1})}}
  if(U.shoot){u.t+=dt;if(u.t>=U.shoot&&G.foes.some(f=>f.r===u.r&&f.x>u.c+.3&&f.x<COLS+.3)){u.t=0;G.shots.push({id:G.nid(),r:u.r,x:u.c+.8,k:u.k,v:4.2})}}}
 for(const s of G.shots){s.x+=s.v*dt;
  if(s.dash){for(const f of G.foes)if(f.r===s.r&&Math.abs(f.x-s.x)<.6&&f.hp>0){f.hp=0;G.ev.push(['die',f.r,f.x,f.k])}if(s.x>COLS+1)s.dead=1;continue}
  const f=G.foes.filter(f=>f.r===s.r&&f.hp>0&&f.x<=s.x+.15&&f.x>=s.x-.6).sort((a,b)=>a.x-b.x)[0];
  if(f){f.hp-=UNITS[s.k].dmg[f.k];f.hit=G.t;s.dead=1;G.ev.push(['hit']);if(f.hp<=0)G.ev.push(['die',f.r,f.x,f.k])}else if(s.x>COLS+.5)s.dead=1}
 G.shots=G.shots.filter(s=>!s.dead);
 for(const f of G.foes){if(f.hp<=0)continue;const F=FOES[f.k],u=G.units.filter(u=>u.r===f.r&&f.x<=u.c+.9&&f.x>=u.c-.1).sort((a,b)=>b.c-a.c)[0];
  if(u){f.eat=1;u.hp-=F.eat*dt;u.bit=G.t;const U=UNITS[u.k];if(U.graze&&f.k!=='cots'){f.hp-=U.graze*dt;if(f.hp<=0)G.ev.push(['die',f.r,f.x,f.k])}if(u.hp<=0){u.dead=1;G.ev.push(['eaten',u.r,u.c])}}
  else{f.eat=0;f.x-=F.sp*dt}
  if(f.x<-.25){if(G.mow[f.r]){G.mow[f.r]=false;G.shots.push({id:G.nid(),r:f.r,x:-.6,dash:1,mow:1,v:6});G.ev.push(['mow',f.r])}else{G.over='lose';G.ev.push(['lose'])}}}
 G.units=G.units.filter(u=>!u.dead);const n0=G.foes.length;G.foes=G.foes.filter(f=>f.hp>0);G.killed+=n0-G.foes.length;
 if(!G.over&&G.si>=G.script.length&&!G.foes.length){G.over='win';G.ev.push(['win'])}}
const TD={COLS,UNITS,FOES,TDL,tdNew,tdCan,tdPlace,tdSun,tdStep,unitAt};

<script>

let hitT=0;const SFX={sun:()=>{tone(880,.12,'sine',.09);setTimeout(()=>tone(1320,.14,'sine',.08),70)},place:()=>tone(220,.18,'triangle',.12,110),hit:()=>{const n=performance.now();if(n-hitT>90){hitT=n;tone(520,.05,'square',.025)}},die:()=>tone(300,.2,'sine',.1,80),eaten:()=>tone(160,.3,'sawtooth',.07,60),mow:()=>tone(200,.7,'sawtooth',.08,900),dash:()=>tone(120,.6,'sawtooth',.1,700),wave:()=>{tone(196,.5,'sawtooth',.09);setTimeout(()=>tone(147,.8,'sawtooth',.09),350)},win:()=>[523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,.25,'triangle',.1),i*130)),lose:()=>[330,262,196].forEach((f,i)=>setTimeout(()=>tone(f,.35,'sawtooth',.07),i*200))};

 CW=(F.clientWidth-HOME)/COLS;CH=L.rows===1?CW*1.5:Math.min(66,CW*1.08);F.style.height=L.rows*CH+'px';
 let h='<div class="home"></div>';for(let r=0;r<L.rows;r++){h+=`<i class="mw" data-mw="${r}" style="top:${py(r)+CH/2-13}px"></i>`;for(let c=0;c<COLS;c++)h+=`<button class="cellb free" data-r="${r}" data-c="${c}" aria-label="第${r+1}条水道第${c+1}格" style="left:${px(c)+1}px;top:${py(r)+1}px;width:${CW-2}px;height:${CH-2}px"></button>`}
 F.innerHTML=h;F.className='field';$('tip').innerHTML=`<b>第 ${li+1} 关</b>${L.tip}`;$('lv').textContent=(li+1)+'/'+TDL.length;$('bPrev').disabled=li===0;$('bNext').disabled=li===TDL.length-1;$('bSnd').style.opacity=snd?1:.4;$('pgf').style.left=(G.finT/(G.script[G.script.length-1][0]+1)*100)+'%';tray();hint()}

 if(sel==null){const c=document.querySelector('.card');c.appendChild(f);f.style.cssText='right:6px;bottom:22px'}else{$('field').appendChild(f);f.style.left=px(1)+CW*.45+'px';f.style.top=CH*.45+'px'}}

 for(const u of G.units){seen[u.id]=1;let e=els[u.id];if(!e){e=els[u.id]=mk('spr',uart(u.k)+'<span class="hp" hidden><i></i></span>');const w=CW*.92;e.style.width=w+'px';e.style.height=CH*.92+'px';e.style.transform=`translate(${px(u.c)+CW*.04}px,${py(u.r)+CH*.04}px)`;const cb=F.querySelector(`.cellb[data-r="${u.r}"][data-c="${u.c}"]`);if(cb)cb.classList.remove('free');e._r=u.r;e._c=u.c}

 for(const f of G.foes){seen[f.id]=1;let e=els[f.id];const s=f.k==='big'?1.05:f.k==='cots'?.86:.8;if(!e){e=els[f.id]=mk('spr',fart(f.k));e.style.width=CW*s+'px';e.style.height=CW*s+'px';e.style.zIndex=4}
  const bob=Math.sin(G.t*3+f.ph)*3,rot=f.k==='cots'?G.t*40+f.ph*50:(f.eat?Math.sin(G.t*14)*8:0);e.style.transform=`translate(${px(f.x)-CW*s/2}px,${py(f.r)+(CH-CW*s)/2+bob}px) rotate(${rot}deg)`;e.classList.toggle('flash',G.t-(f.hit||-9)<.08)}
 for(const s of G.shots){seen[s.id]=1;let e=els[s.id];if(!e){if(s.dash&&!s.mow){e=mk('spr',uart('shark'));e.style.width=CW*1.5+'px';e.style.height=CH+'px';e.style.zIndex=5}else if(s.mow){e=mk('flow');e.style.zIndex=5}else e=mk('shot '+s.k);els[s.id]=e}
  e.style.transform=s.dash?`translate(${px(s.x)-CW*(s.mow?.9:.75)}px,${py(s.r)+(s.mow?CH*.2:0)}px)`:`translate(${px(s.x)-6}px,${py(s.r)+CH*.42}px)`}
 for(const s of G.suns){seen[s.id]=1;let e=els[s.id];if(!e){e=els[s.id]=mk('sunb');e.dataset.sun=s.id}e.style.transform=`translate(${px(s.x)}px,${py(s.y)+CH/2}px)`;e.classList.toggle('old',s.life<2.5)}
 for(const id in els)if(!seen[id]){const e=els[id];if(e._r!=null){const cb=F.querySelector(`.cellb[data-r="${e._r}"][data-c="${e._c}"]`);if(cb)cb.classList.add('free')}e.remove();delete els[id]}
 G.mow.forEach((m,r)=>{const e=F.querySelector(`[data-mw="${r}"]`);if(e&&!m)e.remove()});
 $('en').textContent=G.energy;$('pg').style.width=Math.min(100,G.t/(G.script[G.script.length-1][0]+1)*100)+'%';
 document.querySelectorAll('.card').forEach(c=>{const k=c.dataset.k,U=UNITS[k];c.classList.toggle('poor',G.energy<U.cost);c.classList.toggle('sel',sel===k);c.lastElementChild.style.height=(G.cd[k]/U.cd*100)+'%'});
 F.classList.toggle('pick',sel!=null&&!UNITS[sel].dash);
 if(li===0&&!seenSun&&G.suns.some(s=>s.y>=s.ty)&&!document.querySelector('.finger.s')){const s=G.suns.find(s=>s.y>=s.ty),f=document.createElement('span');f.className='finger s';f.textContent='👆';f.style.left=px(s.x)+4+'px';f.style.top=py(s.y)+CH/2+6+'px';F.appendChild(f)}}
function events(){for(const e of G.ev){const k=e[0];if(SFX[k])SFX[k]();
  if(k==='die')burst(e[1],e[2]);if(k==='sun'){$('enBox').classList.remove('bump');void $('enBox').offsetWidth;$('enBox').classList.add('bump')}
  if(k==='wave'){const b=mk('banner');b.textContent='大潮来了';setTimeout(()=>b.remove(),2400)}
  if(k==='win')setTimeout(()=>finish(true),900);if(k==='lose')setTimeout(()=>finish(false),600)}G.ev.length=0}
function loop(ts){requestAnimationFrame(loop);const dt=Math.min(.05,(ts-last)/1000||0);last=ts;if(!G||paused||!$('ov').hidden||document.hidden)return;if(!G.over){const n=window.__speed||1;for(let i=0;i<n;i++)tdStep(G,dt)}events();draw()}
function ov(html){$('ov').innerHTML=`<div class="sheet">${html}</div>`;$('ov').hidden=false}
function finish(win){const L=G.L,last=li===TDL.length-1;if(!win){ov(`<h1>礁石被盖住了</h1><p>有一条水道没守住。每条水道的海流只能帮你冲一次。</p><p>${li?'先种珊瑚攒能量，再把鱼补到有敌人的水道。':'看到藻团出现，就在那条水道放鹦嘴鱼。'}</p><button class="go" data-act="retry">再来一次</button>`);return}
 const u=L.unlock&&UNITS[L.unlock];ov(`<h1>${last?'这片礁守住了':'守住了'}</h1>${u?`<p style="text-align:center">博士刻好了一张新的记忆卡</p><div class="new">${uart(L.unlock)}<b>${u.n}</b><small>${u.role}</small></div><p>${u.fact}</p>`:`<p>大潮退了，藻类没能盖住礁石。${UNITS.shark.fact}</p>`}<button class="go" data-act="${last?'retry':'next'}">${last?'再守一次':'下一关'}</button>`)}
document.addEventListener('pointerdown',e=>{const s=e.target.closest('.sunb');if(s&&G&&!G.over){e.preventDefault();if(tdSun(G,+s.dataset.sun)){seenSun=true;document.querySelectorAll('.finger.s').forEach(f=>f.remove())}}});
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;const d=t.dataset;
 if(t.id==='bSnd'){snd=!snd;save();t.style.opacity=snd?1:.4;return}
 if(t.id==='bPrev'){if(li>0){li--;start()}return}
 if(t.id==='bNext'){if(li<TDL.length-1){li++;start()}return}
 if(d.act==='retry'){start();return}
 if(d.act==='next'){li=Math.min(TDL.length-1,li+1);start();return}
 if(!G||G.over)return;
 if(d.k){const U=UNITS[d.k];if(G.energy<U.cost||G.cd[d.k]>0){tone(140,.12,'square',.04);return}sel=sel===d.k?null:d.k;hint();return}
 if(d.r!=null&&sel){if(tdPlace(G,sel,+d.r,+d.c)){sel=null;hint()}else tone(140,.12,'square',.04)}});
start();requestAnimationFrame(loop);
</script>
</body></html>
