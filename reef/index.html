<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#061d26"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black"></head><body style="margin:0"><title>记忆礁</title>
<style>
/* 布局：一屏竖版牌桌。上=关卡与净化进度，中=4×3 礁盘，下=栖息地托盘、说明条、手牌、操作。单一深海配色，不随主题切换。 */
:root{color-scheme:dark;
 --sea:#061d26;--deep:#0b2c38;--panel:#103a48;--line:#1f5362;--ink:#e9f5f2;--dim:#8db1b5;
 --sun:#ffc93c;--good:#4fd39a;--bad:#ff7a59;--algae:#5d6b2a;--water:#0f4656;
 --ui:"PingFang SC","HarmonyOS Sans SC","MiSans","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
 --num:"DIN Alternate","Bahnschrift","Roboto Condensed",ui-monospace,monospace}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--sea);color:var(--ink);font:14px/1.45 var(--ui);-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:2px solid var(--sun);outline-offset:2px}
#app{max-width:460px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:8px;padding-inline:16px;padding-block:10px 12px}
.top{display:flex;align-items:baseline;gap:10px}
.top .lv{flex:1;min-width:0;display:flex;align-items:baseline;gap:8px}
.top .lv b{font-size:20px;letter-spacing:.04em}
.top .lv span{color:var(--bad);font-size:12.5px;font-weight:700}
.top .rd{font:700 14px var(--num);color:var(--dim);letter-spacing:.04em}
.top button{border:1px solid var(--line);border-radius:99px;padding:3px 12px;font-size:12.5px;color:var(--dim)}
.meter{display:flex;align-items:center;gap:10px}
.bar{flex:1;height:12px;border-radius:99px;background:#24300f;overflow:hidden;border:1px solid #3c4a1c}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#1fa7b8,#4fd39a);border-radius:99px;transition:width .6s}
.nums{font:700 15px var(--num);font-variant-numeric:tabular-nums;white-space:nowrap}
.nums b{color:var(--sun);font-size:19px}
.prev{min-height:38px;display:flex;flex-direction:column;justify-content:center;font-size:13px;color:var(--dim)}
.prev b{font:700 17px var(--num);color:var(--ink)}
.prev b.t{color:var(--sun);font-size:20px}
.prev small{font-size:11.5px;opacity:.8}
.prev.pulse b.t{animation:pulse .5s}
@keyframes pulse{40%{transform:scale(1.5)}}
.prev b{display:inline-block}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;width:100%;max-width:min(100%,calc((100dvh - 494px)*4/3));min-width:240px;margin:0 auto}
.cell{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--water);border:1.5px dashed var(--line)}
.cell.has{border:1.5px solid transparent}
.cell.pol{border:1.5px solid #3c4a1c;background:radial-gradient(circle at 28% 30%,#6b7a2c 0 17%,transparent 18%),radial-gradient(circle at 72% 62%,#56642a 0 21%,transparent 22%),radial-gradient(circle at 40% 82%,#4a5722 0 13%,transparent 14%),#2a3117}
.cell.pol::after{content:"污染";position:absolute;left:0;right:0;bottom:4px;text-align:center;font-size:10.5px;color:#aab777;letter-spacing:.2em}
.cell.b-sand{background:linear-gradient(#dcc890,#c3ab71)}
.cell.b-blue{background:linear-gradient(#1f78b5,#0d4577)}
.cell.b-coral,.cell.b-anemone,.cell.b-seafan,.cell.b-sponge,.cell.b-seagrass{background:linear-gradient(#14586a,#0d3f4e)}
.cell svg{position:absolute;pointer-events:none}
.cell .cb{inset:6% 6% 0 6%;width:88%;height:94%;opacity:.95}
.cell.fishy .cb{opacity:.55}
.cell .cf{left:12%;top:8%;width:76%;height:76%;filter:drop-shadow(0 2px 3px rgba(0,0,0,.45))}
.cell .bl{position:absolute;left:4px;bottom:3px;font-size:10px;font-weight:700;padding:0 5px;border-radius:99px;background:rgba(0,0,0,.5);color:#fff}
.cell .pt{position:absolute;right:3px;top:3px;min-width:22px;height:22px;border-radius:99px;background:var(--sun);color:#221a00;font:700 13px/22px var(--num);text-align:center;padding:0 4px}
.cell .pt.z{background:#59626a;color:#dfe5e8}
.cell .nt{position:absolute;left:3px;top:3px;font-size:10px;font-weight:700;background:var(--bad);color:#2a0d05;border-radius:5px;padding:0 4px}
.cell.hl{border:2px solid var(--sun);box-shadow:0 0 0 2px rgba(255,201,60,.25) inset;animation:glow 1.1s infinite alternate}
.cell.hl2{border:2px dashed var(--good)}
.cell.hl2::before{content:"+栖息地";position:absolute;inset:0;display:grid;place-items:center;font-size:11px;color:var(--good);font-weight:700}
.cell.pick{outline:2px solid var(--ink);outline-offset:-2px}
.cell.pop{animation:pop .28s}
.cell.hit{animation:hit .7s}
@keyframes glow{to{box-shadow:0 0 0 4px rgba(255,201,60,.4) inset}}
@keyframes pop{40%{transform:scale(1.12);filter:brightness(1.5)}}
@keyframes hit{30%{filter:brightness(2) saturate(0)}}
.tray{display:flex;align-items:center;gap:8px}
.en{flex:none;font:700 20px var(--num);color:var(--sun);min-width:52px}
.en small{display:block;font:11px var(--ui);color:var(--dim);margin-top:-3px}
.habs{flex:1;min-width:0;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-block:2px}
.habs::-webkit-scrollbar{display:none}
.hab{flex:none;border-radius:99px;padding:5px 11px;font-size:12.5px;font-weight:700;background:var(--panel);border:1.5px solid var(--line);white-space:nowrap}
.hab.sel{border-color:var(--sun);color:var(--sun)}
.hab i{font-style:normal;display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.h-coral{--h:#ff8a6b}.h-anemone{--h:#ff6fae}.h-seafan{--h:#e85d4a}.h-sponge{--h:#f2b84b}.h-sand{--h:#e3cf9a}.h-seagrass{--h:#58c27a}.h-blue{--h:#4aa8ff}
.hab i,.home{background:var(--h)}
.info{height:96px;overflow:auto;background:var(--deep);border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-size:12.5px}
.info h3{margin:0;font-size:14px;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px}
.info h3 em{font:italic 11.5px Georgia,serif;color:var(--dim)}
.info h3 span{font-size:11.5px;font-weight:400;color:var(--dim)}
.info p{margin:2px 0 0}
.info .sk{color:var(--sun)}
.info .fa{color:var(--dim)}
.info .warn{color:var(--bad);font-weight:700}
.info button{margin-top:4px;background:var(--sun);color:#221a00;font-weight:700;border-radius:99px;padding:3px 14px}
.hand{display:flex;gap:6px;overflow-x:auto;padding-block:8px 2px;scrollbar-width:none;min-height:112px}
.hand::-webkit-scrollbar{display:none}
.card{position:relative;flex:1 0 62px;max-width:78px;height:102px;border-radius:9px;background:linear-gradient(#17505f,#0f3c49);border:1.5px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:0 2px 5px;transition:transform .15s}
.card svg{position:absolute;left:10%;top:16px;width:80%;height:44px}
.card b{font-size:12px;line-height:1.1;text-align:center}
.card .home{margin-top:3px;font-size:10px;font-weight:700;color:#10242b;border-radius:99px;padding:0 6px}
.card .co{position:absolute;left:-1px;top:-1px;width:21px;height:21px;border-radius:9px 0 9px 0;background:var(--sun);color:#221a00;font:700 13px/21px var(--num);text-align:center}
.card .pv{position:absolute;right:4px;top:2px;font:700 12px var(--num);color:var(--dim)}
.card.sel{transform:translateY(-8px);border-color:var(--sun)}
.card.off{opacity:.45}
.card.fx{background:linear-gradient(#3a2f5e,#251e42);border-color:#51448a;justify-content:center;gap:4px}
.card.fx small{font-size:10px;color:#c9c0ee;text-align:center;line-height:1.2;padding:0 2px}
.foot{display:flex;gap:8px}
.foot button{flex:1;border-radius:10px;padding:10px 4px;font-weight:700;font-size:13.5px;background:var(--panel);border:1px solid var(--line)}
.foot button.pri{flex:1.4;background:var(--sun);color:#221a00;border-color:var(--sun)}
.foot button[disabled]{opacity:.4}
.foot small{font-weight:400;opacity:.8}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 96px);transform:translateX(-50%);background:rgba(4,18,24,.94);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:13px;font-weight:700;z-index:30;max-width:86vw;text-align:center;pointer-events:none}
.toast.bad{border-color:var(--bad);color:#ffc2b0}
.toast.good{border-color:var(--good);color:#b8f3d9}
.ov{position:fixed;inset:0;z-index:40;background:rgba(3,14,19,.9);display:flex;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 16px)}
.sheet{width:100%;max-width:440px;max-height:100%;overflow:auto;background:var(--deep);border:1px solid var(--line);border-radius:16px;padding:18px 16px}
.sheet h1{margin:0 0 4px;font-size:26px;letter-spacing:.06em;text-wrap:balance}
.sheet h2{margin:16px 0 6px;font-size:15px;color:var(--sun)}
.sheet p{margin:6px 0;color:#cfe3e1}
.sheet .tag{color:var(--bad);font-weight:700;font-size:13px}
.sheet .go{display:block;width:100%;margin-top:14px;background:var(--sun);color:#221a00;font-weight:700;font-size:15px;border-radius:10px;padding:11px}
.sheet .x{float:right;border:1px solid var(--line);border-radius:99px;padding:2px 12px;color:var(--dim);font-size:12.5px}
.sheet ol{margin:6px 0;padding-left:20px}
.sheet li{margin:4px 0}
.big{display:grid;grid-template-columns:64px 1fr;gap:4px 10px;align-items:center;text-align:left;width:100%;background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:9px 10px;margin-top:8px}
.big svg{width:64px;height:54px;grid-row:span 2}
.big .fxi{width:64px;height:54px;grid-row:span 2;display:grid;place-items:center;border-radius:8px;background:#30285a;font-weight:700;color:#c9c0ee}
.big h3{margin:0;font-size:15px;display:flex;flex-wrap:wrap;gap:3px 7px;align-items:baseline}
.big h3 em{font:italic 11px Georgia,serif;color:var(--dim)}
.big .meta{font-size:11.5px;color:var(--dim)}
.big .meta .home{color:#10242b;font-weight:700;border-radius:99px;padding:0 6px}
.big p{grid-column:1/-1;margin:0;font-size:12.5px}
.big .sk{color:var(--sun)}
.big .fa{color:var(--dim)}
button.big:active{border-color:var(--sun)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<div id="app">
 <div class="top"><div class="lv"><b id="lvn"></b><span id="lvs"></span></div><div class="rd" id="rd"></div><button id="bRules">规则和牌表</button></div>
 <div class="meter"><div class="bar"><i id="barI"></i></div><div class="nums"><b id="sc">0</b> / <span id="tg"></span></div></div>
 <div class="prev" id="prev"></div>
 <div class="board" id="board"></div>
 <div class="tray"><div class="en" id="en"></div><div class="habs" id="habs"></div></div>
 <div class="info" id="info"></div>
 <div class="hand" id="hand"></div>
 <div class="foot"><button id="bPur"></button><button id="bSwap"></button><button id="bEnd" class="pri">结束回合</button></div>
</div>
<div class="ov" id="ov" hidden></div>
<script>let UID=0;const uid=p=>p+(++UID);
function star(cx,cy,n,rIn,rOut,rot=0){let p=[];for(let k=0;k<n*2;k++){const a=rot-Math.PI/2+k*Math.PI/n,r=k%2?rIn:rOut;p.push((cx+r*Math.cos(a)).toFixed(1)+','+(cy+r*Math.sin(a)).toFixed(1))}return p.join(' ')}
const EYE=(x,y,r=1.8)=>`<circle cx="${x}" cy="${y}" r="${r+1}" fill="#fff"/><circle cx="${x}" cy="${y}" r="${r}" fill="#111"/>`;
function fishBody(col,opt={}){const id=uid('fb');const d=opt.d||'M16 50 C26 34 54 31 74 39 C84 43 90 47 90 50 C90 53 84 57 74 61 C54 69 26 66 16 50Z';
 return `<defs><clipPath id="${id}"><path d="${d}"/></clipPath></defs><path d="${opt.tail||'M18 50 L4 38 C7 46 7 54 4 62Z'}" fill="${opt.tc||col}"/>${opt.fins||''}<path d="${d}" fill="${col}"/><g clip-path="url(#${id})">${opt.pattern||''}</g>${EYE(opt.ex||78,opt.ey||46)}`}
const P={
 turtle:(s='#6f5a2c',k='#8fa35a',sc='#c9b27a')=>`
  <path d="M34 40 C16 34 4 22 6 16 C17 18 29 29 38 36Z" fill="${k}"/><path d="M66 40 C84 34 96 22 94 16 C83 18 71 29 62 36Z" fill="${k}"/>
  <path d="M40 73 C32 81 29 89 32 91 C38 87 43 81 45 76Z" fill="${k}"/><path d="M60 73 C68 81 71 89 68 91 C62 87 57 81 55 76Z" fill="${k}"/>
  <ellipse cx="50" cy="20" rx="8" ry="10" fill="${k}"/><circle cx="46.5" cy="16.5" r="1.5" fill="#111"/><circle cx="53.5" cy="16.5" r="1.5" fill="#111"/>
  <ellipse cx="50" cy="53" rx="21" ry="26" fill="${s}"/>
  <path d="M50 31 L58 39 L58 51 L50 57 L42 51 L42 39Z M50 57 L58 65 L50 75 L42 65Z M42 39 L31 43 M58 39 L69 43 M42 51 L30 56 M58 51 L70 56 M42 65 L35 70 M58 65 L65 70" fill="none" stroke="${sc}" stroke-width="1.4" stroke-linejoin="round"/>`,
 hawksbill:()=>P.turtle('#8a5a2a','#b08a52','#e0b776')+`<path d="M47 12 L50 8 L53 12" fill="#b08a52"/>`,
 loggerhead:()=>P.turtle('#9a5b2e','#c08a4e','#e2b37c').replace('rx="8" ry="10"','rx="10" ry="11"'),
 ridley:()=>P.turtle('#6b6b52','#8e9170','#bdbb96'),
 leatherback:()=>`<path d="M34 40 C14 34 2 20 4 12 C16 15 29 28 38 36Z" fill="#2d3238"/><path d="M66 40 C86 34 98 20 96 12 C84 15 71 28 62 36Z" fill="#2d3238"/><ellipse cx="50" cy="19" rx="8" ry="10" fill="#2d3238"/><path d="M50 28 C66 30 70 52 64 74 L50 94 L36 74 C30 52 34 30 50 28Z" fill="#23272c"/><path d="M50 30 V90 M42 34 L40 78 M58 34 L60 78" stroke="#8b9199" stroke-width="1.2" fill="none"/>${[40,50,60,70].map(y=>`<circle cx="46" cy="${y}" r="1" fill="#c7ccd2"/><circle cx="55" cy="${y+4}" r="1" fill="#c7ccd2"/>`).join('')}`,
 snake:(a='#a9c6de',b='#1c2530')=>{const d='M6 62 C18 40 32 40 42 56 S66 76 80 54 S92 40 92 40';return `<path d="${d}" fill="none" stroke="${a}" stroke-width="9" stroke-linecap="round"/><path d="${d}" fill="none" stroke="${b}" stroke-width="9" stroke-dasharray="4 7"/><path d="M4 58 L10 72 L12 60Z" fill="${b}"/><ellipse cx="93" cy="39" rx="6.5" ry="4.5" fill="${b}" transform="rotate(-30 93 39)"/><ellipse cx="96" cy="41" rx="3" ry="1.8" fill="#f2c94c" transform="rotate(-30 96 41)"/><circle cx="92" cy="37" r="1" fill="#fff"/>`},
 snake2:()=>P.snake('#d9d4b2','#3a4a3e'),
 octopus:(c='#b8573c',l='#e58b6c')=>{const arms=[[42,58,'C34 70 22 70 16 80 C13 86 20 88 22 83'],[46,60,'C42 74 34 82 34 92'],[50,60,'C50 74 46 84 50 94'],[54,60,'C58 74 66 82 66 92'],[58,58,'C66 70 78 70 84 80 C87 86 80 88 78 83'],[40,54,'C28 58 16 54 8 60'],[60,54,'C72 58 84 54 92 60'],[48,60,'C44 70 40 76 42 84']];
  return arms.map(a=>`<path d="M${a[0]} ${a[1]} ${a[2]}" fill="none" stroke="${c}" stroke-width="5" stroke-linecap="round"/>`).join('')+`<ellipse cx="50" cy="32" rx="19" ry="24" fill="${c}"/>${[[44,22],[56,26],[50,16],[46,34],[57,38]].map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="2.2" fill="${l}"/>`).join('')}${EYE(42,48,2)}${EYE(58,48,2)}`},
 octopus2:()=>{let s='';for(let k=0;k<8;k++){s+=`<path d="M${40+k*2.5} 50 L${6+k*12} 94" stroke="#d9c7a8" stroke-width="4.5" stroke-linecap="round"/><path d="M${40+k*2.5} 50 L${6+k*12} 94" stroke="#4a3526" stroke-width="4.5" stroke-dasharray="5 5"/>`}return s+`<ellipse cx="50" cy="32" rx="14" ry="20" fill="#d9c7a8"/><path d="M38 26 H62 M37 36 H63" stroke="#4a3526" stroke-width="3"/>${EYE(44,46,1.6)}${EYE(56,46,1.6)}`},
 blueringed:()=>P.octopus('#d8b24a','#e8cf7a')+[[44,20],[56,24],[50,34],[40,30],[60,34]].map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="none" stroke="#1d5fd0" stroke-width="2"/>`).join(''),
 cuttle:()=>`<path d="M12 50 C12 32 30 26 58 28 C74 29 80 38 80 50 C80 62 74 71 58 72 C30 74 12 68 12 50Z" fill="#a8866a"/><path d="M14 50 C14 36 30 31 58 32 C72 33 77 40 77 50 C77 60 72 67 58 68 C30 69 14 64 14 50Z" fill="#c9a98a"/>${[[30,42],[44,40],[58,44],[36,56],[52,58],[66,52]].map(p=>`<ellipse cx="${p[0]}" cy="${p[1]}" rx="4" ry="2.5" fill="#f1e2cf"/>`).join('')}<path d="M80 44 C88 42 94 40 97 38 M80 48 C88 47 94 47 98 46 M80 52 C88 53 94 54 98 55 M80 56 C88 58 94 61 97 63" stroke="#a8866a" stroke-width="3.5" stroke-linecap="round"/>${EYE(76,44,1.8)}`,
 squid:()=>`<path d="M6 50 L22 38 L22 62Z" fill="#c9d6de"/><path d="M18 50 C18 42 40 40 62 43 C74 45 78 47 78 50 C78 53 74 55 62 57 C40 60 18 58 18 50Z" fill="#dbe6ec" stroke="#9fb6c3"/>${[42,46,50,54,58].map(y=>`<path d="M76 ${50+(y-50)*.4} C86 ${y} 92 ${y+ (y-50)*.3} 97 ${y+(y-50)*.5}" stroke="#c9d6de" stroke-width="2.4" stroke-linecap="round" fill="none"/>`).join('')}${EYE(72,48,2.2)}`,
 nudi:()=>`<path d="M8 56 C8 40 30 36 52 36 C74 36 94 42 94 56 C94 66 74 70 52 70 C30 70 8 66 8 56Z" fill="#3e6fd6" stroke="#fff" stroke-width="3"/><path d="M18 54 C40 50 64 50 86 54" stroke="#141414" stroke-width="3" fill="none"/>${[[30,46],[44,44],[58,45],[36,62],[60,63]].map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="1.4" fill="#fff"/>`).join('')}<path d="M18 41 L13 26 M26 39 L24 24" stroke="#f08a24" stroke-width="4" stroke-linecap="round"/><path d="M76 39 L70 26 M80 38 L79 23 M84 39 L88 25 M88 41 L95 30" stroke="#f08a24" stroke-width="3" stroke-linecap="round"/>`,
 phyllidia:()=>`<path d="M8 56 C8 38 30 34 52 34 C74 34 94 40 94 56 C94 68 74 72 52 72 C30 72 8 68 8 56Z" fill="#111"/>${[[24,46],[40,42],[56,42],[72,46],[32,60],[50,62],[68,60]].map(p=>`<ellipse cx="${p[0]}" cy="${p[1]}" rx="6" ry="4" fill="#9ec3e8"/><circle cx="${p[0]}" cy="${p[1]-1}" r="2" fill="#f2c230"/>`).join('')}<path d="M16 40 L12 28 M24 38 L22 26" stroke="#f2c230" stroke-width="4" stroke-linecap="round"/>`,
 aeolid:()=>{let s='<path d="M6 62 C20 56 60 54 94 60 C70 66 30 68 6 62Z" fill="#e8dcc0"/>';for(let k=0;k<14;k++){const x=16+k*5.4;s+=`<path d="M${x} 60 C${x-6} 46 ${x+4} 38 ${x-2} ${30+(k%3)*4}" stroke="${k%2?'#6fa86a':'#d9a441'}" stroke-width="3.2" stroke-linecap="round" fill="none"/>`}return s+`<path d="M90 58 L96 44 M86 58 L90 44" stroke="#e8dcc0" stroke-width="3" stroke-linecap="round"/>`},
 elysia:()=>`<path d="M8 60 C14 44 34 30 54 32 C74 34 92 44 94 58 C80 52 70 66 52 66 C34 66 22 54 8 60Z" fill="#4c9a48"/><path d="M20 58 C30 46 44 40 56 42 C70 44 82 50 88 56" stroke="#8fd08a" stroke-width="2" fill="none"/><path d="M90 50 L97 40 M86 48 L90 38" stroke="#4c9a48" stroke-width="3.5" stroke-linecap="round"/>${[[36,50],[52,46],[66,50]].map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="1.5" fill="#dff5a8"/>`).join('')}`,

 <li><b>污染</b>：每回合结束，藻类盖住 1 个挨着污染、没有鱼的格子（先盖空格，再盖没鱼住的栖息地）。花 ⚡${RE.PURIFY} 可以净化一格挨着干净格的污染。</li>
 <li><b>手牌</b>：每回合开始补到 5 张。每回合可以换 1 张牌。</li>
 <li><b>过关</b>：从 3 张新记忆卡里选 1 张加入牌组，连选 3 次，然后去下一片水域。</li></ol>
 <h2>三片水域</h2>${LV.map((l,i)=>`<p><b>${i+1}. ${l.n} · ${l.sub}</b>（目标 ${l.target}）：${l.rule}</p>`).join('')}
 <h2>牌表 · 鱼（${Object.keys(CARDS).filter(k=>!CARDS[k].type).length} 种）</h2>${Object.keys(CARDS).filter(k=>!CARDS[k].type).map(k=>bigCard(k)).join('')}
 <h2>牌表 · 效果</h2>${Object.keys(CARDS).filter(k=>CARDS[k].type).map(k=>bigCard(k)).join('')}
 <h2>起始牌组（${RE.START.length} 张）</h2><p>${Object.entries(RE.START.reduce((a,k)=>(a[k]=(a[k]||0)+1,a),{})).map(([k,n])=>CARDS[k].n+' ×'+n).join('，')}</p>
 <button class="go" data-act="close">回到牌局</button>`)}
function reward(first){ov(`<h1 style="font-size:22px">${LV[S.level].n}净化完成</h1><p>净化值 ${S.score} / ${S.target}。博士带来了新的记忆卡，选 1 张加入牌组（还能选 ${S.picks} 次）。</p>${S.offer.map(k=>bigCard(k,'button')).join('')}`)}
function finale(win){ov(win?`<h1>潜点净化完成</h1><p>三片水域都恢复了生态平衡。最后一片的净化值是 ${S.score} / ${S.target}。</p><p class="fa" style="color:var(--dim)">牌组里现在有 ${S.cards.length} 张记忆卡。</p><button class="go" data-act="new">再来一局</button>`
 :`<h1>污染没有退去</h1><p>${LV[S.level].n}的净化值停在 ${S.score} / ${S.target}。</p><p>提示：种类越杂倍率越高；裂唇鱼旁边放高分的鱼；别让珊瑚和空格空着被藻类盖回去。</p><button class="go" data-act="new">再来一局</button>`)}
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;const d=t.dataset;
 if(d.act==='close'){closeOv();return}
 if(d.act==='new'){S=RE.newRun();sel=pick=null;closeOv();render();intro(true);return}
 if(d.pick&&t.closest('#ov')&&S.phase==='reward'){const i=S.offer.indexOf(d.pick);if(i<0)return;RE.pickReward(S,i);if(S.phase==='reward')reward();else{sel=pick=null;render();intro(false)}return}
 if(d.usefx){useFx();return}
 if(d.r!=null){tapCell(+d.r,+d.c);return}
 if(d.i!=null){tapCard(+d.i);return}
 if(d.hab){if(busy||S.pending)return;sel=sel&&sel.t==='hab'&&sel.key===d.hab?null:{t:'hab',key:d.hab};pick=null;render();return}
 if(t.id==='bRules'){rules();return}
 if(busy)return;
 if(t.id==='bPur'){if(RE.cancel(S)){render();return}sel=null;if(!RE.purify(S))say(S.energy<RE.PURIFY?'能量不够，需要 ⚡'+RE.PURIFY:'没有能净化的污染');render();return}
 if(t.id==='bSwap'){sel=sel&&sel.t==='swap'?null:{t:'swap'};render();return}
 if(t.id==='bEnd'){endRound();return}});
function start(data){if(data&&data.S&&data.S.grid){S=data.S;render();if(S.phase==='reward')reward();else if(S.phase!=='play')finale(S.phase==='won')}else{S=RE.newRun();render();intro(true)}}
const hot=window.claude&&window.claude.hot;
if(hot&&hot.snapshot)hot.snapshot(()=>({S}));
if(hot&&hot.ready)hot.ready(start);else start(hot&&hot.data||{});
</script>
</body></html>
